<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d11">
<title>像素小兵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* 布局：常驻调试栏（可收窄）+ 游戏区（顶部工具条 / 左血量条 / 3D 翻板棋盘 / 右冷却条），可框成 iPhone 18 Pro 比例；单一暗色外观 */
:root{
  --frame:#0b0d11; --panel:#161a21; --raise:#1e242d; --line:#2a313c; --ink:#e9ece4; --muted:#8b94a1;
  --blue:#2f6bff; --orange:#ff7a1a; --gold:#ffd84a; --ok:#3fbf7f; --no:#e5534b;
  --f-pix:"Silkscreen", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-cn:"ZCOOL QingKe HuangYou","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-body:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--frame);color:var(--ink);font-family:var(--f-body);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#shell{height:100%;display:flex}
#main{flex:1;min-width:0;position:relative;display:flex;justify-content:center;align-items:center;background:#07080b}
#app{height:100%;width:100%;max-width:640px;display:flex;flex-direction:column;gap:4px;padding:6px 8px;box-sizing:border-box;background:var(--frame);position:relative}
#main.phone #app{width:auto;max-width:100%;aspect-ratio:402/874;outline:1px solid var(--line)}
#topbar{display:flex;align-items:center;gap:6px;flex:none}
.tb{font-size:12px;color:var(--ink);background:var(--raise);border:1px solid var(--line);height:28px;padding:0 10px;cursor:pointer}
.tb:disabled{opacity:.4;cursor:default}
.clock{margin-left:auto;font:700 13px var(--f-pix);font-variant-numeric:tabular-nums;color:var(--ink)}
.clock.hot{color:var(--gold)}
#row{flex:1;min-height:0;display:flex;gap:4px}
#stage{flex:1;position:relative;min-width:0}
#board{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- 两侧功能条 ---------- */
#lbar,#rbar{width:22px;flex:none;display:flex;flex-direction:column;gap:8px;padding-block:4px}
.hpcol{--side:var(--blue);flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.hpcol.s1{--side:var(--orange)}
.hpn{font:700 11px var(--f-pix);color:var(--side);font-variant-numeric:tabular-nums}
.blocks{flex:1;min-height:0;width:10px;display:flex;flex-direction:column;gap:1px}
.hpcol.s0 .blocks{flex-direction:column-reverse}
.blocks span{flex:1;min-height:1px;background:var(--side)}
.blocks span.gone{animation:gone .45s forwards}
@keyframes gone{0%{background:#fff;transform:scale(1.5,1.2)}100%{transform:scale(0);opacity:0}}
.cds{--side:var(--blue);display:flex;flex-direction:column;gap:6px;align-items:center}
.cds.s1{--side:var(--orange)}
.flip{transform:rotate(180deg)}
.cd{width:22px;height:22px;position:relative;background:var(--raise);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;box-sizing:border-box}
.cd i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--side);opacity:.35}
.cd span{position:relative;font-size:10px;color:var(--muted)}
.cd.ready{border-color:var(--side)}
.cd.ready span{color:var(--ink)}
.spacer{flex:1}

.holdn{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font:700 26px var(--f-pix);color:var(--blue);background:rgba(10,12,16,.78);padding:2px 10px;pointer-events:none;font-variant-numeric:tabular-nums}
.holdn.s1{color:var(--orange)}
.holdn.low{color:#6b7380}
.hint{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:min(92%,340px);background:rgba(10,12,16,.9);border:1px solid var(--line);padding:12px 14px;display:grid;gap:6px;font-size:13px;pointer-events:none;transition:opacity .6s}
.hint b{color:var(--gold);font-weight:600}
.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-cn);font-size:22px;background:rgba(15,18,23,.84);border:1px solid var(--line);padding:6px 16px;pointer-events:none;white-space:nowrap;animation:ban 1.5s forwards}
.banner.s0{top:70%}
.banner.s1{top:30%;transform:translate(-50%,-50%) rotate(180deg)}
@keyframes ban{0%{opacity:0}12%{opacity:1}75%{opacity:1}100%{opacity:0}}

/* ---------- 调试栏（常驻） ---------- */
#dbg{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;box-sizing:border-box}
.dbg-head{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 14px;border-bottom:1px solid var(--line)}
.dbg-head h2{font-family:var(--f-cn);font-weight:400;font-size:22px;margin:0}
.dbg-head .tag{font:700 11px var(--f-pix);color:var(--muted)}
.dbg-head .x{margin-left:auto;background:none;border:1px solid var(--line);color:var(--ink);height:28px;padding:0 8px;cursor:pointer;font-size:12px}
.dbg-note{margin:0;padding:8px 14px 0;font-size:12px;color:var(--muted)}
.dbg-list{flex:1;overflow-y:auto;padding:8px 10px 12px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.grp-t{font-size:11px;color:var(--muted);letter-spacing:.12em;padding:8px 2px 2px}
.it{background:var(--raise);border:1px solid var(--line);padding:9px 10px;display:grid;gap:6px}
.it.v-yes{border-left:3px solid var(--ok)}
.it.v-no{border-left:3px solid var(--no);opacity:.7}
.it-top{display:flex;align-items:center;gap:8px}
.it-name{font-size:14px;font-weight:600;flex:1;min-width:0}
.it-val{font:700 13px var(--f-pix);color:var(--gold);font-variant-numeric:tabular-nums}
.it-desc{font-size:11.5px;color:var(--muted);line-height:1.35}
.it.off{background:var(--panel)}
.it.off .it-name,.it.off .it-desc,.it.off .it-val,.it.off input,.it.off .seg,.it.off .sw{opacity:.4}
.it-off{font-size:11.5px;color:var(--gold);line-height:1.35}
.clr{width:44px;height:26px;padding:0;border:1px solid var(--line);background:none;cursor:pointer;flex:none}
.it input[type=range]{width:100%;accent-color:var(--blue);margin:0}
.sw{position:relative;width:40px;height:22px;border-radius:11px;background:var(--line);border:none;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw[aria-pressed="true"]{background:var(--blue)}
.sw[aria-pressed="true"]::after{transform:translateX(18px);background:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.seg button{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:6px 4px;cursor:pointer;line-height:1.25}
.seg button[aria-pressed="true"]{color:#fff;background:var(--blue);border-color:var(--blue)}
.vd{display:flex;gap:4px}
.vd button{flex:1;font-size:11.5px;color:var(--muted);background:none;border:1px solid var(--line);padding:4px 0;cursor:pointer}
.vd button.on.yes{color:#fff;background:var(--ok);border-color:var(--ok)}
.vd button.on.no{color:#fff;background:var(--no);border-color:var(--no)}
.vd button.on.wait{color:var(--frame);background:var(--muted);border-color:var(--muted)}
.stats{background:var(--raise);border:1px solid var(--line);padding:9px 10px;display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:4px 8px;font-size:12px}
.stats .h{color:var(--muted)}
.stats .n{font-family:var(--f-pix);font-variant-numeric:tabular-nums;text-align:right}
.stats .t{grid-column:1/-1;font-weight:600;font-size:13px}
.dbg-foot{padding:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:6px}
.dbg-msg{grid-column:1/-1;font-size:11.5px;color:var(--ok);min-height:14px;margin:0}
.dbg-mini{display:none;writing-mode:vertical-rl;font:15px var(--f-cn);letter-spacing:.2em;color:var(--ink);background:none;border:none;cursor:pointer;padding:16px 0;margin:0 auto}
#dbg.mini{width:36px}
#dbg.mini > :not(.dbg-mini){display:none}
#dbg.mini .dbg-mini{display:block}

/* ---------- 弹层 ---------- */
.btn{font-size:15px;color:var(--ink);background:var(--raise);border:1px solid var(--line);padding:11px 10px;cursor:pointer}
.btn.main{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.wide{grid-column:1/-1}
.ov{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(9,11,15,.9);padding:16px;box-sizing:border-box}
.panel{width:100%;max-width:380px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
h1{font-family:var(--f-cn);font-weight:400;font-size:42px;margin:0;line-height:1}
.panel h2{font-family:var(--f-cn);font-weight:400;font-size:28px;margin:0}
.sub{margin:0;color:var(--muted);font-size:14px}
.strip{display:flex;gap:3px}
.strip span{width:18px;height:18px;background:#2a2f37;animation:walk 1.8s steps(1) infinite}
@keyframes walk{0%{background:var(--blue)}11%{background:#2a2f37}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.how{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13px;color:var(--muted)}
.how b{color:var(--ink);font-weight:600}
.statgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 12px;font-size:13px}
.statgrid .h{color:var(--muted)}
.statgrid .n{font-family:var(--f-pix);font-variant-numeric:tabular-nums}
.statgrid .sec{grid-column:1/-1;color:var(--ink);font-weight:600;padding-top:6px}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}
@media (prefers-reduced-motion:reduce){.strip span{animation:none}.banner{animation:none}}
</style>
</head>
<body>

<div id="shell">
  <aside id="dbg" aria-label="调试栏">
    <button class="dbg-mini" id="dbgOpen" aria-label="展开调试栏">调试</button>
    <div class="dbg-head"><h2>调试栏</h2><span class="tag">v8.3</span><button class="x" id="dbgClose" aria-label="收窄调试栏">收起</button></div>
    <p class="dbg-note">开关和滑块随时调、立刻生效（标“下一局”的除外）。试完给每一项标上采纳或不采纳，结论保存在这台设备上。</p>
    <div class="dbg-list" id="dbgList"></div>
    <div class="dbg-foot">
      <button class="btn main" id="dbgCopy">复制结论</button>
      <button class="btn" id="dbgReset">恢复默认</button>
      <p class="dbg-msg" id="dbgMsg"></p>
    </div>
  </aside>

  <div id="main">
    <div id="app">
      <div id="topbar">
        <button class="tb" id="tbPause" disabled>暂停</button>
        <button class="tb" id="tbRestart" disabled>重开</button>
        <button class="tb" id="tbMenu">菜单</button>
        <button class="tb" id="tbMute">声音：开</button>
        <span class="clock" id="clock">3:00</span>
      </div>
      <div id="row">
        <div id="lbar"></div>
        <div id="stage">
          <canvas id="board"></canvas>
          <div class="holdn" id="hold0" hidden></div>
          <div class="holdn s1" id="hold1" hidden></div>
        </div>
        <div id="rbar"></div>
      </div>

      <div class="ov" id="menu">
        <div class="panel">
          <div class="strip" aria-hidden="true"><span style="animation-delay:0s"></span><span style="animation-delay:.2s"></span><span style="animation-delay:.4s"></span><span style="animation-delay:.6s"></span><span style="animation-delay:.8s"></span><span style="animation-delay:1s"></span><span style="animation-delay:1.2s"></span><span style="animation-delay:1.4s"></span><span style="animation-delay:1.6s"></span></div>
          <h1>像素小兵</h1>
          <p class="sub" id="menuSub">双方不断自动出兵，在中间顶成一条战线。往吃紧的地方派增援，把战线推过去，冲垮对方基地。一局 3 分钟。</p>
          <div class="modes">
            <button class="btn" data-mode="ai" data-diff="easy">人机 · 简单</button>
            <button class="btn main" data-mode="ai" data-diff="normal">人机 · 普通</button>
            <button class="btn" data-mode="ai" data-diff="hard">人机 · 困难</button>
            <button class="btn" data-mode="duo">同屏双人</button>
            <button class="btn" data-mode="ai" data-watch="1">观战（电脑不操作）</button>
          </div>
          <ul class="how">
            <li><b>按住 → 移动瞄准 → 上拨</b>：从松手那一列派出增援（至少 3 个）</li>
            <li><b>往下拉住</b>：举起盾墙，松手放下（耗 2 兵）</li>
            <li><b>拉住后往上一弹</b>：橡皮筋把兜住的敌兵弹回去（再耗 1 兵）</li>
          </ul>
        </div>
      </div>
      <div class="ov" id="pause" hidden>
        <div class="panel">
          <h2>暂停</h2>
          <div class="modes">
            <button class="btn main wide" id="resume">继续</button>
            <button class="btn" id="restart">重新开始</button>
            <button class="btn" id="toMenu">回到菜单</button>
          </div>
        </div>
      </div>
      <div class="ov" id="end" hidden></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
if (!window.THREE) { $('#menuSub').textContent = '3D 引擎没有加载成功，请检查网络后刷新页面。'; return; }

/* ===== 固定数值（常调的在调试栏里；已采纳的结论写死在这里） ===== */
const CFG = {
  COLS: 25, ARROW_ANG: 20,   // v8 调试结论：格子密度 25 列、箭头角度 20°（已采纳，写死）
  BASE_COLS: 25, MAX_COLS: 50, MAX_ROWS: 80, MIN_ROWS: 16,   // 行数范围按 25 列的基准，格子密度变了会按比例换算
  TROOP_START: 4, MIN_WAVE: 3, MAX_W: 5,
  WALL_COST: 2, WALL_W: 3, WALL_CD: 6000, WALL_ARC: 0.5,
  PARRY_COST: 1, PARRY_CD: 3000, FLICK_MS: 300, PULL_PX: 90, CATCH_PULL: 0.15, CATCH_GAP: 0.8,
  PARRY_SPEED: 1.5,
  SURGE_FRAC: 0.75, SURGE_STEP: 110,
  SCRUM_DEPTH: 6, SCRUM_SIDE: 0.5, SCRUM_VMAX: 1.5,    // 顶牛：身后多少格算推力、相邻列算几成、交战点最快移动速度（格/秒）
  RING_LIFE: 900, RING_SPEED: 7, RING_AMP: 0.06,   // v8：波纹幅度减半，不再泛白；“波纹强度”滑块再乘一次
  MATCH: 180000, FRENZY_AT: 120000, LOW_HP_FRAC: 0.2, LOW_HP_REGEN: 1.3,
  TILE: 0.95, SOLDIER_H: 0.16, PW_H: 0.08,
  LOOK: { th: 0.12, sh: 0.23, pw: 0.12 },   // 翻板厚度（按格子边长的比例）：地面、兵、每多 1 力量加厚
};
const AI_LV = {
  easy:   { think: 950, react: 0.4,  parry: 0,    min: 3, max: 5,  label: '简单' },
  normal: { think: 620, react: 0.7,  parry: 0.3,  min: 4, max: 9,  label: '普通' },
  hard:   { think: 400, react: 0.95, parry: 0.6,  min: 6, max: 12, label: '困难' },
};

/* ===== 调试项（待定 / 对比） ===== */
const DEBUG = [
  { g: '数值' },
  { id: 'autoIntC', name: '宽阵出兵间隔', type: 'num', min: 0.5, max: 6, step: 0.5, def: 2, unit: '秒', desc: '双方每隔多久各出一个方阵（不花兵力）' },
  { id: 'autoW',   name: '宽阵宽度',     type: 'num', min: 3, max: 25, step: 1, def: 15, unit: '列' },
  { id: 'autoD',   name: '宽阵纵深',     type: 'num', min: 1, max: 4, step: 1, def: 2, unit: '排' },
  { id: 'autoJit', name: '宽阵随机偏移', type: 'num', min: 0, max: 6, step: 1, def: 3, unit: '列', desc: '每个方阵左右随机偏移最多几列，双方兵力分布不均，战线会自己起伏' },
  { id: 'regen',   name: '兵员生成间隔', type: 'num', min: 0.3, max: 2, step: 0.05, def: 0.75, unit: '秒', desc: '兵营多久生成 1 个增援兵' },
  { id: 'tmax',    name: '兵力上限',     type: 'num', min: 6, max: 20, step: 1, def: 20, unit: '个', desc: '满兵浪涌门槛 = 上限的 3/4' },
  { id: 'holdStep', name: '蓄兵速度',    type: 'num', min: 0.03, max: 0.2, step: 0.005, def: 0.075, unit: '秒/个', desc: '按住时每多久 +1 个兵' },
  { id: 'vmax',    name: '最高速度',     type: 'num', min: 0.06, max: 0.4, step: 0.01, def: 0.13, unit: '秒/格', desc: '跑满速后每走一格要多久，越小越快' },
  { id: 'vmin',    name: '起步速度',     type: 'num', min: 0.15, max: 1, step: 0.05, def: 0.4, unit: '秒/格', desc: '刚出发时每走一格要多久' },
  { id: 'accelT',  name: '加速时长',     type: 'num', min: 0.2, max: 4, step: 0.1, def: 1.5, unit: '秒', desc: '从起步速度加到最高速度要多久' },
  { id: 'hold',    name: '僵持时长',     type: 'num', min: 0, max: 0.8, step: 0.05, def: 0.3, unit: '秒', desc: '撞上后先卡住多久，才开始消耗' },
  { id: 'wallMax', name: '盾墙最长时间', type: 'num', min: 1, max: 5, step: 0.5, def: 3, unit: '秒' },
  { id: 'hp',      name: '基地血量',     type: 'num', min: 10, max: 80, step: 5, def: 40, unit: '', desc: '下一局生效' },
  { g: '画面' },
  { id: 'phone',   name: '手机比例预览', type: 'bool', def: true, desc: '把游戏区框成 iPhone 18 Pro / Pro Max 的 19.5:9；切换后点“重开”让行数重算' },
  { id: 'pal', name: '配色', type: 'sel', opts: [['sand', '黄土沙场'], ['grass', '青草原野'], ['night', '夜战'], ['custom', '自定义']], def: 'sand', desc: '地面和双方颜色，立刻生效；选“自定义”后用下面 4 个取色框自己配' },
  { id: 'cGround', name: '自定义 · 地面', type: 'color', def: '#a48256', when: () => opt('pal') === 'custom', whenNo: '配色选“自定义”时生效' },
  { id: 'cSeam',   name: '自定义 · 地面格缝', type: 'color', def: '#3a2a18', when: () => opt('pal') === 'custom', whenNo: '配色选“自定义”时生效' },
  { id: 'cBlue',   name: '自定义 · 蓝方（下方）', type: 'color', def: '#2f4fb4', when: () => opt('pal') === 'custom', whenNo: '配色选“自定义”时生效', desc: '兵的背面深色、战线后方的淡染色按这个颜色自动算' },

let AC = null, NB = null, hums = 0;
function audio() {

  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});

function noiseBuf() {
  if (!NB) { NB = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  return NB;
}
function nz(dur, vol, type, freq, q, delay) {
  const at = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();

function sfx(k, arg) {

  if (lastS[k] && t - lastS[k] < gapS) return;
  lastS[k] = t;
  try {
    switch (k) {
      case 'send':  tone(520, 760, 0.07, 'square', 0.04); break;
      case 'auto':  tone(300, 360, 0.05, 'triangle', 0.02); break;
      case 'boom':  tone(150, 55, 0.18, 'sine', 0.18); nz(0.08, 0.15, 'lowpass', 800); break;
      case 'hum': {   // 僵持：低沉的“嗡”，顶得越久音越往上走；同时最多 3 个
        if (hums >= 3) return;

const allUnits = () => { const a = []; for (const w of G.waves) if (w.delay <= 0) for (const u of w.units) if (!u.dead) a.push(u); for (const h of G.hitters) a.push(h.u); return a; };

  if (!onBoard(Math.round(u.pos))) return;

function formation(col, n, alpha) {
  const mw = kd(CFG.MAX_W), w = Math.min(mw, n), rows = Math.ceil(n / mw);
  const c0 = clamp(col - Math.floor((w - 1) / 2), 0, COLS - w), cc = c0 + (w - 1) / 2, even = w % 2 === 0;
  const out = [];
  for (let k = 0; k < n; k++) {

// 宽阵：W 列 × D 排的方阵
function blockFormation(cc, W, D) {
  W = Math.min(COLS, W);
  const c0 = clamp(Math.round(cc - (W - 1) / 2), 0, COLS - W), mid = c0 + (W - 1) / 2, even = W % 2 === 0, out = [];
  for (let j = 0; j < D; j++) for (let k = 0; k < W; k++) {
    const c = c0 + k, dx = c - mid;
    out.push({ c, off: j, wait: wingWait(Math.abs(dx), even), alpha: 0 });
  }
  return { list: out };
}

/* ===== 发兵：先排队，出兵口空了就发出 ===== */
function sendWave(side, col, n, alpha) {
  const S = G.sides[side];
  n = Math.min(n, S.troops);
  if (n < CFG.MIN_WAVE) { sfx('deny'); if (isHuman(side)) banner('至少 3 个兵才能发射', side, true); return false; }
  const f = formation(col, n, alpha);

  sfx('send'); if (isHuman(side)) buzz(10);

}
function queueAuto() {
  // 自动出兵固定为“宽阵”（已采纳）
  for (let s = 0; s < 2; s++) {
    const jit = opt('autoJit') * KD, cc = (COLS - 1) / 2 + Math.round((Math.random() * 2 - 1) * jit);

  }

}
function spawnClear(side, list) {

}
function processQueue(dt) {
  for (let s = 0; s < 2; s++) {
    const q = G.queue[s];
    for (let i = 0; i < q.length; i++) {
      const e = q[i];

      const wave = newWave(s);

      for (const p of e.list) {
        const u = { id: ++uid, side: s, c: p.c, o: SPAWN[s], off: p.off, wait: p.wait || 0, d: 0, runT: 0, pos: 0, pw: 1, wave, dead: false, alpha: p.alpha, stuck: null, parried: false, src: e.src };

// 先慢后快（已采纳）：按时间从起步速度加到最高速度
function intervalU(u) {
  const fast = opt('vmax') * 1000 / KD, slow = Math.max(fast, opt('vmin') * 1000 / KD);
  return lerp(slow, fast, Math.min(1, u.runT / (opt('accelT') * 1000))) / u.wave.speedMul;
}

/* ===== 盾墙：弧形，中间靠前、两侧靠后 ===== */
const wallHalf = () => (kd(CFG.WALL_W) - 1) >> 1;
const wallCols = wl => { const a = [], h = wallHalf(); for (let c = Math.round(wl.cc) - h; c <= Math.round(wl.cc) + h; c++) if (c >= 0 && c < COLS) a.push(c); return a; };
const wallRow = (wl, c) => wl.row - DIR[wl.side] * CFG.WALL_ARC * KD * Math.abs(c - wl.cc) / Math.max(1, wallHalf());

function moveUnits(dt) {
  for (const w of G.waves) if (w.delay > 0) w.delay -= dt;
  const all = allUnits(), byCol = Array.from({ length: COLS }, () => []);
  for (const u of all) byCol[u.c].push(u);
  for (const u of all) {
    if (u.dead || u.stuck || u.hitting || u.wave.state !== 'move') continue;
    if (u.wait > 0) { u.wait -= dt; continue; }
    if (u.kbUntil > G.time) continue;   // 被真的撞退后，愣一下再冲
    const dir = DIR[u.side];
    let delta = dt / intervalU(u);
    for (const o of byCol[u.c]) {
      if (o === u || o.dead) continue;
      const gap = (o.pos - u.pos) * dir;
      if (gap > 0.01) delta = Math.min(delta, Math.max(0, gap - 1));
    }
    for (const wl of G.walls) {
      if (!wallCols(wl).includes(u.c)) continue;
      const gap = (wallRow(wl, u.c) - u.pos) * dir;
      if (wl.side === u.side) { if (gap > 0.01) delta = Math.min(delta, Math.max(0, gap - 1)); }
      else if (wl.pull > CFG.CATCH_PULL && gap > 0.01) delta = Math.min(delta, Math.max(0, gap - CFG.CATCH_GAP));
    }
    if (delta < dt / intervalU(u) * 0.2) u.runT = Math.min(u.runT, 200); else u.runT += dt;
    u.d += delta; u.pos = upos(u);
    if ((TARGET[u.side] - u.pos) * dir <= 1) { toHitter(u); continue; }
    if (!onBoard(Math.round(u.pos))) continue;
    for (const wl of G.walls) {
      if (wl.side === u.side || !wallCols(wl).includes(u.c)) continue;
      const gap = (wallRow(wl, u.c) - u.pos) * dir;
      if (wl.pull > CFG.CATCH_PULL) { if (gap <= CFG.CATCH_GAP + 0.05 && !u.caught) { u.caught = wl; sfx('stretch'); } continue; }
      if (gap <= 0.8 && gap > -0.6) { freeUnit(u); killUnit(u, wl.side, 'wall', 9); R.burst(u.c + 0.5, 0.5, wallRow(wl, u.c) + 0.5, '#d9dde4', 4, 1); ring(u.c, u.pos + 0.5, 0.6); sfx('crack', 0); break; }
    }
  }
  for (const u of all) {
    if (u.dead || u.stuck || u.hitting || u.wave.state !== 'move') continue;
    const dir = DIR[u.side];
    for (const e of byCol[u.c]) {
      if (e.dead || e.side === u.side || e.stuck || e.hitting || e.wave.state !== 'move') continue;

}
function engage(u, e) {

  G.engT = G.time;

  if (opt('kb') === 'real' && !(u.kbDone && e.kbDone)) {
    for (const x of [u, e]) { if (x.kbDone) continue; x.kbDone = true; pushBack(x, kbAmt()); x.kbUntil = G.time + 120; x.runT = Math.min(x.runT, 300); }
    sfx('boom'); ring(u.c, (u.pos + e.pos) / 2 + 0.5, 0.8);
    R.burst(u.c + 0.5, 0.35, (u.pos + e.pos) / 2 + 0.5, '#ffffff', 2, 0.6);
    return;
  }
  // 交战方式：一对一（已采纳）——撞上僵持后按力量相减
  const z = (u.pos + e.pos) / 2;
  const d = { kind: 'duel', a: u, b: e, t: 0, at: holdMs(), z: z + 0.5, c: u.c };
  u.stuck = e.stuck = d;
  G.duels.push(d);
  sfx('boom'); sfx('hum', holdMs() + 200);

// 单位被盾墙、浪涌、弹反带走时，放开交战中的对手
function freeUnit(u) {

  if (s.kind === 'duel') { const o = s.a === u ? s.b : s.a; if (o && !o.dead) { o.stuck = null; o.runT = 0; } s.done = true; }
  u.stuck = null;
}

/* ===== 一对一（已采纳） ===== */
function updateDuels(dt) {
  for (const d of G.duels) {
    d.t += dt;
    if (d.t < holdMs() && Math.random() < 0.15) R.burst(d.c + 0.5, 0.35, d.z, HEX.gold, 1, 0.4);
    if (d.t >= d.at && !d.done) {
      d.done = true;
      const { a, b } = d, m = Math.min(a.pw, b.pw);
      a.pw -= m; b.pw -= m;
      if (a.pw <= 0) killUnit(a, b.side, b.src, 9);
      if (b.pw <= 0) killUnit(b, a.side, a.src, 9);
      for (const x of [a, b]) if (!x.dead) { x.stuck = null; x.runT = 0; }
      ring(d.c, d.z, 0.8); sfx('crack', 2);
    }
  }
  G.duels = G.duels.filter(d => !d.done);
}

/* ===== 打到基地：卡住 → 僵持 → 崩碎 ===== */
function toHitter(u) {

  const h = { kind: 'hit', u, t: 0 };
  u.hitting = true; u.stuck = h; u.flT = u.sqT = G.time;
  G.hitters.push(h);
  sfx('boom'); sfx('hum', holdMs() + 100);
}
function updateHitters(dt) {

      const u = h.u, foe = G.sides[1 - u.side], S = G.sides[u.side];

      R.burst(u.c + 0.5, 0.3, u.pos + 0.5, HEX.unit[u.side], 10, 1.2);

/* ===== 盾墙（按住保持、跟手）与橡皮筋弹反（弹回的兵掉头冲回去） ===== */
function raiseWall(s, row, col) {

  const lo = s === 0 ? Math.ceil(HALF) : 1, hi = s === 0 ? ROWS - 2 : Math.floor(HALF) - 1;
  const wl = { side: s, row: clamp(row, lo, hi), cc: clamp(col, wallHalf(), COLS - 1 - wallHalf()), born: G.time, until: G.time + opt('wallMax') * 1000, pull: 0 };
  G.walls.push(wl);

  sfx('wall'); if (isHuman(s)) buzz(12);
  for (const u of allUnits()) if (u.side !== s && !u.hitting && wallCols(wl).includes(u.c) && Math.abs(u.pos - wallRow(wl, u.c)) < 0.8) { freeUnit(u); killUnit(u, s, 'wall', 9); sfx('crack', 0); }

}
function dropWall(wl) {

}

  G.snaps.push({ side: wl.side, row: wl.row, cc: wl.cc, pull: Math.max(0.6, wl.pull), t: 0 });

function updateWalls(dt) {
  for (const wl of G.walls.slice()) {

    if (wl.ai) {
      const caught = allUnits().some(u => u.caught === wl);
      const near = allUnits().some(u => u.side !== wl.side && wallCols(wl).includes(u.c) && (wallRow(wl, u.c) - u.pos) * DIR[u.side] <= 1.2);

}

/* ===== 浪涌 ===== */
function updateSurges(dt) {
  for (const sg of G.surges) {
    sg.pos += DIR[sg.side] * dt * KD / CFG.SURGE_STEP;
    for (const u of allUnits()) {
      if (u.side === sg.side || u.dead || sg.hit.has(u.id) || !onBoard(Math.round(u.pos))) continue;
      if ((sg.pos - u.pos) * DIR[sg.side] >= 0) {
        sg.hit.add(u.id); u.pw -= 1; R.burst(u.c + 0.5, 0.4, u.pos + 0.5, HEX.unit[sg.side], 3, 0.8);
        if (u.pw <= 0) { freeUnit(u); killUnit(u, sg.side, 'send'); }
      }
    }
    if ((sg.pos - TARGET[sg.side]) * DIR[sg.side] > 7) sg.dead = true;
  }
  G.surges = G.surges.filter(s => !s.dead);
}

/* ===== 战线 ===== */
function updateLine(dt) {
  const k = Math.min(1, dt / 350);
  const hot = new Float32Array(COLS);
  for (const d of G.duels) hot[d.c] = Math.max(hot[d.c], 1);
  for (let c = 0; c < COLS; c++) {
    let bf = Infinity, of = -Infinity;
    for (const w of G.waves) if (w.delay <= 0) for (const u of w.units) {
      if (u.dead || u.c !== c || !onBoard(Math.round(u.pos))) continue;
      if (u.side === 0) bf = Math.min(bf, u.pos); else of = Math.max(of, u.pos);
    }
    let t = null;
    if (bf < Infinity && of > -Infinity) t = (bf + of) / 2;
    else if (bf < Infinity) t = Math.min(G.line[c], bf - 0.6);   // 只剩蓝方：战线只会被往前推，不会往回退
    else if (of > -Infinity) t = Math.max(G.line[c], of + 0.6);
    G.line[c] += ((t === null ? G.line[c] : t) - G.line[c]) * k;
    G.heat[c] += (hot[c] - G.heat[c]) * Math.min(1, dt / 250);
  }
  for (const r of G.rings) r.t += dt;
  G.rings = G.rings.filter(r => r.t < CFG.RING_LIFE);
}

/* ===== 电脑对手：看战线派增援 ===== */
function aiThink() {
  const L = AI_LV[G.diff], S = G.sides[1];
  let threat = null, best = 99;
  for (const u of allUnits()) {
    if (u.side !== 0 || u.hitting || u.stuck) continue;
    if (u.pos >= 1.5 && u.pos <= ROWS * 0.25 && u.pos < best) { best = u.pos; threat = u; }
  }
  if (threat && !G.walls.some(wl => wl.side === 1) && Math.random() < L.react) {
    const wl = raiseWall(1, Math.round(best) - 1, threat.c);
    if (wl) { wl.ai = true; wl.until = G.time + 1000 + Math.random() * 1200; wl.aiParry = Math.random() < L.parry; if (wl.aiParry) wl.pull = 0.6; return; }
  }

  const want = Math.min(G.ai.want, tmax());
  if (S.troops < want) return;
  let col = Math.floor(Math.random() * COLS);
  if (G.diff !== 'easy') {
    // 支援战线最吃紧（被推得最靠近自己）的列
    let bestV = -Infinity;
    for (let c = 1; c < COLS - 1; c++) { const v = -G.line[c] + G.heat[c] * 0.6 + Math.random() * 3; if (v > bestV) { bestV = v; col = c; } }
  }
  if (sendWave(1, col, want, 0)) G.ai.want = 0;

/* ===== 主循环 ===== */
function update(dt) {
  G.time += dt;
  const fr = G.time >= CFG.FRENZY_AT ? 2 : 1;
  if (fr === 2 && !G.frenzy) { G.frenzy = true; banner('狂热阶段'); }
  for (const S of G.sides) {
    if (S.troops > tmax()) S.troops = tmax();
    if (S.troops < tmax()) {
      S.regen += dt * fr * (S.hp <= G.hpMax * CFG.LOW_HP_FRAC ? CFG.LOW_HP_REGEN : 1);
      if (S.regen >= regenMs()) { S.regen -= regenMs(); S.troops++; }
    } else S.regen = 0;
    if (!G.walls.some(w => w.side === S.s)) S.wallCd = Math.max(0, S.wallCd - dt * fr);
    S.parryCd = Math.max(0, S.parryCd - dt * fr);
  }
  G.autoT += dt * fr;
  if (G.autoT >= autoMs()) { G.autoT = 0; queueAuto(); }
  processQueue(dt);
  updateWalls(dt);
  moveUnits(dt);
  updateHitters(dt);
  updateDuels(dt);
  updateSurges(dt);
  G.waves = G.waves.filter(w => { if (w.state === 'move') w.units = liveUnits(w); return w.units.length > 0; });
  updateLine(dt);
  if (G.mode === 'ai' && !G.watch) { G.ai.t -= dt; if (G.ai.t <= 0) { G.ai.t = AI_LV[G.diff].think * (0.7 + Math.random() * 0.6); aiThink(); } }
  checkEnd();
}
function checkEnd() {
  const [A, B] = G.sides;
  let w;
  if (A.hp <= 0 || B.hp <= 0) w = A.hp <= 0 && B.hp <= 0 ? -1 : A.hp <= 0 ? 1 : 0;
  else if (G.time >= CFG.MATCH) w = A.hp === B.hp ? -1 : A.hp > B.hp ? 0 : 1;
  else return;
  endGame(w);
}

/* ======================= 3D 画面 ======================= */

  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  }

  if (!barEls[0]) return;
  for (let s = 0; s < 2; s++) {
    const S = G.sides[s], b = barEls[s];
    b.n.textContent = S.hp;
    if (S.hp !== b.shown) { b.blocks.forEach((e, i) => e.classList.toggle('gone', i >= S.hp)); b.shown = S.hp; }
    const up = G.walls.some(w => w.side === s);
    b.wall.querySelector('i').style.height = (up ? 100 : (1 - S.wallCd / CFG.WALL_CD) * 100) + '%';
    b.parry.querySelector('i').style.height = ((1 - S.parryCd / CFG.PARRY_CD) * 100) + '%';
    b.wall.classList.toggle('ready', (S.wallCd <= 0 && S.troops >= CFG.WALL_COST) || up);
    b.parry.classList.toggle('ready', S.parryCd <= 0 && S.troops >= CFG.PARRY_COST);
  }
}

/* ===== 手势 ===== */
const pidSide = new Map();
const TH = 16;
const fwd = (side, dy) => side === 0 ? -dy : dy;
function holdCount(side, p) {
  const T = G.sides[side].troops;
  return opt('send') === 'a' ? Math.min(T, CFG.MIN_WAVE + Math.floor((now() - p.t0) / (opt('holdStep') * 1000))) : T;
}
cv.addEventListener('pointerdown', e => {
  audio();
  if (!G || G.over || G.paused) return;
  const cell = R.pick(e.clientX, e.clientY); if (!cell) return;
  const side = G.mode === 'duo' ? (cell.z < HALF ? 1 : 0) : 0;
  if (G.ptr[side]) return;
  G.ptr[side] = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, t0: now(),
    c: clamp(cell.c, 0, COLS - 1), r: clamp(cell.r, 0, ROWS - 1), minF: 0, minT: now(), n: 0, lastN: 0, mode: 'hold', wall: null };
  pidSide.set(e.pointerId, side);
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  const side = pidSide.get(e.pointerId); if (side == null || !G) return;
  const p = G.ptr[side]; if (!p || p.id !== e.pointerId) return;
  p.x = e.clientX; p.y = e.clientY;
  const cell = R.pick(e.clientX, e.clientY);
  if (cell && p.mode === 'hold') p.c = clamp(cell.c, 0, COLS - 1);
  const f = fwd(side, e.clientY - p.y0);
  if (f < p.minF) { p.minF = f; p.minT = now(); }
  if (p.mode === 'hold' && p.minF <= -TH) {
    p.mode = 'guard';
    p.wall = raiseWall(side, p.r, p.c);
    if (!p.wall) p.mode = 'done';
  }
  if (p.mode === 'guard' && p.wall) {
    const prev = p.wall.pull;
    p.wall.pull = clamp((-f - TH) / CFG.PULL_PX, 0, 1);
    if (p.wall.pull - prev > 0.2) sfx('stretch');
    if (cell) p.wall.cc = clamp(cell.c, wallHalf(), COLS - 1 - wallHalf());   // 盾墙跟手（已采纳）
  }
});
function endPtr(e, cancel) {
  const side = pidSide.get(e.pointerId); pidSide.delete(e.pointerId);
  if (side == null || !G) return;
  const p = G.ptr[side]; if (!p || p.id !== e.pointerId) return;
  G.ptr[side] = null;
  if (p.mode === 'guard' && p.wall) {
    const f = fwd(side, e.clientY - p.y0);
    if (!cancel && !G.over && !G.paused && f - p.minF >= TH && now() - p.minT <= CFG.FLICK_MS) flick(p.wall);
    dropWall(p.wall);
    return;
  }
  if (cancel || G.over || G.paused || p.mode !== 'hold') return;
  const dx = e.clientX - p.x0, dy = e.clientY - p.y0, f = fwd(side, dy);
  if (f >= TH) {
    let alpha = 0;
    const cell = R.pick(e.clientX, e.clientY);
    sendWave(side, cell ? clamp(cell.c, 0, COLS - 1) : p.c, holdCount(side, p), alpha);
  }
}
cv.addEventListener('pointerup', e => endPtr(e, false));
cv.addEventListener('pointercancel', e => endPtr(e, true));
function updateHoldBubbles() {
  for (let s = 0; s < 2; s++) {
    const el = $('#hold' + s), p = G && G.ptr[s];
    if (!p || p.mode !== 'hold') { el.hidden = true; continue; }
    p.n = holdCount(s, p);
    if (p.n !== p.lastN) { if (p.n > p.lastN && p.n >= CFG.MIN_WAVE && isHuman(s)) buzz(4); p.lastN = p.n; }   // 每吸一个兵轻震一下
    const b = stage.getBoundingClientRect(), ok = p.n >= CFG.MIN_WAVE;
    el.hidden = false; el.textContent = ok ? p.n : CFG.MIN_WAVE;
    el.classList.toggle('low', !ok);
    const flip = s === 1 && G.mode === 'duo';
    el.style.left = (p.x - b.left) + 'px'; el.style.top = (p.y - b.top + (flip ? 70 : -40)) + 'px';
    el.style.transform = flip ? 'translate(-50%,0) rotate(180deg)' : 'translate(-50%,-100%)';
  }
}

/* ===== 收益统计 ===== */
function statsRows(S) {
  const r = k => { const sp = S.spent[k], gain = S.win[k] + (S.dmg[k] || 0); return [sp, gain, sp ? (gain / sp).toFixed(2) : '—']; };
  return { send: r('send'), wall: r('wall'), parry: r('parry'), auto: [0, S.win.auto + (S.dmg.auto || 0), '—'] };
}
function statsHTML(S) {
  const s = statsRows(S), n = v => `<span class="n">${v}</span>`;
  const row = (name, v) => `<span class="h">${name}</span>${n(v[0])}${n(v[1])}${n(v[2])}`;
  return `<span class="h"></span><span class="h" style="text-align:right">花兵</span><span class="h" style="text-align:right">战果</span><span class="h" style="text-align:right">每兵</span>` +
    row('派增援', s.send) + row('盾墙', s.wall) + row('弹反', s.parry) + row('自动兵', s.auto);
}
let statsEl = null;
function updateStats() {
  if (!statsEl) return;
  if (!G) { statsEl.innerHTML = '<span class="t">收益统计（你 / 蓝方）</span><span class="h" style="grid-column:1/-1">开一局后显示</span>'; return; }
  statsEl.innerHTML = '<span class="t">收益统计（你 / 蓝方）</span>' + statsHTML(G.sides[0]) + '<span class="h" style="grid-column:1/-1">战果 = 击碎的敌兵 + 打进基地的伤害；每兵 = 战果 ÷ 花兵</span>';
}

/* ===== 调试栏 ===== */
const dbgEl = $('#dbg');
const fmtNum = (d, v) => (d.step < 1 ? (+v).toFixed(d.step < 0.01 ? 3 : d.step < 0.1 ? 2 : 1) : String(v)) + d.unit;
function renderDbg() {
  $('#dbgList').innerHTML = DEBUG.map(d => {
    if (d.g) return `<div class="grp-t">${d.g}</div>`;
    const v = DBG.val[d.id], vd = DBG.verdict[d.id], off = d.when && !d.when();
    const right = d.type === 'bool' ? `<button class="sw" data-id="${d.id}" aria-pressed="${v ? 'true' : 'false'}" aria-label="${d.name}"></button>`
      : d.type === 'num' ? `<span class="it-val" id="val-${d.id}">${fmtNum(d, v)}</span>`
      : d.type === 'color' ? `<input type="color" class="clr" data-id="${d.id}" value="${v}" aria-label="${d.name}">` : '';
    const opts = d.type === 'ab' ? [['a', d.a], ['b', d.b]] : d.type === 'sel' ? d.opts : null;
    const body = opts ? `<div class="seg">${opts.map(([k, l]) => `<button data-id="${d.id}" data-v="${k}" aria-pressed="${v === k}">${l}</button>`).join('')}</div>`
      : d.type === 'num' ? `<input type="range" id="rng-${d.id}" data-id="${d.id}" min="${d.min}" max="${d.max}" step="${d.step}" value="${v}" aria-label="${d.name}">` : '';
    return `<div class="it v-${vd}${off ? ' off' : ''}">
      <div class="it-top"><span class="it-name">${d.name}</span>${right}</div>
      ${off ? `<div class="it-off">${d.whenNo || '当前设置下不生效'}</div>` : ''}${d.desc ? `<div class="it-desc">${d.desc}</div>` : ''}${body}
      <div class="vd">
        <button class="yes ${vd === 'yes' ? 'on' : ''}" data-id="${d.id}" data-vd="yes">采纳</button>
        <button class="no ${vd === 'no' ? 'on' : ''}" data-id="${d.id}" data-vd="no">不采纳</button>
        <button class="wait ${vd === 'wait' ? 'on' : ''}" data-id="${d.id}" data-vd="wait">待定</button>
      </div></div>`;
  }).join('') + '<div class="grp-t">数据</div><div class="stats" id="dbgStats"></div>';
  statsEl = $('#dbgStats'); updateStats();
}
$('#dbgList').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !b.dataset.id) return;
  const id = b.dataset.id;
  if (b.classList.contains('sw')) DBG.val[id] = !DBG.val[id];
  else if (b.dataset.v) DBG.val[id] = b.dataset.v;
  else if (b.dataset.vd) DBG.verdict[id] = b.dataset.vd;
  saveDbg(); renderDbg();
  if (id === 'phone') { applyPhone(); setTimeout(() => R.fit(), 0); }
});
$('#dbgList').addEventListener('input', e => {
  const el = e.target;
  if (el.type === 'color') { DBG.val[el.dataset.id] = el.value; saveDbg(); return; }
  if (el.type !== 'range') return;
  const d = ITEMS.find(x => x.id === el.dataset.id);
  DBG.val[d.id] = +el.value; $('#val-' + d.id).textContent = fmtNum(d, el.value);
  saveDbg();
});
function dbgSummary() {
  const n = new Date(), day = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`;
  const tag = { yes: '采纳', no: '不采纳', wait: '待定' };
  let out = `像素小兵 v8.3 调试结论（${day}）\n格式：项目（结论）：当前值。结论针对整个项目，与当前值无关`;
  for (const d of DEBUG) {
    if (d.g) { out += `\n【${d.g}】`; continue; }
    const v = DBG.val[d.id];
    const cur = d.type === 'bool' ? (v ? '开' : '关') : d.type === 'num' ? fmtNum(d, v) : d.type === 'sel' ? d.opts.find(o => o[0] === v)[1] : d.type === 'color' ? v : (v === 'a' ? d.a : d.b);
    out += `\n- ${d.name}（${tag[DBG.verdict[d.id]]}）：当前 ${cur}`;
  }
  if (G) {
    const s = statsRows(G.sides[0]);
    out += `\n【本局收益（蓝方）】\n- 派增援：花 ${s.send[0]} 兵，战果 ${s.send[1]}，每兵 ${s.send[2]}\n- 盾墙：花 ${s.wall[0]} 兵，战果 ${s.wall[1]}，每兵 ${s.wall[2]}\n- 弹反：花 ${s.parry[0]} 兵，战果 ${s.parry[1]}，每兵 ${s.parry[2]}\n- 自动兵战果：${s.auto[1]}`;
  }
  return out;
}
function flashMsg(t) { const m = $('#dbgMsg'); m.textContent = t; clearTimeout(flashMsg.t); flashMsg.t = setTimeout(() => m.textContent = '', 2600); }
$('#dbgCopy').addEventListener('click', () => {
  const text = dbgSummary();
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove(); flashMsg(ok ? '已复制，发给 Claude 即可' : '复制失败，请截图发给 Claude');
  };
  try { navigator.clipboard.writeText(text).then(() => flashMsg('已复制，发给 Claude 即可'), fallback); } catch (e) { fallback(); }
});
$('#dbgReset').addEventListener('click', () => { for (const d of ITEMS) DBG.val[d.id] = d.def; saveDbg(); renderDbg(); applyPhone(); setTimeout(() => R.fit(), 0); flashMsg('开关和数值已恢复默认，结论标记保留'); });
function setMini(m) { dbgEl.classList.toggle('mini', m); try { localStorage.setItem('pixel-legion-dbg-mini', m ? '1' : '0'); } catch (e) {} setTimeout(() => R.fit(), 0); }
$('#dbgClose').addEventListener('click', () => setMini(true));
$('#dbgOpen').addEventListener('click', () => setMini(false));
(() => { let m = null; try { m = localStorage.getItem('pixel-legion-dbg-mini'); } catch (e) {} dbgEl.classList.toggle('mini', m === null ? window.innerWidth < 700 : m === '1'); })();
renderDbg();

/* ===== 界面流程 ===== */
function hideOverlays() { ['#menu', '#pause', '#end'].forEach(s => $(s).hidden = true); }
function showMenu() { G = null; hideOverlays(); $('#menu').hidden = false; $('#lbar').innerHTML = ''; $('#rbar').innerHTML = ''; barEls.length = 0; R.clearFx(); setToolbar(); }
function pauseGame() { if (!G || G.over) return; G.paused = true; $('#pause').hidden = false; setToolbar(); }
function resumeGame() { if (G) G.paused = false; $('#pause').hidden = true; last = 0; setToolbar(); }
function restart() { if (lastSetup) newGame(lastSetup.mode, lastSetup.diff, lastSetup.watch); }
$('#tbPause').addEventListener('click', () => { if (G && G.paused) resumeGame(); else pauseGame(); });
$('#tbRestart').addEventListener('click', restart);
$('#tbMenu').addEventListener('click', showMenu);
$('#tbMute').addEventListener('click', e => { muted = !muted; e.target.textContent = '声音：' + (muted ? '关' : '开'); });
$('#resume').addEventListener('click', resumeGame);
$('#restart').addEventListener('click', restart);
$('#toMenu').addEventListener('click', showMenu);
document.querySelectorAll('#menu [data-mode]').forEach(b => b.addEventListener('click', () => { audio(); newGame(b.dataset.mode, b.dataset.diff || 'normal', !!b.dataset.watch); }));
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

function endGame(w) {
  G.over = true; G.ptr = [null, null];
  const [A, B] = G.sides;
  const title = G.mode === 'ai' ? (w === 0 ? '胜利' : w === 1 ? '惜败' : '平局') : (w === 0 ? '蓝方获胜' : w === 1 ? '橙方获胜' : '平局');
  const n = v => `<span class="n">${v}</span>`, ov = $('#end');
  const sa = statsRows(A), sb = statsRows(B), eff = v => `${v[0]} → ${v[1]}`;
  ov.innerHTML = `<div class="panel">
    <h2>${title}</h2>
    <div class="statgrid">
      <span class="h"></span><span class="h">${G.mode === 'ai' ? '你' : '蓝方'}</span><span class="h">${G.mode === 'ai' ? '电脑' : '橙方'}</span>
      <span class="h">基地剩余</span>${n(A.hp)}${n(B.hp)}
      <span class="h">击碎敌兵</span>${n(A.stats.kills)}${n(B.stats.kills)}
      <span class="h">打进基地</span>${n(A.stats.hits)}${n(B.stats.hits)}
      <span class="sec">收益：花兵 → 战果</span>
      <span class="h">派增援</span>${n(eff(sa.send))}${n(eff(sb.send))}
      <span class="h">盾墙</span>${n(eff(sa.wall))}${n(eff(sb.wall))}
      <span class="h">弹反</span>${n(eff(sa.parry))}${n(eff(sb.parry))}
      <span class="h">自动兵战果</span>${n(sa.auto[1])}${n(sb.auto[1])}
    </div>
    <div class="btns"><button class="btn main" id="again">再来一局</button><button class="btn" id="endMenu">回到菜单</button></div></div>`;
  ov.hidden = false;
  ov.querySelector('#again').addEventListener('click', restart);
  ov.querySelector('#endMenu').addEventListener('click', showMenu);
  updateStats(); setToolbar();
}

let statT = 0;
function frame(ts) {
  const dt = last ? Math.min(50, ts - last) : 16; last = ts;
  const run = G && !G.over && !G.paused;
  const frozen = run && G.freeze > 0;   // 整屏顿帧：这几帧不推进
  if (frozen) G.freeze -= dt; else if (run) update(dt);
  R.render(run && !frozen ? dt : 0);
  updateBars(); updateHoldBubbles();
  statT += dt; if (statT > 500) { statT = 0; updateStats(); }
  requestAnimationFrame(frame);
}
window.__pl = { get G() { return G; }, newGame, sendWave, raiseWall, dropWall, flick, update, render: d => R.render(d), DBG, opt, CFG, formation, get ROWS() { return ROWS; }, statsRows };
setCols(CFG.COLS);
setRows(R.autoRows());
R.layout();
setToolbar();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
