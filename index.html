<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1217">
<title>像素小兵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* 布局：左侧调试栏（宽屏固定 / 手机抽屉）+ 右侧竖屏游戏（上 HUD / 翻牌棋盘 / 下 HUD）；单一暗色“翻牌屏”外观 */
:root{
  --frame:#0f1217; --plate:#1a1f27; --panel:#161a21; --raise:#1e242d; --line:#2a313c; --ink:#e9ece4; --muted:#8b94a1;
  --blue:#2f6bff; --orange:#ff7a1a; --gold:#ffd84a; --ok:#3fbf7f; --no:#e5534b;
  --f-pix:"Silkscreen", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-cn:"ZCOOL QingKe HuangYou","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-body:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--frame);color:var(--ink);font-family:var(--f-body);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#shell{height:100%;display:flex}
#main{flex:1;min-width:0;position:relative;display:flex;justify-content:center}
#app{height:100%;width:100%;max-width:520px;display:flex;flex-direction:column;padding-inline:16px;box-sizing:border-box}
#stage{flex:1;position:relative;min-height:0}
#board{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- 调试栏 ---------- */
#dbg{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;box-sizing:border-box}
.dbg-head{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.dbg-head h2{font-family:var(--f-cn);font-weight:400;font-size:22px;margin:0}
.dbg-head .tag{font:700 11px var(--f-pix);color:var(--muted)}
.dbg-head .x{margin-left:auto;background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;width:30px;height:28px;cursor:pointer}
.dbg-note{margin:0;padding:8px 14px 0;font-size:12px;color:var(--muted)}
.dbg-list{flex:1;overflow-y:auto;padding:8px 10px 12px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.it{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:grid;gap:6px}
.it.v-yes{border-left:3px solid var(--ok)}
.it.v-no{border-left:3px solid var(--no);opacity:.7}
.it-top{display:flex;align-items:center;gap:8px}
.it-name{font-size:14px;font-weight:600;flex:1;min-width:0}
.it-desc{font-size:11.5px;color:var(--muted);line-height:1.35}
.sw{position:relative;width:40px;height:22px;border-radius:11px;background:var(--line);border:none;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw[aria-pressed="true"]{background:var(--blue)}
.sw[aria-pressed="true"]::after{transform:translateX(18px);background:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.seg button{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 4px;cursor:pointer;line-height:1.25}
.seg button[aria-pressed="true"]{color:#fff;background:var(--blue);border-color:var(--blue)}
.vd{display:flex;gap:4px}
.vd button{flex:1;font-size:11.5px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:5px;padding:4px 0;cursor:pointer}
.vd button.on.yes{color:#fff;background:var(--ok);border-color:var(--ok)}
.vd button.on.no{color:#fff;background:var(--no);border-color:var(--no)}
.vd button.on.wait{color:var(--frame);background:var(--muted);border-color:var(--muted)}
.dbg-foot{padding:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:6px}
.dbg-foot .btn{padding:9px 8px;font-size:13px}
.dbg-msg{grid-column:1/-1;font-size:11.5px;color:var(--ok);min-height:14px;margin:0}
#dbgTab{display:none;position:fixed;left:0;top:42%;z-index:21;writing-mode:vertical-rl;font:15px var(--f-cn);letter-spacing:.2em;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-left:none;border-radius:0 8px 8px 0;padding:12px 6px;cursor:pointer}
#dbgScrim{display:none}
@media (max-width:899px){
  #dbg{position:fixed;left:0;top:0;bottom:0;z-index:30;width:min(320px,88vw);transform:translateX(-102%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  #dbg.open{transform:none}
  #dbgTab{display:block}
  #dbgScrim.open{display:block;position:fixed;inset:0;z-index:29;background:rgba(5,7,10,.55)}
}
@media (min-width:900px){ .dbg-head .x{display:none} }

/* ---------- HUD ---------- */
.hud{--side:var(--blue);display:flex;flex-direction:column;gap:6px;padding-block:8px}
.hud.s1{--side:var(--orange)}
.hud.flip{transform:rotate(180deg)}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.hp{display:flex;align-items:baseline;gap:4px}
.hp b{font-family:var(--f-pix);font-size:24px;line-height:1;color:var(--side);font-variant-numeric:tabular-nums;min-width:1.6em}
small{font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.grp{display:flex;flex-direction:column;gap:3px;min-width:0}
.grow{flex:1}
.pips{display:flex;gap:3px}
.pips span{width:9px;height:9px;border-radius:2px;background:var(--line)}
.pips span.on{background:var(--side)}
.pips span.min{box-shadow:inset 0 -2px 0 rgba(255,255,255,.35)}
.bar{height:8px;background:var(--line);border-radius:2px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--side)}
.grp.ready small{color:var(--ink)}
.clock{margin-left:auto;font-family:var(--f-pix);font-size:15px;font-variant-numeric:tabular-nums}
.clock.hot{color:var(--gold)}
.pbtn{font:700 13px var(--f-pix);color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:6px;width:30px;height:28px;padding:0;cursor:pointer}

.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-cn);font-size:24px;color:var(--ink);background:rgba(15,18,23,.84);border:1px solid var(--line);padding:6px 16px;border-radius:8px;pointer-events:none;white-space:nowrap;animation:ban 1.5s forwards}
.banner.s0{top:70%}
.banner.s1{top:30%;transform:translate(-50%,-50%) rotate(180deg)}
@keyframes ban{0%{opacity:0}12%{opacity:1}75%{opacity:1}100%{opacity:0}}

/* ---------- 弹层 ---------- */
.ov{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(9,11,15,.9);padding:16px;box-sizing:border-box}
.panel{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
h1{font-family:var(--f-cn);font-weight:400;font-size:44px;margin:0;line-height:1}
.panel h2{font-family:var(--f-cn);font-weight:400;font-size:28px;margin:0}
.sub{margin:0;color:var(--muted);font-size:14px}
.strip{display:flex;gap:4px}
.strip span{width:18px;height:18px;border-radius:3px;background:#cdd2c9;animation:walk 1.8s steps(1) infinite}
@keyframes walk{0%{background:var(--blue)}11%{background:#cdd2c9}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font-size:15px;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:11px 10px;cursor:pointer}
.btn.main{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.wide{grid-column:1/-1}
.how{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13px;color:var(--muted)}
.how b{color:var(--ink);font-weight:600;display:inline-block;min-width:7.5em}
.statgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 12px;font-size:13px}
.statgrid .h{color:var(--muted)}
.statgrid .n{font-family:var(--f-pix);font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}
@media (prefers-reduced-motion:reduce){.strip span{animation:none}.banner{animation:none}#dbg{transition:none}}
</style>
</head>
<body>

<div id="shell">
  <aside id="dbg" aria-label="调试栏">
    <div class="dbg-head"><h2>调试栏</h2><span class="tag">v2</span><button class="x" id="dbgClose" aria-label="收起调试栏">✕</button></div>
    <p class="dbg-note">开关随时切换、立刻生效。试完给每一项标上采纳或不采纳，结论保存在这台设备上。</p>
    <div class="dbg-list" id="dbgList"></div>
    <div class="dbg-foot">
      <button class="btn main" id="dbgCopy">复制结论</button>
      <button class="btn" id="dbgReset">开关恢复默认</button>
      <p class="dbg-msg" id="dbgMsg"></p>
    </div>
  </aside>
  <div id="dbgScrim"></div>
  <button id="dbgTab" aria-label="打开调试栏">调试</button>

  <div id="main">
    <div id="app">
      <div class="hud s1" id="hud1"></div>
      <div id="stage"><canvas id="board"></canvas></div>
      <div class="hud s0" id="hud0"></div>
    </div>

    <div class="ov" id="menu">
      <div class="panel">
        <div class="strip" aria-hidden="true"><span style="animation-delay:0s"></span><span style="animation-delay:.2s"></span><span style="animation-delay:.4s"></span><span style="animation-delay:.6s"></span><span style="animation-delay:.8s"></span><span style="animation-delay:1s"></span><span style="animation-delay:1.2s"></span><span style="animation-delay:1.4s"></span><span style="animation-delay:1.6s"></span></div>
        <h1>像素小兵</h1>
        <p class="sub">攒兵、成波冲锋，一格一格翻过去冲垮对方基地。一局 3 分钟。</p>
        <div class="modes">
          <button class="btn" data-mode="ai" data-diff="easy">人机 · 简单</button>
          <button class="btn main" data-mode="ai" data-diff="normal">人机 · 普通</button>
          <button class="btn" data-mode="ai" data-diff="hard">人机 · 困难</button>
          <button class="btn" data-mode="duo">同屏双人</button>
        </div>
        <ul class="how">
          <li><b>按住 → 上拨</b>蓄兵后成波发射，至少 3 个</li>
          <li><b>↓ 下拨</b>升起盾墙，挡碎来兵（耗 2 兵）</li>
          <li><b>↓↑ 快划 V 字</b>弹反碰到的敌兵（耗 1 兵）</li>
          <li><b>斜着拨</b>小兵沿对角线翻转前进</li>
        </ul>
      </div>
    </div>
    <div class="ov" id="pause" hidden>
      <div class="panel">
        <h2>暂停</h2>
        <div class="modes">
          <button class="btn main wide" id="resume">继续</button>
          <button class="btn" id="restart">重新开始</button>
          <button class="btn" id="toMenu">回到菜单</button>
          <button class="btn wide" id="mute">声音：开</button>
        </div>
      </div>
    </div>
    <div class="ov" id="end" hidden></div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ===== 数值配置：对应规则文档“初始数值表”，改这里调手感 ===== */
const CFG = {
  COLS: 13, ROWS: 16,
  BASE_HP: 20,
  TROOP_REGEN: 1500, TROOP_MAX: 10, TROOP_START: 3,
  MIN_WAVE: 3, MAX_W: 5, HOLD_STEP: 200,      // 长按每 0.2 秒 +1
  STEP_FAST: 250, STEP_SLOW: 650, ACCEL_ROWS: 4, // 每格耗时：起步 0.65 秒 → 跑满 4 格后 0.25 秒
  WALL_COST: 2, WALL_W: 3, WALL_TIME: 2000, WALL_CD: 6000,
  PARRY_COST: 1, PARRY_W: 3,
  PARRY_NEW: { win: 600, life: 600, cd: 3000, shared: false },
  PARRY_OLD: { win: 450, life: 400, cd: 6000, shared: true },
  PARRY_SPEED: 1.5, PLATEAU_TIME: 6000,
  CLASH_HOLD: 300, STAGGER: 100, STAGGER_MAX: 600,
  SURGE_N: 10, SURGE_STEP: 160,
  OWN_TERR: 1.25, ENEMY_TERR: 0.85,
  MATCH: 180000, FRENZY_AT: 120000, LOW_HP: 5, LOW_HP_REGEN: 1.3,
};
const AI_LV = {
  easy:   { think: 1000, react: 0.4,  parry: 0,    min: 3, max: 4, label: '简单' },
  normal: { think: 650,  react: 0.7,  parry: 0.25, min: 3, max: 6, label: '普通' },
  hard:   { think: 420,  react: 0.95, parry: 0.55, min: 4, max: 8, intercept: true, label: '困难' },
};

/* ===== 调试项：待定 / 对比的效果 ===== */
const DEBUG = [
  { id: 'impact',  name: '撞击效果',   type: 'ab', a: '卡在翻转中途', b: '受力弯曲', def: 'a', desc: '两波兵接触瞬间前排方块的样子' },
  { id: 'stagger', name: '逐格崩碎',   type: 'bool', def: true, desc: '从接触点向两侧一格接一格崩，间隔 0.1 秒；关掉则同时崩' },
  { id: 'result',  name: '对撞结果',   type: 'ab', a: '兵多剩余继续冲', b: '两波全灭', def: 'a', desc: '两波兵相撞后谁留下' },
  { id: 'send',    name: '发兵方式',   type: 'ab', a: '长按蓄兵', b: '一拨全发', def: 'a', desc: '长按时数字逐渐增加，松手上拨按数字发兵' },
  { id: 'diag',    name: '斜向翻转',   type: 'bool', def: true, desc: '斜着拨时，小兵沿对角线翻转' },
  { id: 'ripple',  name: '波纹带动',   type: 'bool', def: true, desc: '小兵前进时带动前后格子半翻' },
  { id: 'accel',   name: '先慢后快',   type: 'bool', def: true, desc: '起步慢，到己方半场一半达到最高速；关掉则全程匀速' },
  { id: 'warn',    name: '来袭预警',   type: 'bool', def: true, desc: '敌方兵还没过中线时，在我方半场边缘亮出它的列' },
  { id: 'parry',   name: '弹反参数',   type: 'ab', a: '放宽：0.6 秒，冷却 3 秒', b: '旧版：0.4 秒，与盾墙共用 6 秒', def: 'a' },
  { id: 'plateau', name: '弹反之后',   type: 'ab', a: '落地变台地', b: '掉头冲回去', def: 'a', desc: '台地：己方兵经过时力量 +1，持续 6 秒' },
  { id: 'surge',   name: '满兵浪涌',   type: 'bool', def: true, desc: '一次发满 10 个兵，自动带一道全宽冲击波' },
  { id: 'terr',    name: '领地染色',   type: 'bool', def: false, desc: '兵走过的格子染色，己方领地加速' },
];
const DBG_KEY = 'pixel-legion-debug-v2';
const DBG = { val: {}, verdict: {} };
function loadDbg() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(DBG_KEY) || 'null'); } catch (e) {}
  for (const d of DEBUG) {
    const v = saved && saved.val ? saved.val[d.id] : undefined;
    DBG.val[d.id] = v === undefined ? d.def : v;
    DBG.verdict[d.id] = (saved && saved.verdict && saved.verdict[d.id]) || 'wait';
  }
}
function saveDbg() { try { localStorage.setItem(DBG_KEY, JSON.stringify(DBG)); } catch (e) {} }
const opt = id => DBG.val[id];
loadDbg();

const COL = {
  frame: '#0f1217', plate: '#1a1f27', hole: '#0a0c10', neutral: '#cdd2c9', back: '#f6f4ea',
  unit: ['#2f6bff', '#ff7a1a'], soft: ['#9db6f2', '#f2c399'], plat: ['#6f92f0', '#f0a462'],
  dark: ['#1b3a96', '#8f3d07'], gold: '#ffd84a', baseOff: '#252b34',
};

const COLS = CFG.COLS, ROWS = CFG.ROWS, N = COLS * ROWS, HALF = ROWS / 2;
const DIR = [-1, 1], SPAWN = [ROWS - 1, 0];
const AXIS = { 0: 0, 1: Math.PI / 4, '-1': -Math.PI / 4 };
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const onBoard = r => r >= 0 && r < ROWS;
const past = (side, r) => side === 0 ? r < 0 : r >= ROWS;

const stage = $('#stage'), cv = $('#board'), ctx = cv.getContext('2d');
let dpr = 1, cs = 24, ox = 0, oy = 0, boardY = 0;
let G = null, uid = 0, wid = 0, last = 0, muted = false, firstGame = true, lastSetup = null;

/* ===== 声音：砰（撞击）· 吱（僵持）· 砰（崩碎） ===== */
let AC = null, NB = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
}
function noiseBuf() {
  if (!NB) {
    NB = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return NB;
}
function nz(dur, vol, type, freq, q) {
  const at = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf(); f.type = type; f.frequency.value = freq; if (q) f.Q.value = q;
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(at); s.stop(at + dur + 0.02);
}
function tone(f0, f1, dur, type, vol) {
  const at = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), at + dur);
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(AC.destination); o.start(at); o.stop(at + dur + 0.02);
}
const lastS = {};
function sfx(k, arg) {
  if (!AC || muted) return;
  const now = AC.currentTime;
  if (k !== 'crack' && lastS[k] && now - lastS[k] < 0.05) return;
  lastS[k] = now;
  try {
    switch (k) {
      case 'send':  tone(520, 760, 0.07, 'square', 0.05); break;
      case 'tick':  tone(1500, 1400, 0.012, 'square', 0.01); break;
      case 'boom':  tone(150, 55, 0.18, 'sine', 0.24); nz(0.09, 0.25, 'lowpass', 900); break;
      case 'squeak': {
        const dur = arg / 1000, at = now, o = AC.createOscillator(), lfo = AC.createOscillator(), lg = AC.createGain();
        const f = AC.createBiquadFilter(), g = AC.createGain();
        o.type = 'sawtooth'; o.frequency.value = 1150; lfo.frequency.value = 28; lg.gain.value = 140;
        lfo.connect(lg).connect(o.frequency);
        f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = 6;
        g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.05, at + 0.03);
        g.gain.setValueAtTime(0.05, at + Math.max(0.04, dur - 0.05)); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        o.connect(f).connect(g).connect(AC.destination);
        o.start(at); lfo.start(at); o.stop(at + dur + 0.02); lfo.stop(at + dur + 0.02);
        break;
      }
      case 'crack': nz(0.08, 0.2, 'highpass', 1400 + arg * 260); tone(380 + arg * 45, 200 + arg * 30, 0.06, 'square', 0.05); break;
      case 'base':  tone(95, 45, 0.24, 'sawtooth', 0.09); break;
      case 'wall':  tone(320, 220, 0.12, 'triangle', 0.08); break;
      case 'swing': tone(700, 980, 0.06, 'sine', 0.05); break;
      case 'parry': tone(660, 1320, 0.25, 'sine', 0.1); break;
      case 'surge': nz(0.4, 0.12, 'lowpass', 500); tone(90, 160, 0.3, 'triangle', 0.08); break;
      case 'deny':  tone(140, 140, 0.08, 'square', 0.04); break;
    }
  } catch (e) {}
}
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

/* ===== 尺寸 ===== */
function resize() {
  const r = stage.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr);
  const unitsH = ROWS + 2 * 0.6 + 2 * 0.3;
  cs = Math.max(8, Math.floor(Math.min(r.width / COLS, r.height / unitsH)));
  ox = (r.width - cs * COLS) / 2;
  oy = (r.height - cs * unitsH) / 2;
  boardY = oy + cs * 0.9;
}
window.addEventListener('resize', resize);
try { new ResizeObserver(resize).observe(stage); } catch (e) {}
function cellAt(x, y) {
  const b = cv.getBoundingClientRect();
  return { c: Math.floor((x - b.left - ox) / cs), r: Math.floor((y - b.top - boardY) / cs) };
}

/* ===== 对局状态 ===== */
function mkSide(s) {
  return { s, hp: CFG.BASE_HP, troops: CFG.TROOP_START, regen: 0, wallCd: 0, parryCd: 0, flash: 0,
    stats: { kills: 0, hits: 0, parries: 0, walls: 0 } };
}
const isHuman = s => G && (G.mode === 'duo' || s === 0);

function newGame(mode, diff) {
  G = { mode, diff, time: 0, over: false, paused: false, frenzy: false, shake: 0,
    grid: new Array(N).fill(null), plat: new Array(N).fill(null), terr: new Int8Array(N).fill(-1),
    rip: new Float32Array(N), ripSide: new Int8Array(N), ripAxis: new Int8Array(N),
    waves: [], clashes: [], walls: [], surges: [], fx: [], ptr: [null, null],
    ai: { t: 900, want: 0 }, hint: firstGame ? 9000 : 0, sides: [mkSide(0), mkSide(1)] };
  firstGame = false;
  lastSetup = { mode, diff };
  buildHud(); hideOverlays(); resize();
  banner('开战');
}

const idx = (c, r) => r * COLS + c;
const at = (c, r) => (c >= 0 && c < COLS && onBoard(r)) ? G.grid[idx(c, r)] : null;
function wallAt(c, r) {
  for (const w of G.walls) if (w.row === r && c >= w.c0 && c <= w.c1) return w;
  return null;
}
const alive = w => w.units.filter(u => !u.dead);
const onBoardUnits = w => w.units.filter(u => !u.dead && onBoard(u.r));

function killUnit(u, killer, bits) {
  if (u.dead) return;
  u.dead = true;
  if (onBoard(u.r) && G.grid[idx(u.c, u.r)] === u) G.grid[idx(u.c, u.r)] = null;
  if (killer != null) G.sides[killer].stats.kills++;
  if (onBoard(u.r)) burst(u.c, u.r, COL.unit[u.side], bits || 7);
}

/* ===== 发兵：成波 ===== */
function newWave(side, axis) {
  return { id: ++wid, side, units: [], t: 0, dist: 0, state: 'move', speedMul: 1, axis: axis || 0 };
}
function sendWave(side, col, n, axis) {
  const S = G.sides[side];
  n = Math.min(n, S.troops);
  if (n < CFG.MIN_WAVE) { sfx('deny'); if (isHuman(side)) banner('至少 3 个兵才能发射', side, true); return false; }
  const w = Math.min(CFG.MAX_W, n), rows = Math.ceil(n / CFG.MAX_W);
  const c0 = clamp(col - Math.floor((w - 1) / 2), 0, COLS - w), sr = SPAWN[side];
  for (let c = c0; c < c0 + w; c++) if (at(c, sr)) { sfx('deny'); if (isHuman(side)) banner('出兵口被堵住了', side, true); return false; }
  const wave = newWave(side, axis);
  for (let k = 0; k < n; k++) {
    const j = Math.floor(k / w), inRow = j === rows - 1 ? n - j * w : w, off = Math.floor((w - inRow) / 2);
    const u = { id: ++uid, side, c: c0 + off + (k - j * w), r: sr - DIR[side] * j, pw: 1, wave, dead: false,
      flip: j === 0 ? 0 : 1, axis: axis || 0, stuck: false, charged: false, parried: false };
    wave.units.push(u);
    if (onBoard(u.r)) G.grid[idx(u.c, u.r)] = u;
  }
  S.troops -= n;
  G.waves.push(wave);
  sfx('send'); if (isHuman(side)) buzz(10);
  if (opt('surge') && n >= CFG.SURGE_N) {
    G.surges.push({ side, r: sr, t: 0, hit: new Set() });
    sfx('surge'); banner('浪涌', side, true);
  }
  checkContact(wave);
  return true;
}

function interval(w) {
  let iv = opt('accel') ? lerp(CFG.STEP_SLOW, CFG.STEP_FAST, Math.min(1, w.dist / CFG.ACCEL_ROWS)) : CFG.STEP_FAST;
  if (opt('terr')) {
    const f = onBoardUnits(w)[0];
    if (f) { const t = G.terr[idx(f.c, f.r)]; if (t === w.side) iv /= CFG.OWN_TERR; else if (t !== -1) iv /= CFG.ENEMY_TERR; }
  }
  return iv / w.speedMul;
}

function ripple(c, r, side, axis) {
  if (!opt('ripple') || c < 0 || c >= COLS || !onBoard(r)) return;
  const k = idx(c, r);
  if (G.rip[k] < 0.9) { G.rip[k] = 1; G.ripSide[k] = side; G.ripAxis[k] = axis; }
}

function stepWave(w) {
  const dir = DIR[w.side], us = alive(w);
  let blocked = false, contact = null;
  for (const u of us) {
    const nr = u.r + dir;
    if (!onBoard(nr)) continue;
    const wl = wallAt(u.c, nr);
    if (wl && wl.side === w.side && wl.kind === 'wall') blocked = true;
    const o = at(u.c, nr);
    if (o && o.wave !== w) { if (o.side === w.side) blocked = true; else contact = contact || o.wave; }
  }
  if (contact) { if (contact.state === 'clash') return 'blocked'; startClash(w, contact); return 'clash'; }
  if (blocked) return 'blocked';

  for (const u of us) if (onBoard(u.r) && G.grid[idx(u.c, u.r)] === u) G.grid[idx(u.c, u.r)] = null;
  const conv = [];
  let moved = false;
  for (const u of us) {
    const nr = u.r + dir;
    if (past(w.side, nr)) { hitBase(u); continue; }
    u.r = nr;
    if (!onBoard(nr)) continue;
    const wl = wallAt(u.c, nr);
    if (wl && wl.side !== w.side && wl.kind === 'wall') { killUnit(u, wl.side, 9); burst(u.c, nr, '#d9dde4', 6); sfx('crack', 0); continue; }
    G.grid[idx(u.c, nr)] = u;
    u.flip = 0; u.axis = w.axis; moved = true;
    ripple(u.c, nr + dir, w.side, w.axis); ripple(u.c, nr - dir, w.side, w.axis);
    if (opt('terr')) G.terr[idx(u.c, nr)] = w.side;
    const p = G.plat[idx(u.c, nr)];
    if (p && p.side === u.side && !u.charged) { u.pw += 1; u.charged = true; }
    if (wl && wl.side !== w.side && wl.kind === 'paddle') conv.push([u, wl]);
  }
  w.dist++;
  if (moved && isHuman(w.side)) sfx('tick');
  for (const [u, wl] of conv) parryUnit(u, wl);
  checkContact(w);
  return 'moved';
}

function checkContact(w) {
  if (w.state !== 'move') return;
  const dir = DIR[w.side];
  for (const u of onBoardUnits(w)) {
    const o = at(u.c, u.r + dir);
    if (o && o.side !== w.side && !o.dead && o.wave.state === 'move') { startClash(w, o.wave); return; }
  }
}

function hitBase(u) {
  const foe = G.sides[1 - u.side];
  u.dead = true;
  foe.hp = Math.max(0, foe.hp - u.pw); foe.flash = 1;
  G.sides[u.side].stats.hits += u.pw;
  G.shake = Math.max(G.shake, 6); sfx('base'); if (isHuman(foe.s)) buzz(40);
}

/* ===== 对撞：卡住 → 僵持 → 逐格崩碎 ===== */
function startClash(a, b) {
  a.state = b.state = 'clash';
  const ua = onBoardUnits(a), ub = onBoardUnits(b);
  const cols = [];
  for (const u of ua) { const o = at(u.c, u.r + DIR[a.side]); if (o && o.wave === b) cols.push(u.c); }
  const cc = cols.length ? cols.reduce((s, c) => s + c, 0) / cols.length : COLS / 2;
  const front = (u, side) => side === 0 ? u.r : -u.r;
  const order = (list, side) => list.slice().sort((x, y) => (front(x, side) - front(y, side)) || (Math.abs(x.c - cc) - Math.abs(y.c - cc)));
  const A = order(alive(a), a.side), B = order(alive(b), b.side);
  const fa = A.length ? front(A[0], a.side) : 0, fb = B.length ? front(B[0], b.side) : 0;
  const cl = { a, b, t: 0, i: 0, events: [], cc, row: 0 };
  for (const u of A) if (front(u, a.side) === fa) { u.stuck = cl; }
  for (const u of B) if (front(u, b.side) === fb) { u.stuck = cl; }
  // 配对结算
  const pa = A.map(u => u.pw), pb = B.map(u => u.pw);
  let i = 0, j = 0;
  while (i < A.length && j < B.length) {
    const m = Math.min(pa[i], pb[j]);
    cl.events.push([[A[i], m], [B[j], m]]);
    pa[i] -= m; pb[j] -= m;
    if (pa[i] <= 0) i++;
    if (pb[j] <= 0) j++;
  }
  if (opt('result') === 'b') {
    const ra = A.slice(i), rb = B.slice(j);
    for (let k = 0; k < Math.max(ra.length, rb.length); k++) {
      const ev = [];
      if (ra[k]) ev.push([ra[k], 99]);
      if (rb[k]) ev.push([rb[k], 99]);
      cl.events.push(ev);
    }
  }
  cl.gap = opt('stagger') ? Math.min(CFG.STAGGER, CFG.STAGGER_MAX / Math.max(1, cl.events.length - 1)) : 0;
  const fu = A[0] || B[0];
  cl.row = fu ? fu.r + (a.side === 0 ? -0.5 : 0.5) : HALF;
  G.clashes.push(cl);
  sfx('boom'); sfx('squeak', CFG.CLASH_HOLD);
  G.shake = Math.max(G.shake, 5); buzz(20);
  const p = cellCenter(cc, cl.row);
  for (let k = 0; k < 10; k++) G.fx.push({ type: 'p', x: p.x + (Math.random() - 0.5) * cs * 2, y: p.y, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3, life: 1, color: '#ffffff', size: cs * 0.12 });
}

function updateClash(cl, dt) {
  cl.t += dt;
  if (cl.t < CFG.CLASH_HOLD) {
    if (Math.random() < 0.6) {
      const p = cellCenter(cl.cc + (Math.random() - 0.5) * 3, cl.row);
      G.fx.push({ type: 'p', x: p.x, y: p.y, vx: (Math.random() - 0.5) * 2.4, vy: (Math.random() - 0.5) * 2.4, life: 0.7, color: COL.gold, size: cs * 0.09 });
    }
    return;
  }
  const tt = cl.t - CFG.CLASH_HOLD;
  while (cl.i < cl.events.length && tt >= cl.i * cl.gap) {
    const k = cl.i++;
    for (const [u, m] of cl.events[k]) {
      if (u.dead) continue;
      u.pw -= m;
      if (u.pw <= 0) { killUnit(u, 1 - u.side, 10); burst(u.c, u.r, COL.gold, 4); }
    }
    sfx('crack', Math.min(k, 9));
  }
  if (cl.i >= cl.events.length && tt >= Math.max(0, cl.events.length - 1) * cl.gap + 160) {
    G.clashes.splice(G.clashes.indexOf(cl), 1);
    for (const w of [cl.a, cl.b]) {
      w.units = alive(w);
      for (const u of w.units) if (u.stuck === cl) { u.stuck = false; u.flip = 1; }
      w.state = 'move'; w.t = 0; w.dist = Math.min(w.dist, 1);
    }
    checkContact(cl.a); checkContact(cl.b);
  }
}

/* ===== 盾墙 / 弹反 ===== */
const parryCfg = () => opt('parry') === 'a' ? CFG.PARRY_NEW : CFG.PARRY_OLD;
function guardReady(S, kind) {
  const pc = parryCfg();
  if (kind === 'wall') return S.wallCd <= 0;
  return pc.shared ? S.wallCd <= 0 : S.parryCd <= 0;
}
function raise(s, row, col, kind) {
  const S = G.sides[s], pc = parryCfg();
  const cost = kind === 'wall' ? CFG.WALL_COST : CFG.PARRY_COST;
  if (!guardReady(S, kind)) { sfx('deny'); return false; }
  if (S.troops < cost) { sfx('deny'); if (isHuman(s)) banner(`需要 ${cost} 个兵`, s, true); return false; }
  const lo = s === 0 ? HALF : 1, hi = s === 0 ? ROWS - 2 : HALF - 1;
  row = clamp(row, lo, hi);
  const W = kind === 'wall' ? CFG.WALL_W : CFG.PARRY_W;
  const c0 = clamp(col - Math.floor(W / 2), 0, COLS - W), c1 = c0 + W - 1;
  const wl = { side: s, row, c0, c1, kind, born: G.time, rewarded: false, wave: null,
    until: G.time + (kind === 'wall' ? CFG.WALL_TIME : pc.life) };
  G.walls.push(wl);
  S.troops -= cost;
  if (kind === 'wall') { S.wallCd = CFG.WALL_CD; if (pc.shared) S.parryCd = CFG.WALL_CD; S.stats.walls++; sfx('wall'); }
  else { S.parryCd = pc.cd; if (pc.shared) S.wallCd = pc.cd; sfx('swing'); }
  for (let c = c0; c <= c1; c++) {
    const u = at(c, row);
    if (!u || u.side === s) continue;
    if (kind === 'wall') { killUnit(u, s, 9); sfx('crack', 0); } else parryUnit(u, wl);
  }
  if (isHuman(s)) buzz(15);
  return true;
}
function parryUnit(u, wl) {
  if (u.dead || u.side === wl.side) return;
  const S = G.sides[wl.side], old = u.wave;
  old.units = old.units.filter(x => x !== u);
  if (!wl.rewarded) { wl.rewarded = true; S.stats.parries++; sfx('parry'); if (isHuman(wl.side)) buzz(30); }
  burst(u.c, u.r, COL.gold, 8);
  if (opt('plateau') === 'a') {
    u.dead = true;
    if (G.grid[idx(u.c, u.r)] === u) G.grid[idx(u.c, u.r)] = null;
    S.stats.kills++;
    G.plat[idx(u.c, u.r)] = { side: wl.side, until: G.time + CFG.PLATEAU_TIME, born: G.time };
  } else {
    u.side = wl.side; u.parried = true; u.flip = 0; u.stuck = false;
    if (!wl.wave || !G.waves.includes(wl.wave)) {
      wl.wave = newWave(wl.side, u.axis); wl.wave.speedMul = CFG.PARRY_SPEED; wl.wave.dist = 99;
      G.waves.push(wl.wave);
    }
    u.wave = wl.wave; wl.wave.units.push(u);
    checkContact(wl.wave);
  }
  if (old.state === 'move') checkContact(old);
}

/* ===== 特效 ===== */
function cellCenter(c, r) { return { x: ox + (c + 0.5) * cs, y: boardY + (r + 0.5) * cs }; }
function burst(c, r, color, n) {
  const p = cellCenter(c, r);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (0.6 + Math.random() * 1.8) * cs / 10;
    G.fx.push({ type: 'p', x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, color, size: cs * (0.1 + Math.random() * 0.14) });
  }
}
function banner(text, side, small) {
  const el = document.createElement('div');
  const duo = G && G.mode === 'duo';
  el.className = 'banner' + (duo && side === 1 ? ' s1' : duo && side === 0 ? ' s0' : '');
  if (small) el.style.fontSize = '18px';
  el.textContent = text; stage.appendChild(el);
  setTimeout(() => el.remove(), 1600);
}

/* ===== 电脑对手 ===== */
function aiThink() {
  const L = AI_LV[G.diff], S = G.sides[1];
  const foes = G.waves.filter(w => w.side === 0 && onBoardUnits(w).length);
  let threat = null, best = 99;
  for (const w of foes) {
    const f = Math.min(...onBoardUnits(w).map(u => u.r));
    if (f >= 1 && f <= 6 && f < best && w.state === 'move') { best = f; threat = w; }
  }
  if (threat) {
    const us = onBoardUnits(threat), cc = Math.round(us.reduce((s, u) => s + u.c, 0) / us.length);
    if (S.troops >= CFG.PARRY_COST && guardReady(S, 'paddle') && Math.random() < L.parry) { raise(1, best - 1, cc, 'paddle'); return; }
    if (alive(threat).length >= 3 && S.troops >= CFG.WALL_COST && guardReady(S, 'wall') && Math.random() < L.react) { raise(1, best - 1, cc, 'wall'); return; }
  }
  if (!G.ai.want) G.ai.want = L.min + Math.floor(Math.random() * (L.max - L.min + 1));
  if (S.troops < G.ai.want) return;
  let col = Math.floor(Math.random() * COLS);
  const centers = foes.map(w => { const us = onBoardUnits(w); return { c: us.reduce((s, u) => s + u.c, 0) / us.length, n: alive(w).length }; });
  if (L.intercept) {
    const tgt = centers.find(x => x.n < S.troops);
    if (tgt) col = Math.round(tgt.c);
  } else if (centers.length && G.diff === 'normal') {
    let bestD = -1;
    for (let k = 0; k < 3; k++) {
      const c = Math.floor(Math.random() * COLS);
      const d = Math.min(...centers.map(x => Math.abs(x.c - c)));
      if (d > bestD) { bestD = d; col = c; }
    }
  }
  const n = L.intercept ? S.troops : G.ai.want;
  if (sendWave(1, col, n, 0)) G.ai.want = 0;
}

/* ===== 主循环 ===== */
function update(dt) {
  G.time += dt;
  if (G.hint > 0) G.hint -= dt;
  const fr = G.time >= CFG.FRENZY_AT ? 2 : 1;
  if (fr === 2 && !G.frenzy) { G.frenzy = true; banner('狂热阶段'); }

  for (const S of G.sides) {
    if (S.troops < CFG.TROOP_MAX) {
      S.regen += dt * fr * (S.hp <= CFG.LOW_HP ? CFG.LOW_HP_REGEN : 1);
      if (S.regen >= CFG.TROOP_REGEN) { S.regen -= CFG.TROOP_REGEN; S.troops++; }
    } else S.regen = 0;
    S.wallCd = Math.max(0, S.wallCd - dt * fr);
    S.parryCd = Math.max(0, S.parryCd - dt * fr);
    S.flash = Math.max(0, S.flash - dt / 400);
  }
  G.walls = G.walls.filter(w => w.until > G.time);
  for (let k = 0; k < N; k++) if (G.plat[k] && G.plat[k].until <= G.time) G.plat[k] = null;

  for (const w of G.waves.slice()) {
    if (w.state !== 'move') continue;
    w.t += dt;
    const iv = interval(w);
    if (w.t >= iv) { w.t -= iv; if (stepWave(w) === 'blocked') w.t = iv; }
  }
  for (const w of G.waves) for (const u of w.units) if (!u.dead && !u.stuck) u.flip = Math.min(1, u.flip + dt / 140);
  for (const cl of G.clashes.slice()) updateClash(cl, dt);

  for (const sg of G.surges) {
    sg.t += dt;
    while (sg.t >= CFG.SURGE_STEP) { sg.t -= CFG.SURGE_STEP; sg.r += DIR[sg.side]; }
    if (!onBoard(sg.r)) { sg.dead = true; continue; }
    for (const w of G.waves) {
      if (w.side === sg.side) continue;
      for (const u of w.units) {
        if (u.dead || !onBoard(u.r) || sg.hit.has(u.id)) continue;
        if (sg.side === 0 ? u.r >= sg.r : u.r <= sg.r) {
          sg.hit.add(u.id); u.pw -= 1; burst(u.c, u.r, COL.unit[sg.side], 3);
          if (u.pw <= 0) killUnit(u, sg.side);
        }
      }
    }
  }
  G.surges = G.surges.filter(s => !s.dead);
  G.waves = G.waves.filter(w => { if (w.state === 'move') w.units = alive(w); return w.units.length > 0 || w.state === 'clash'; });

  for (const f of G.fx) {
    if (f.type === 'p') { f.x += f.vx; f.y += f.vy; f.vx *= 0.92; f.vy *= 0.92; }
    f.life -= dt / 450;
  }
  G.fx = G.fx.filter(f => f.life > 0);
  for (let k = 0; k < N; k++) if (G.rip[k] > 0) G.rip[k] = Math.max(0, G.rip[k] - dt / 380);
  G.shake = Math.max(0, G.shake - dt / 30);

  if (G.mode === 'ai') { G.ai.t -= dt; if (G.ai.t <= 0) { G.ai.t = AI_LV[G.diff].think * (0.7 + Math.random() * 0.6); aiThink(); } }
  checkEnd();
}
function unitCount(s) { let n = 0; for (const w of G.waves) if (w.side === s) n += alive(w).length; return n; }
function checkEnd() {
  const [A, B] = G.sides;
  let w;
  if (A.hp <= 0 || B.hp <= 0) w = A.hp <= 0 && B.hp <= 0 ? -1 : A.hp <= 0 ? 1 : 0;
  else if (G.time >= CFG.MATCH) w = A.hp === B.hp ? -1 : A.hp > B.hp ? 0 : 1;
  else return;
  endGame(w);
}

/* ===== 绘制 ===== */
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();
}
function card(cx, cy, sz, s, theta, color, rad) {
  ctx.save(); ctx.translate(cx, cy);
  if (theta) ctx.rotate(theta);
  ctx.scale(1, Math.max(0.05, s));
  if (theta) ctx.rotate(-theta);
  ctx.fillStyle = color; rr(-sz / 2, -sz / 2, sz, sz, rad);
  ctx.restore();
}
function drawBase(s, y) {
  const hp = G ? G.sides[s].hp : CFG.BASE_HP, fl = G ? G.sides[s].flash : 0;
  const segs = CFG.BASE_HP, sw = cs * COLS / segs, start = Math.floor((segs - hp) / 2), h = cs * 0.6;
  for (let i = 0; i < segs; i++) {
    const on = i >= start && i < start + hp;
    ctx.fillStyle = on ? (fl > 0.5 ? '#ffffff' : COL.unit[s]) : COL.baseOff;
    rr(ox + i * sw + sw * 0.1, y, sw * 0.8, h, sw * 0.18);
  }
}
function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = cv.width / dpr, H = cv.height / dpr;
  ctx.fillStyle = COL.frame; ctx.fillRect(0, 0, W, H);
  if (G && G.shake > 0) ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
  const bw = cs * COLS, bh = cs * ROWS, pad = cs * 0.08, sz = cs - pad * 2, rad = cs * 0.14;

  ctx.fillStyle = COL.plate; rr(ox - cs * 0.15, oy - cs * 0.15, bw + cs * 0.3, bh + cs * 2.1, cs * 0.25);
  if (G && G.frenzy) {
    ctx.strokeStyle = COL.gold; ctx.globalAlpha = 0.45 + 0.35 * Math.sin(G.time / 120);
    ctx.lineWidth = 2; ctx.strokeRect(ox - cs * 0.15, oy - cs * 0.15, bw + cs * 0.3, bh + cs * 2.1);
    ctx.globalAlpha = 1;
  }
  drawBase(1, oy);
  drawBase(0, boardY + bh + cs * 0.3);
  ctx.fillStyle = COL.hole; ctx.fillRect(ox, boardY, bw, bh);

  // 格子：中性 / 领地 / 台地 / 波纹
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const k = r * COLS + c, cx = ox + (c + 0.5) * cs, cy = boardY + (r + 0.5) * cs;
    const p = G && G.plat[k];
    if (p) {
      const lift = cs * 0.13;
      ctx.fillStyle = COL.dark[p.side]; rr(cx - sz / 2, cy - sz / 2, sz, sz, rad);
      const left = (p.until - G.time) / CFG.PLATEAU_TIME;
      ctx.globalAlpha = left < 0.25 && Math.floor(G.time / 120) % 2 ? 0.55 : 1;
      ctx.fillStyle = COL.plat[p.side]; rr(cx - sz / 2, cy - sz / 2 - lift, sz, sz, rad);
      ctx.globalAlpha = 1;
      continue;
    }
    const t = G && opt('terr') ? G.terr[k] : -1;
    const base = t < 0 ? COL.neutral : COL.soft[t];
    const rp = G ? G.rip[k] : 0;
    if (rp > 0.02) {
      const th = AXIS[G.ripAxis[k]], s = Math.cos(rp * 0.38 * Math.PI);
      card(cx, cy, sz, s, th, base, rad);
      ctx.globalAlpha = rp * 0.6; card(cx, cy, sz, s, th, COL.soft[G.ripSide[k]], rad); ctx.globalAlpha = 1;
    } else { ctx.fillStyle = base; rr(cx - sz / 2, cy - sz / 2, sz, sz, rad); }
  }
  // 中线刻度
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.fillRect(ox - cs * 0.12, boardY + HALF * cs - 1, cs * 0.08, 2);
  ctx.fillRect(ox + bw + cs * 0.04, boardY + HALF * cs - 1, cs * 0.08, 2);
  if (!G) return;

  // 来袭预警
  if (opt('warn')) {
    const pulse = 0.18 + 0.12 * Math.sin(G.time / 110);
    for (const w of G.waves) {
      if (w.state !== 'move' || w.parried) continue;
      const us = onBoardUnits(w); if (!us.length) continue;
      const crossed = w.side === 1 ? us.some(u => u.r >= HALF) : us.some(u => u.r < HALF);
      if (crossed) continue;
      const def = 1 - w.side; if (!isHuman(def)) continue;
      const y = boardY + (def === 0 ? HALF : HALF - 2) * cs;
      ctx.fillStyle = COL.unit[w.side];
      for (const c of new Set(us.map(u => u.c))) { ctx.globalAlpha = pulse; ctx.fillRect(ox + c * cs, y, cs, cs * 2); }
      ctx.globalAlpha = 1;
    }
  }
  // 浪涌
  for (const sg of G.surges) {
    ctx.fillStyle = COL.unit[sg.side]; ctx.globalAlpha = 0.3;
    ctx.fillRect(ox, boardY + sg.r * cs, bw, cs);
    ctx.globalAlpha = 0.95; ctx.fillRect(ox, boardY + (sg.side === 0 ? sg.r * cs : (sg.r + 1) * cs - 3), bw, 3);
    ctx.globalAlpha = 1;
  }
  // 小兵
  for (const w of G.waves) for (const u of w.units) {
    if (u.dead || !onBoard(u.r)) continue;
    const cx = ox + (u.c + 0.5) * cs, cy0 = boardY + (u.r + 0.5) * cs;
    const lift = G.plat[idx(u.c, u.r)] ? cs * 0.13 : 0, cy = cy0 - lift;
    if (u.stuck) {
      const p = clamp(u.stuck.t / CFG.CLASH_HOLD, 0, 1), d = DIR[u.side];
      if (opt('impact') === 'a') {
        const j = (Math.random() - 0.5) * cs * 0.08 * (p < 1 ? 1 : 0.4);
        card(cx + j, cy, sz, Math.abs(Math.cos(0.62 * Math.PI)) + 0.05 * Math.sin(G.time / 25), AXIS[u.axis], COL.unit[u.side], rad);
      } else {
        const h = sz * (1 - 0.32 * p), shear = ((u.c % 2) ? 1 : -1) * 0.38 * p;
        ctx.save(); ctx.translate(cx, cy - d * sz / 2); ctx.transform(1, 0, shear * d, 1, 0, 0);
        ctx.fillStyle = COL.unit[u.side]; ctx.fillRect(-sz / 2, 0, sz, d * h); ctx.restore();
      }
    } else {
      const f = u.flip, s = Math.abs(Math.cos(Math.PI * f));
      card(cx, cy, sz, s, AXIS[u.axis], f < 0.5 ? COL.back : COL.unit[u.side], rad);
      if (f >= 0.5 && u.parried) { ctx.strokeStyle = COL.gold; ctx.lineWidth = 2; ctx.strokeRect(cx - sz / 2 + 1, cy - sz / 2 + 1, sz - 2, sz - 2); }
    }
    if (u.pw > 1 && (u.stuck || u.flip >= 0.5)) {
      ctx.fillStyle = '#fff'; ctx.font = `700 ${Math.round(cs * 0.48)}px Silkscreen, ui-monospace, monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(u.pw), cx, cy + 1);
    }
  }
  // 盾墙 / 弹板
  for (const w of G.walls) {
    const x = ox + w.c0 * cs, y = boardY + w.row * cs, ww = (w.c1 - w.c0 + 1) * cs;
    if (w.kind === 'wall') {
      ctx.globalAlpha = (w.until - G.time) / CFG.WALL_TIME < 0.2 ? 0.5 : 1;
      ctx.fillStyle = COL.dark[w.side]; rr(x + 2, y + cs * 0.2, ww - 4, cs * 0.6, cs * 0.1);
      ctx.fillStyle = '#e8ecf2'; ctx.fillRect(x + 4, y + cs * 0.2 + 2, ww - 8, cs * 0.1);
      ctx.globalAlpha = 1;
    } else {
      ctx.save(); ctx.shadowColor = COL.gold; ctx.shadowBlur = cs * 0.6;
      ctx.fillStyle = COL.gold; rr(x + 2, y + cs * 0.36, ww - 4, cs * 0.28, cs * 0.1); ctx.restore();
    }
  }
  // 碎片
  for (const f of G.fx) {
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = f.color; ctx.fillRect(f.x - f.size / 2, f.y - f.size / 2, f.size, f.size);
  }
  ctx.globalAlpha = 1;
  // 蓄兵数字
  for (let s = 0; s < 2; s++) {
    const p = G.ptr[s]; if (!p || !p.showN) continue;
    const b = cv.getBoundingClientRect(), x = p.x - b.left, y = p.y - b.top;
    ctx.save(); ctx.translate(x, y); if (s === 1 && G.mode === 'duo') ctx.rotate(Math.PI);
    const ok = p.n >= CFG.MIN_WAVE;
    ctx.fillStyle = 'rgba(10,12,16,.75)'; rr(-cs * 1.1, -cs * 3.1, cs * 2.2, cs * 1.6, cs * 0.3);
    ctx.fillStyle = ok ? COL.unit[s] : '#6b7380';
    ctx.font = `700 ${Math.round(cs * 1.1)}px Silkscreen, ui-monospace, monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(ok ? p.n : CFG.MIN_WAVE), 0, -cs * 2.25);
    ctx.restore();
  }
  // 新手提示
  if (G.hint > 0) {
    ctx.globalAlpha = Math.min(1, G.hint / 800);
    ctx.fillStyle = 'rgba(10,12,16,.8)'; ctx.fillRect(ox, boardY + bh * 0.56, bw, cs * 4.2);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `${Math.round(cs * 0.6)}px -apple-system, "PingFang SC", "Noto Sans SC", sans-serif`;
    ['按住蓄兵，往上拨发射（至少 3 个）', '往下拨：盾墙（耗 2 兵）', '下拨马上上拨（V 字）：弹反（耗 1 兵）', '斜着拨：沿对角线翻转']
      .forEach((t, i) => ctx.fillText(t, ox + bw / 2, boardY + bh * 0.56 + cs * (0.65 + i * 0.95)));
    ctx.globalAlpha = 1;
  }
}

/* ===== HUD ===== */
const hudEls = [];
function buildHud() {
  for (let s = 0; s < 2; s++) {
    const el = $('#hud' + s), ai = G.mode === 'ai' && s === 1;
    el.classList.toggle('flip', G.mode === 'duo' && s === 1);
    const who = G.mode === 'duo' ? (s === 0 ? '蓝方' : '橙方') : ai ? '电脑 · ' + AI_LV[G.diff].label : '你';
    el.innerHTML = `
      <div class="row">
        <div class="hp"><b class="hpv">20</b><small>基地 · ${who}</small></div>
        <div class="grp"><small>兵力 <span class="tn">0</span></small><div class="pips">${'<span></span>'.repeat(CFG.TROOP_MAX)}</div></div>
        <div class="clock">3:00</div>
        ${ai ? '' : '<button class="pbtn" aria-label="暂停">II</button>'}
      </div>
      <div class="row">
        <div class="grp grow gw"><small>盾墙 · 2 兵</small><div class="bar"><i></i></div></div>
        <div class="grp grow gp"><small>弹反 · 1 兵</small><div class="bar"><i></i></div></div>
      </div>`;
    const pips = [...el.querySelectorAll('.pips span')];
    pips.forEach((p, i) => p.classList.toggle('min', i === CFG.MIN_WAVE - 1));
    hudEls[s] = { hp: el.querySelector('.hpv'), tn: el.querySelector('.tn'), pips, clock: el.querySelector('.clock'),
      gw: el.querySelector('.gw'), gp: el.querySelector('.gp'), gwb: el.querySelector('.gw i'), gpb: el.querySelector('.gp i') };
    const pb = el.querySelector('.pbtn'); if (pb) pb.addEventListener('click', pauseGame);
  }
}
function updateHud() {
  if (!G || !hudEls[0]) return;
  const left = Math.max(0, CFG.MATCH - G.time), m = Math.floor(left / 60000), sec = Math.floor(left / 1000) % 60;
  const clock = `${m}:${String(sec).padStart(2, '0')}`, pc = parryCfg();
  for (let s = 0; s < 2; s++) {
    const S = G.sides[s], h = hudEls[s];
    h.hp.textContent = S.hp; h.tn.textContent = S.troops;
    h.pips.forEach((e, i) => e.classList.toggle('on', i < S.troops));
    h.clock.textContent = clock; h.clock.classList.toggle('hot', G.frenzy);
    h.gwb.style.width = ((1 - S.wallCd / CFG.WALL_CD) * 100) + '%';
    const pcd = pc.shared ? S.wallCd : S.parryCd;
    h.gpb.style.width = ((1 - pcd / pc.cd) * 100) + '%';
    h.gw.classList.toggle('ready', S.wallCd <= 0 && S.troops >= CFG.WALL_COST);
    h.gp.classList.toggle('ready', pcd <= 0 && S.troops >= CFG.PARRY_COST);
  }
}

/* ===== 手势：同一时间每方只认一个手指 ===== */
const pidSide = new Map();
const TH = () => Math.max(14, cs * 0.6);
function fwd(side, dy) { return side === 0 ? -dy : dy; }
cv.addEventListener('pointerdown', e => {
  audio();
  if (!G || G.over || G.paused) return;
  const cell = cellAt(e.clientX, e.clientY);
  const side = G.mode === 'duo' ? (cell.r < HALF ? 1 : 0) : 0;
  if (G.ptr[side]) return;
  G.ptr[side] = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, t0: performance.now(),
    c: clamp(cell.c, 0, COLS - 1), r: clamp(cell.r, 0, ROWS - 1), minF: 0, n: 0, showN: true };
  pidSide.set(e.pointerId, side);
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  const side = pidSide.get(e.pointerId); if (side == null || !G) return;
  const p = G.ptr[side]; if (!p || p.id !== e.pointerId) return;
  p.x = e.clientX; p.y = e.clientY;
  const f = fwd(side, e.clientY - p.y0);
  if (!p.mvT && Math.hypot(e.clientX - p.x0, e.clientY - p.y0) > 6) p.mvT = performance.now();
  if (f < p.minF) p.minF = f;
  if (p.minF <= -TH()) p.showN = false;
});
function holdCount(side, p) {
  const T = G.sides[side].troops;
  return opt('send') === 'a' ? Math.min(T, CFG.MIN_WAVE + Math.floor((performance.now() - p.t0) / CFG.HOLD_STEP)) : T;
}
function endPtr(e, cancel) {
  const side = pidSide.get(e.pointerId); pidSide.delete(e.pointerId);
  if (side == null || !G) return;
  const p = G.ptr[side]; if (!p || p.id !== e.pointerId) return;
  G.ptr[side] = null;
  if (cancel || G.over || G.paused) return;
  const dx = e.clientX - p.x0, dy = e.clientY - p.y0, f = fwd(side, dy), th = TH();
  const gest = performance.now() - (p.mvT || p.t0);
  if (p.minF <= -th && f - p.minF >= th && gest <= parryCfg().win) {
    raise(side, p.r, p.c, 'paddle');
  } else if (p.minF <= -th) {
    raise(side, p.r, p.c, 'wall');
  } else if (f >= th) {
    let axis = 0;
    if (opt('diag')) {
      let th2 = Math.atan2(dx, -dy);
      while (th2 > Math.PI / 2) th2 -= Math.PI;
      while (th2 <= -Math.PI / 2) th2 += Math.PI;
      if (Math.abs(th2) > Math.PI / 8) axis = th2 > 0 ? 1 : -1;
    }
    sendWave(side, p.c, holdCount(side, p), axis);
  }
}
cv.addEventListener('pointerup', e => endPtr(e, false));
cv.addEventListener('pointercancel', e => endPtr(e, true));

/* ===== 调试栏 ===== */
const dbgEl = $('#dbg'), scrim = $('#dbgScrim');
function renderDbg() {
  const list = $('#dbgList');
  list.innerHTML = DEBUG.map(d => {
    const v = DBG.val[d.id], vd = DBG.verdict[d.id];
    const ctrl = d.type === 'bool'
      ? `<button class="sw" data-id="${d.id}" aria-pressed="${v ? 'true' : 'false'}" aria-label="${d.name}"></button>`
      : '';
    const seg = d.type === 'ab'
      ? `<div class="seg"><button data-id="${d.id}" data-v="a" aria-pressed="${v === 'a'}">${d.a}</button><button data-id="${d.id}" data-v="b" aria-pressed="${v === 'b'}">${d.b}</button></div>`
      : '';
    return `<div class="it v-${vd}" data-item="${d.id}">
      <div class="it-top"><span class="it-name">${d.name}</span>${ctrl}</div>
      ${d.desc ? `<div class="it-desc">${d.desc}</div>` : ''}
      ${seg}
      <div class="vd">
        <button class="yes ${vd === 'yes' ? 'on' : ''}" data-id="${d.id}" data-vd="yes">采纳</button>
        <button class="no ${vd === 'no' ? 'on' : ''}" data-id="${d.id}" data-vd="no">不采纳</button>
        <button class="wait ${vd === 'wait' ? 'on' : ''}" data-id="${d.id}" data-vd="wait">待定</button>
      </div></div>`;
  }).join('');
}
$('#dbgList').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const id = b.dataset.id; if (!id) return;
  if (b.classList.contains('sw')) DBG.val[id] = !DBG.val[id];
  else if (b.dataset.v) DBG.val[id] = b.dataset.v;
  else if (b.dataset.vd) DBG.verdict[id] = b.dataset.vd;
  saveDbg(); renderDbg();
});
function dbgSummary() {
  const now = new Date(), d = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  const tag = { yes: '采纳', no: '不采纳', wait: '待定' };
  const lines = DEBUG.map(x => {
    const v = DBG.val[x.id], cur = x.type === 'bool' ? (v ? '开' : '关') : (v === 'a' ? x.a : x.b);
    return `- ${x.name}：当前「${cur}」【${tag[DBG.verdict[x.id]]}】`;
  });
  return `像素小兵 v2 调试结论（${d}）\n` + lines.join('\n');
}
function flashMsg(t) { const m = $('#dbgMsg'); m.textContent = t; clearTimeout(flashMsg.t); flashMsg.t = setTimeout(() => m.textContent = '', 2600); }
$('#dbgCopy').addEventListener('click', () => {
  const text = dbgSummary();
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove(); flashMsg(ok ? '已复制，发给 Claude 即可' : '复制失败，请截图发给 Claude');
  };
  try { navigator.clipboard.writeText(text).then(() => flashMsg('已复制，发给 Claude 即可'), fallback); } catch (e) { fallback(); }
});
$('#dbgReset').addEventListener('click', () => { for (const d of DEBUG) DBG.val[d.id] = d.def; saveDbg(); renderDbg(); flashMsg('开关已恢复默认，结论标记保留'); });
function openDbg(open) {
  dbgEl.classList.toggle('open', open); scrim.classList.toggle('open', open);
  if (open && G && !G.over && !G.paused) { G.paused = true; G.autoPaused = true; }
  if (!open && G && G.autoPaused) { G.paused = false; G.autoPaused = false; last = 0; }
}
$('#dbgTab').addEventListener('click', () => openDbg(true));
$('#dbgClose').addEventListener('click', () => openDbg(false));
scrim.addEventListener('click', () => openDbg(false));
renderDbg();

/* ===== 界面流程 ===== */
function hideOverlays() { ['#menu', '#pause', '#end'].forEach(s => $(s).hidden = true); }
function showMenu() { G = null; hideOverlays(); $('#menu').hidden = false; ['#hud0', '#hud1'].forEach(s => $(s).innerHTML = ''); hudEls.length = 0; resize(); }
function pauseGame() { if (!G || G.over) return; G.paused = true; G.autoPaused = false; $('#pause').hidden = false; }
$('#resume').addEventListener('click', () => { if (G) G.paused = false; $('#pause').hidden = true; last = 0; });
$('#restart').addEventListener('click', () => { if (lastSetup) newGame(lastSetup.mode, lastSetup.diff); });
$('#toMenu').addEventListener('click', showMenu);
$('#mute').addEventListener('click', e => { muted = !muted; e.target.textContent = '声音：' + (muted ? '关' : '开'); });
document.querySelectorAll('#menu [data-mode]').forEach(b => b.addEventListener('click', () => { audio(); newGame(b.dataset.mode, b.dataset.diff || 'normal'); }));
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

function endGame(w) {
  G.over = true; G.ptr = [null, null];
  const [A, B] = G.sides;
  const title = G.mode === 'ai' ? (w === 0 ? '胜利' : w === 1 ? '惜败' : '平局') : (w === 0 ? '蓝方获胜' : w === 1 ? '橙方获胜' : '平局');
  const n = v => `<span class="n">${v}</span>`, ov = $('#end');
  ov.innerHTML = `<div class="panel">
    <h2>${title}</h2>
    <div class="statgrid">
      <span class="h"></span><span class="h">${G.mode === 'ai' ? '你' : '蓝方'}</span><span class="h">${G.mode === 'ai' ? '电脑' : '橙方'}</span>
      <span class="h">基地剩余</span>${n(A.hp)}${n(B.hp)}
      <span class="h">击碎敌兵</span>${n(A.stats.kills)}${n(B.stats.kills)}
      <span class="h">打进基地</span>${n(A.stats.hits)}${n(B.stats.hits)}
      <span class="h">弹反成功</span>${n(A.stats.parries)}${n(B.stats.parries)}
      <span class="h">升起盾墙</span>${n(A.stats.walls)}${n(B.stats.walls)}
    </div>
    <div class="btns"><button class="btn main" id="again">再来一局</button><button class="btn" id="endMenu">回到菜单</button></div></div>`;
  ov.hidden = false;
  ov.querySelector('#again').addEventListener('click', () => newGame(lastSetup.mode, lastSetup.diff));
  ov.querySelector('#endMenu').addEventListener('click', showMenu);
}

function frame(ts) {
  const dt = last ? Math.min(50, ts - last) : 16; last = ts;
  if (G && !G.over && !G.paused) {
    update(dt);
    for (let s = 0; s < 2; s++) { const p = G.ptr[s]; if (p) p.n = holdCount(s, p); }
  }
  draw(); updateHud();
  requestAnimationFrame(frame);
}
window.__pl = { get G() { return G; }, newGame, sendWave, raise, update, CFG, DBG, opt };
resize();
requestAnimationFrame(frame);
})();
</script>
