<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1217">
<title>像素小兵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* 布局：常驻调试栏（可收窄）+ 游戏区（左血量条 / 3D 翻板棋盘 / 右冷却条）；单一暗色外观 */
:root{
  --frame:#0f1217; --panel:#161a21; --raise:#1e242d; --line:#2a313c; --ink:#e9ece4; --muted:#8b94a1;
  --blue:#2f6bff; --orange:#ff7a1a; --gold:#ffd84a; --ok:#3fbf7f; --no:#e5534b;
  --f-pix:"Silkscreen", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-cn:"ZCOOL QingKe HuangYou","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-body:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--frame);color:var(--ink);font-family:var(--f-body);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#shell{height:100%;display:flex}
#main{flex:1;min-width:0;position:relative;display:flex;justify-content:center}
#app{height:100%;width:100%;max-width:600px;display:flex;gap:6px;padding:6px 16px;box-sizing:border-box}
#stage{flex:1;position:relative;min-width:0}
#board{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- 两侧功能条 ---------- */
#lbar,#rbar{width:30px;flex:none;display:flex;flex-direction:column;gap:8px;padding-block:6px}
.hpcol{--side:var(--blue);flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.hpcol.s1{--side:var(--orange)}
.hpn{font:700 14px var(--f-pix);color:var(--side);font-variant-numeric:tabular-nums}
.blocks{flex:1;min-height:0;width:14px;display:flex;flex-direction:column;gap:2px}
.hpcol.s0 .blocks{flex-direction:column-reverse}
.blocks span{flex:1;min-height:1px;background:var(--side)}
.blocks span.gone{animation:gone .45s forwards}
@keyframes gone{0%{background:#fff;transform:scale(1.5,1.2)}100%{transform:scale(0);opacity:0}}
.cds{--side:var(--blue);display:flex;flex-direction:column;gap:6px;align-items:center}
.cds.s1{--side:var(--orange)}
.flip{transform:rotate(180deg)}
.cd{width:30px;height:30px;position:relative;background:var(--raise);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;box-sizing:border-box}
.cd i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--side);opacity:.35}
.cd span{position:relative;font-size:12px;color:var(--muted)}
.cd.ready{border-color:var(--side)}
.cd.ready span{color:var(--ink)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.clock{font:700 10px var(--f-pix);font-variant-numeric:tabular-nums;color:var(--ink)}
.clock.hot{color:var(--gold)}
.pbtn{font:700 12px var(--f-pix);color:var(--ink);background:var(--raise);border:1px solid var(--line);width:30px;height:30px;padding:0;cursor:pointer}

.holdn{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font:700 28px var(--f-pix);color:var(--blue);background:rgba(10,12,16,.78);padding:2px 10px;pointer-events:none;font-variant-numeric:tabular-nums}
.holdn.s1{color:var(--orange)}
.holdn.low{color:#6b7380}
.hint{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:min(92%,340px);background:rgba(10,12,16,.86);border:1px solid var(--line);padding:12px 14px;display:grid;gap:6px;font-size:13.5px;pointer-events:none;transition:opacity .6s}
.hint b{color:var(--gold);font-weight:600}
.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-cn);font-size:24px;background:rgba(15,18,23,.84);border:1px solid var(--line);padding:6px 16px;pointer-events:none;white-space:nowrap;animation:ban 1.5s forwards}
.banner.s0{top:70%}
.banner.s1{top:30%;transform:translate(-50%,-50%) rotate(180deg)}
@keyframes ban{0%{opacity:0}12%{opacity:1}75%{opacity:1}100%{opacity:0}}

/* ---------- 调试栏（常驻） ---------- */
#dbg{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;box-sizing:border-box}
.dbg-head{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 14px;border-bottom:1px solid var(--line)}
.dbg-head h2{font-family:var(--f-cn);font-weight:400;font-size:22px;margin:0}
.dbg-head .tag{font:700 11px var(--f-pix);color:var(--muted)}
.dbg-head .x{margin-left:auto;background:none;border:1px solid var(--line);color:var(--ink);height:28px;padding:0 8px;cursor:pointer;font-size:12px}
.dbg-note{margin:0;padding:8px 14px 0;font-size:12px;color:var(--muted)}
.dbg-list{flex:1;overflow-y:auto;padding:8px 10px 12px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.grp-t{font-size:11px;color:var(--muted);letter-spacing:.12em;padding:8px 2px 2px}
.it{background:var(--raise);border:1px solid var(--line);padding:9px 10px;display:grid;gap:6px}
.it.v-yes{border-left:3px solid var(--ok)}
.it.v-no{border-left:3px solid var(--no);opacity:.7}
.it-top{display:flex;align-items:center;gap:8px}
.it-name{font-size:14px;font-weight:600;flex:1;min-width:0}
.it-val{font:700 13px var(--f-pix);color:var(--gold);font-variant-numeric:tabular-nums}
.it-desc{font-size:11.5px;color:var(--muted);line-height:1.35}
.it input[type=range]{width:100%;accent-color:var(--blue);margin:0}
.sw{position:relative;width:40px;height:22px;border-radius:11px;background:var(--line);border:none;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw[aria-pressed="true"]{background:var(--blue)}
.sw[aria-pressed="true"]::after{transform:translateX(18px);background:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.seg button{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:6px 4px;cursor:pointer;line-height:1.25}
.seg button[aria-pressed="true"]{color:#fff;background:var(--blue);border-color:var(--blue)}
.vd{display:flex;gap:4px}
.vd button{flex:1;font-size:11.5px;color:var(--muted);background:none;border:1px solid var(--line);padding:4px 0;cursor:pointer}
.vd button.on.yes{color:#fff;background:var(--ok);border-color:var(--ok)}
.vd button.on.no{color:#fff;background:var(--no);border-color:var(--no)}
.vd button.on.wait{color:var(--frame);background:var(--muted);border-color:var(--muted)}
.dbg-foot{padding:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:6px}
.dbg-msg{grid-column:1/-1;font-size:11.5px;color:var(--ok);min-height:14px;margin:0}
.dbg-mini{display:none;writing-mode:vertical-rl;font:15px var(--f-cn);letter-spacing:.2em;color:var(--ink);background:none;border:none;cursor:pointer;padding:16px 0;margin:0 auto}
#dbg.mini{width:36px}
#dbg.mini > :not(.dbg-mini){display:none}
#dbg.mini .dbg-mini{display:block}

/* ---------- 弹层 ---------- */
.btn{font-size:15px;color:var(--ink);background:var(--raise);border:1px solid var(--line);padding:11px 10px;cursor:pointer}
.btn.main{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.wide{grid-column:1/-1}
.ov{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(9,11,15,.9);padding:16px;box-sizing:border-box}
.panel{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
h1{font-family:var(--f-cn);font-weight:400;font-size:44px;margin:0;line-height:1}
.panel h2{font-family:var(--f-cn);font-weight:400;font-size:28px;margin:0}
.sub{margin:0;color:var(--muted);font-size:14px}
.strip{display:flex;gap:3px}
.strip span{width:18px;height:18px;background:#cdd2c9;animation:walk 1.8s steps(1) infinite}
@keyframes walk{0%{background:var(--blue)}11%{background:#cdd2c9}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.how{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13px;color:var(--muted)}
.how b{color:var(--ink);font-weight:600;display:inline-block;min-width:7.5em}
.statgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 12px;font-size:13px}
.statgrid .h{color:var(--muted)}
.statgrid .n{font-family:var(--f-pix);font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}
@media (prefers-reduced-motion:reduce){.strip span{animation:none}.banner{animation:none}}
</style>
</head>
<body>

<div id="shell">
  <aside id="dbg" aria-label="调试栏">
    <button class="dbg-mini" id="dbgOpen" aria-label="展开调试栏">调试</button>
    <div class="dbg-head"><h2>调试栏</h2><span class="tag">v4</span><button class="x" id="dbgClose" aria-label="收窄调试栏">收起</button></div>
    <p class="dbg-note">开关和滑块随时调、立刻生效（标“下一局”的除外）。试完给每一项标上采纳或不采纳，结论保存在这台设备上。</p>
    <div class="dbg-list" id="dbgList"></div>
    <div class="dbg-foot">
      <button class="btn main" id="dbgCopy">复制结论</button>
      <button class="btn" id="dbgReset">恢复默认</button>
      <p class="dbg-msg" id="dbgMsg"></p>
    </div>
  </aside>

  <div id="main">
    <div id="app">
      <div id="lbar"></div>
      <div id="stage">
        <canvas id="board"></canvas>
        <div class="holdn" id="hold0" hidden></div>
        <div class="holdn s1" id="hold1" hidden></div>
      </div>
      <div id="rbar"></div>
    </div>

    <div class="ov" id="menu">
      <div class="panel">
        <div class="strip" aria-hidden="true"><span style="animation-delay:0s"></span><span style="animation-delay:.2s"></span><span style="animation-delay:.4s"></span><span style="animation-delay:.6s"></span><span style="animation-delay:.8s"></span><span style="animation-delay:1s"></span><span style="animation-delay:1.2s"></span><span style="animation-delay:1.4s"></span><span style="animation-delay:1.6s"></span></div>
        <h1>像素小兵</h1>
        <p class="sub" id="menuSub">攒兵、成波冲锋，翻板一格一格滚过去冲垮对方基地。一局 3 分钟。</p>
        <div class="modes">
          <button class="btn" data-mode="ai" data-diff="easy">人机 · 简单</button>
          <button class="btn main" data-mode="ai" data-diff="normal">人机 · 普通</button>
          <button class="btn" data-mode="ai" data-diff="hard">人机 · 困难</button>
          <button class="btn" data-mode="duo">同屏双人</button>
        </div>
        <ul class="how">
          <li><b>按住 → 移动瞄准 → 上拨</b>从松手的那一列成波发射（至少 3 个）</li>
          <li><b>往下拉住</b>立刻举起盾墙，松手放下（耗 2 兵）</li>
          <li><b>拉住后往上一弹</b>像橡皮筋一样把碰到的敌兵弹回去（再耗 1 兵）</li>
          <li><b>斜着拨</b>整波沿对角线翻滚</li>
        </ul>
      </div>
    </div>
    <div class="ov" id="pause" hidden>
      <div class="panel">
        <h2>暂停</h2>
        <div class="modes">
          <button class="btn main wide" id="resume">继续</button>
          <button class="btn" id="restart">重新开始</button>
          <button class="btn" id="toMenu">回到菜单</button>
          <button class="btn wide" id="mute">声音：开</button>
        </div>
      </div>
    </div>
    <div class="ov" id="end" hidden></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
if (!window.THREE) { $('#menuSub').textContent = '3D 引擎没有加载成功，请检查网络后刷新页面。'; return; }

/* ===== 固定数值（常调的在调试栏里） ===== */
const CFG = {
  COLS: 13, MAX_ROWS: 28,
  TROOP_START: 4, MIN_WAVE: 3, MAX_W: 5, HOLD_STEP: 150,
  ARROW_LAG: 0.5,
  WALL_COST: 2, WALL_W: 3, WALL_CD: 6000, WALL_ARC: 0.5,
  PARRY_COST: 1, PARRY_CD: 3000, FLICK_MS: 300, PULL_PX: 90, CATCH_PULL: 0.15, CATCH_GAP: 0.8,
  PARRY_SPEED: 1.5, PLATEAU_TIME: 6000, STAGGER_MAX: 600,
  SURGE_FRAC: 0.75, SURGE_STEP: 160,
  OWN_TERR: 1.25, ENEMY_TERR: 0.85, WARN_FADE: 400,
  MATCH: 180000, FRENZY_AT: 120000, LOW_HP_FRAC: 0.2, LOW_HP_REGEN: 1.3,
  TILE: 0.95, THICK: 0.16, SOLDIER_H: 0.46, PW_H: 0.2, PLAT_LIFT: 0.3,
};
const AI_LV = {
  easy:   { think: 950, react: 0.4,  parry: 0,    min: 3, max: 5,  label: '简单' },
  normal: { think: 620, react: 0.7,  parry: 0.3,  min: 4, max: 9,  label: '普通' },
  hard:   { think: 400, react: 0.95, parry: 0.6,  min: 6, max: 12, intercept: true, label: '困难' },
};

/* ===== 调试项 ===== */
const DEBUG = [
  { g: '数值' },
  { id: 'regen',   name: '兵员生成间隔', type: 'num', min: 0.3, max: 2, step: 0.05, def: 0.75, unit: '秒', desc: '多久生成 1 个兵' },
  { id: 'tmax',    name: '兵力上限',     type: 'num', min: 6, max: 20, step: 1, def: 20, unit: '个', desc: '满兵浪涌门槛 = 上限的 3/4' },
  { id: 'vmax',    name: '最高速度',     type: 'num', min: 0.1, max: 0.5, step: 0.01, def: 0.25, unit: '秒/格', desc: '跑满速后每走一格要多久，越小越快' },
  { id: 'vmin',    name: '起步速度',     type: 'num', min: 0.25, max: 1, step: 0.05, def: 0.65, unit: '秒/格', desc: '刚出发时每走一格要多久（“先慢后快”打开时有效）' },
  { id: 'hold',    name: '僵持时长',     type: 'num', min: 0, max: 0.8, step: 0.05, def: 0.3, unit: '秒', desc: '撞上后卡住多久才开始崩' },
  { id: 'gap',     name: '崩碎间隔',     type: 'num', min: 0, max: 0.2, step: 0.01, def: 0.1, unit: '秒', desc: '每格之间隔多久崩（总长不超过 0.6 秒）' },
  { id: 'wallMax', name: '盾墙最长时间', type: 'num', min: 1, max: 5, step: 0.5, def: 3, unit: '秒', desc: '按住盾墙最多维持多久，到时自动放下' },
  { id: 'hp',      name: '基地血量',     type: 'num', min: 10, max: 50, step: 5, def: 30, unit: '', desc: '下一局生效' },
  { id: 'rows',    name: '战场行数',     type: 'num', min: 14, max: 28, step: 2, def: 22, unit: '行', desc: '下一局生效；每方各占一半' },
  { g: '画面' },
  { id: 'view',    name: '镜头',     type: 'ab', a: '斜俯视（不分远近）', b: '透视（近大远小）', def: 'a' },
  { id: 'shadow',  name: '阴影',     type: 'bool', def: true, desc: '卡顿时关掉' },
  { id: 'shield',  name: '盾的样子', type: 'ab', a: '半透特效', b: '实体', def: 'a', desc: '盾墙和橡皮筋的外观' },
  { id: 'impact',  name: '撞击效果', type: 'ab', a: '卡在翻转中途', b: '受力弯曲', def: 'a' },
  { id: 'stagger', name: '逐格崩碎', type: 'bool', def: true, desc: '从接触点向两侧逐格崩；关掉则同时崩' },
  { id: 'arrow',   name: '箭头阵',   type: 'bool', def: true, desc: '中间领头，两侧每列落后半格；关掉则一字排开' },
  { id: 'fan',     name: '扇形翻转', type: 'bool', def: true, desc: '中间正翻，两侧沿 45° 对角线向外翻' },
  { id: 'diag',    name: '斜向翻转', type: 'bool', def: true, desc: '斜着拨时整波沿 45° 对角线翻' },
  { id: 'preview', name: '落点预览', type: 'bool', def: true, desc: '按住时在出兵口显示这一波的位置和宽度' },
  { id: 'ripple',  name: '波纹带动', type: 'bool', def: true, desc: '前后格子跟着微翻、染上淡色' },
  { id: 'warn',    name: '来袭预警', type: 'bool', def: true, desc: '敌方来兵时，在我方最后一排对应的格子柔和亮起' },
  { id: 'terr',    name: '领地染色', type: 'bool', def: false, desc: '兵走过的格子染色，己方领地加速' },
  { g: '玩法' },
  { id: 'wallFollow', name: '盾墙跟手', type: 'bool', def: true, desc: '按住盾墙时，盾墙跟着手指左右移动' },
  { id: 'result',  name: '对撞结果', type: 'ab', a: '兵多剩余继续冲', b: '两波全灭', def: 'a' },
  { id: 'send',    name: '发兵方式', type: 'ab', a: '长按蓄兵', b: '一拨全发', def: 'a' },
  { id: 'accel',   name: '先慢后快', type: 'bool', def: true, desc: '起步慢，到己方半场一半达到最高速' },
  { id: 'plateau', name: '弹反之后', type: 'ab', a: '落地变台地', b: '掉头冲回去', def: 'a', desc: '台地：己方兵经过力量 +1，持续 6 秒' },
  { id: 'surge',   name: '满兵浪涌', type: 'bool', def: true, desc: '一次发出上限 3/4 以上的兵，带一道压弯大地的冲击波' },
];
const ITEMS = DEBUG.filter(d => d.id);
const DBG_KEY = 'pixel-legion-debug-v4', OLD_KEYS = ['pixel-legion-debug-v3', 'pixel-legion-debug-v2'];
const DBG = { val: {}, verdict: {} };
function loadDbg() {
  const read = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const s = read(DBG_KEY), olds = OLD_KEYS.map(read);
  for (const d of ITEMS) {
    const v = s && s.val ? s.val[d.id] : undefined;
    DBG.val[d.id] = v === undefined ? d.def : v;
    let vd = s && s.verdict && s.verdict[d.id];
    for (const o of olds) if (!vd && o && o.verdict && o.verdict[d.id]) vd = o.verdict[d.id];
    DBG.verdict[d.id] = vd || 'wait';
  }
}
function saveDbg() { try { localStorage.setItem(DBG_KEY, JSON.stringify(DBG)); } catch (e) {} }
const opt = id => DBG.val[id];
loadDbg();

/* ===== 战场尺寸（行数每局可变） ===== */
const COLS = CFG.COLS, MAXN = COLS * CFG.MAX_ROWS;
let ROWS = 22, N = COLS * ROWS, HALF = ROWS / 2, SPAWN = [ROWS - 1, 0], TARGET = [-1, ROWS];
function setRows(r) { ROWS = r; N = COLS * r; HALF = r / 2; SPAWN = [r - 1, 0]; TARGET = [-1, r]; }
setRows(opt('rows'));
const DIR = [-1, 1];
const HEX = { neutral: '#aeb4ab', unit: ['#2f6bff', '#ff7a1a'], soft: ['#9db6f2', '#f2c399'], plat: ['#5f86ee', '#f09a52'], dark: ['#1b3a96', '#8f3d07'], gold: '#ffd84a' };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const onBoard = r => r >= 0 && r < ROWS;
const now = () => performance.now();
const Q = Math.PI / 4;
const snapAngle = a => Math.round(a / Q) * Q; // 方形翻板只能沿 0° / 45° / 90° 翻，翻完才能落回格子

const stage = $('#stage'), cv = $('#board');
let G = null, uid = 0, wid = 0, last = 0, muted = false, firstGame = true, lastSetup = null;

/* ===== 声音 ===== */
let AC = null, NB = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
}
function noiseBuf() {
  if (!NB) { NB = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  return NB;
}
function nz(dur, vol, type, freq, q) {
  const at = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf(); f.type = type; f.frequency.value = freq; if (q) f.Q.value = q;
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(at); s.stop(at + dur + 0.02);
}
function tone(f0, f1, dur, type, vol) {
  const at = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), at + dur);
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(AC.destination); o.start(at); o.stop(at + dur + 0.02);
}
const lastS = {};
function sfx(k, arg) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  if (k !== 'crack' && lastS[k] && t - lastS[k] < 0.05) return;
  lastS[k] = t;
  try {
    switch (k) {
      case 'send':  tone(520, 760, 0.07, 'square', 0.05); break;
      case 'boom':  tone(150, 55, 0.18, 'sine', 0.24); nz(0.09, 0.25, 'lowpass', 900); break;
      case 'squeak': {
        const dur = Math.max(0.06, arg / 1000), o = AC.createOscillator(), lfo = AC.createOscillator(), lg = AC.createGain();
        const f = AC.createBiquadFilter(), g = AC.createGain();
        o.type = 'sawtooth'; o.frequency.value = 1150; lfo.frequency.value = 28; lg.gain.value = 140;
        lfo.connect(lg).connect(o.frequency);
        f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = 6;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.03);
        g.gain.setValueAtTime(0.05, t + Math.max(0.04, dur - 0.05)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(f).connect(g).connect(AC.destination);
        o.start(t); lfo.start(t); o.stop(t + dur + 0.02); lfo.stop(t + dur + 0.02);
        break;
      }
      case 'crack': nz(0.08, 0.2, 'highpass', 1400 + arg * 260); tone(380 + arg * 45, 200 + arg * 30, 0.06, 'square', 0.05); break;
      case 'base':  tone(95, 45, 0.24, 'sawtooth', 0.09); break;
      case 'wall':  tone(260, 360, 0.1, 'triangle', 0.07); break;
      case 'drop':  tone(300, 180, 0.08, 'triangle', 0.04); break;
      case 'stretch': tone(180, 260, 0.12, 'sine', 0.03); break;
      case 'parry': tone(520, 1400, 0.22, 'sine', 0.11); nz(0.06, 0.08, 'highpass', 2500); break;
      case 'surge': nz(0.5, 0.14, 'lowpass', 420); tone(80, 150, 0.35, 'triangle', 0.09); break;
      case 'deny':  tone(140, 140, 0.08, 'square', 0.04); break;
    }
  } catch (e) {}
}
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

/* ===== 对局状态 ===== */
function mkSide(s, hp) {
  return { s, hp, troops: CFG.TROOP_START, regen: 0, wallCd: 0, parryCd: 0, stats: { kills: 0, hits: 0, parries: 0, walls: 0 } };
}
const isHuman = s => G && (G.mode === 'duo' || s === 0);
const tmax = () => opt('tmax');
const regenMs = () => opt('regen') * 1000;
const holdMs = () => opt('hold') * 1000;
const gapMs = () => opt('gap') * 1000;
const surgeN = () => Math.ceil(tmax() * CFG.SURGE_FRAC);

function newGame(mode, diff) {
  setRows(opt('rows'));
  const hp = opt('hp');
  G = { mode, diff, time: 0, over: false, paused: false, frenzy: false, hpMax: hp,
    plat: new Array(N).fill(null), terr: new Int8Array(N).fill(-1),
    warn: [new Float32Array(COLS), new Float32Array(COLS)],
    waves: [], hitters: [], clashes: [], walls: [], snaps: [], surges: [], flyers: [], ptr: [null, null],
    ai: { t: 900, want: 0 }, sides: [mkSide(0, hp), mkSide(1, hp)] };
  lastSetup = { mode, diff };
  R.layout(); R.clearFx();
  buildBars(); hideOverlays();
  if (firstGame) showHint();
  firstGame = false;
  banner('开战');
}

/* ===== 单位与波：位置 pos = o + DIR * (wave.d - off) ===== */
const allUnits = () => { const a = []; for (const w of G.waves) for (const u of w.units) if (!u.dead) a.push(u); for (const h of G.hitters) a.push(h.u); return a; };
const liveUnits = w => w.units.filter(u => !u.dead);
const adv = u => (u.pos - SPAWN[u.side]) * DIR[u.side];
function setPos(w) { for (const u of w.units) u.pos = u.o + DIR[w.side] * (w.d - u.off); }
function killUnit(u, killer, n) {
  if (u.dead) return;
  u.dead = true;
  if (killer != null) G.sides[killer].stats.kills++;
  if (onBoard(Math.round(u.pos))) R.burst(u.c + 0.5, 0.3, u.pos + 0.5, HEX.unit[u.side], n || 10, 1);
}
function newWave(side) { return { id: ++wid, side, units: [], d: 0, run: 0, state: 'move', speedMul: 1, delay: 0 }; }

// 一波兵的排布：返回每个兵的列、落后量、翻转角
function formation(col, n, alpha) {
  const w = Math.min(CFG.MAX_W, n), rows = Math.ceil(n / CFG.MAX_W);
  const c0 = clamp(col - Math.floor((w - 1) / 2), 0, COLS - w), cc = c0 + (w - 1) / 2, even = w % 2 === 0;
  const out = [];
  for (let k = 0; k < n; k++) {
    const j = Math.floor(k / w), inRow = j === rows - 1 ? n - j * w : w, off = Math.floor((w - inRow) / 2);
    const c = c0 + off + (k - j * w), dx = c - cc, ad = Math.abs(dx);
    const lag = opt('arrow') ? CFG.ARROW_LAG * Math.max(0, ad - (even ? 0.5 : 0)) : 0;
    const fan = opt('fan') && ad > 0.75 ? Math.sign(dx) * Q : 0;
    out.push({ c, off: j + lag, alpha: snapAngle((alpha || 0) + fan) });
  }
  return { list: out, c0, w };
}

function sendWave(side, col, n, alpha) {
  const S = G.sides[side];
  n = Math.min(n, S.troops);
  if (n < CFG.MIN_WAVE) { sfx('deny'); if (isHuman(side)) banner('至少 3 个兵才能发射', side, true); return false; }
  const f = formation(col, n, alpha), sr = SPAWN[side];
  for (const u of allUnits()) if (u.c >= f.c0 && u.c < f.c0 + f.w && Math.abs(u.pos - sr) < 1) { sfx('deny'); if (isHuman(side)) banner('出兵口被堵住了', side, true); return false; }
  const wave = newWave(side);
  wave.delay = 170;
  for (const p of f.list) wave.units.push({ id: ++uid, side, c: p.c, o: sr, off: p.off, pos: 0, pw: 1, wave, dead: false, alpha: p.alpha, stuck: null, charged: false, parried: false });
  setPos(wave);
  R.launch(side, wave.units);
  S.troops -= n;
  G.waves.push(wave);
  sfx('send'); if (isHuman(side)) buzz(10);
  if (opt('surge') && n >= surgeN()) { G.surges.push({ side, pos: sr, hit: new Set(), delay: 170 }); sfx('surge'); banner('浪涌', side, true); }
  return true;
}

function interval(w) {
  const fast = opt('vmax') * 1000, slow = Math.max(fast, opt('vmin') * 1000);
  let iv = opt('accel') ? lerp(slow, fast, Math.min(1, w.run / (ROWS / 4))) : fast;
  if (opt('terr')) {
    const f = liveUnits(w).find(u => onBoard(Math.round(u.pos)));
    if (f) { const t = G.terr[Math.round(f.pos) * COLS + f.c]; if (t === w.side) iv /= CFG.OWN_TERR; else if (t !== -1) iv /= CFG.ENEMY_TERR; }
  }
  return iv / w.speedMul;
}

/* ===== 盾墙：弧形，中间靠前、两侧靠后 ===== */
const wallCols = wl => { const a = []; for (let c = Math.round(wl.cc) - 1; c <= Math.round(wl.cc) + 1; c++) if (c >= 0 && c < COLS) a.push(c); return a; };
const wallRow = (wl, c) => wl.row - DIR[wl.side] * CFG.WALL_ARC * Math.abs(c - wl.cc);

function moveWave(w, dt) {
  if (w.delay > 0) { w.delay -= dt; return; }
  const dir = DIR[w.side], us = liveUnits(w);
  let delta = dt / interval(w);
  const others = allUnits().filter(o => o.wave !== w && (o.side === w.side || o.wave.state !== 'move' || o.hitting));
  for (const u of us) {
    for (const o of others) {
      if (o.c !== u.c) continue;
      const gap = (o.pos - u.pos) * dir;
      if (gap > 0.01) delta = Math.min(delta, Math.max(0, gap - 1));
    }
    for (const wl of G.walls) {
      if (!wallCols(wl).includes(u.c)) continue;
      const gap = (wallRow(wl, u.c) - u.pos) * dir;
      if (wl.side === w.side) { if (gap > 0.01) delta = Math.min(delta, Math.max(0, gap - 1)); }
      else if (wl.pull > CFG.CATCH_PULL && gap > 0.01) delta = Math.min(delta, Math.max(0, gap - CFG.CATCH_GAP));
    }
  }
  w.d += delta; w.run += delta;
  setPos(w);
  for (const u of us) {
    if (u.dead) continue;
    if ((TARGET[w.side] - u.pos) * dir <= 1) { toHitter(u); continue; }
    const k = Math.round(u.pos);
    if (!onBoard(k)) continue;
    for (const wl of G.walls) {
      if (wl.side === w.side || !wallCols(wl).includes(u.c)) continue;
      const gap = (wallRow(wl, u.c) - u.pos) * dir;
      if (wl.pull > CFG.CATCH_PULL) { if (gap <= CFG.CATCH_GAP + 0.05 && !u.caught) { u.caught = wl; sfx('stretch'); } continue; }
      if (gap <= 0.8 && gap > -0.6) { killUnit(u, wl.side, 12); R.burst(u.c + 0.5, 0.5, wallRow(wl, u.c) + 0.5, '#d9dde4', 6, 1); sfx('crack', 0); break; }
    }
    if (u.dead) continue;
    const p = G.plat[k * COLS + u.c];
    if (p && p.side === u.side && !u.charged && Math.abs(u.pos - k) < 0.3) { u.pw += 1; u.charged = true; }
    if (opt('terr') && Math.abs(u.pos - k) < 0.3) G.terr[k * COLS + u.c] = u.side;
  }
  checkContact(w);
}

function checkContact(w) {
  if (w.state !== 'move' || w.delay > 0) return;
  const dir = DIR[w.side];
  for (const u of liveUnits(w)) for (const v of G.waves) {
    if (v.side === w.side || v.state !== 'move') continue;
    for (const e of v.units) {
      if (e.dead || e.c !== u.c) continue;
      const gap = (e.pos - u.pos) * dir;
      if (gap > -0.2 && gap <= 1) { startClash(w, v); return; }
    }
  }
}

/* ===== 打到基地：卡住 → 僵持 → 崩碎 ===== */
function toHitter(u) {
  u.wave.units = u.wave.units.filter(x => x !== u);
  const h = { u, t: 0 };
  u.hitting = true; u.stuck = h;
  G.hitters.push(h);
  sfx('boom'); sfx('squeak', holdMs());
}
function updateHitters(dt) {
  for (const h of G.hitters) {
    h.t += dt;
    if (h.t >= holdMs() && !h.done) {
      h.done = true;
      const u = h.u, foe = G.sides[1 - u.side];
      u.dead = true;
      foe.hp = Math.max(0, foe.hp - u.pw);
      G.sides[u.side].stats.hits += u.pw;
      R.burst(u.c + 0.5, 0.3, u.pos + 0.5, HEX.unit[u.side], 12, 1.2);
      R.burst(u.c + 0.5, 0.2, TARGET[u.side] + 0.5, HEX.unit[foe.s], 8, 1);
      R.shake(0.12); sfx('crack', 3); sfx('base'); if (isHuman(foe.s)) buzz(40);
    }
  }
  G.hitters = G.hitters.filter(h => !h.done);
}

/* ===== 对撞：卡住 → 僵持 → 逐格崩碎 ===== */
function startClash(a, b) {
  a.state = b.state = 'clash';
  const A0 = liveUnits(a), B0 = liveUnits(b), cols = [];
  for (const u of A0) for (const e of B0) if (e.c === u.c && Math.abs(e.pos - u.pos) <= 1.2) cols.push(u.c);
  const cc = cols.length ? cols.reduce((s, c) => s + c, 0) / cols.length : COLS / 2;
  const order = list => list.slice().sort((x, y) => (adv(y) - adv(x)) || (Math.abs(x.c - cc) - Math.abs(y.c - cc)));
  const A = order(A0), B = order(B0);
  const cl = { a, b, t: 0, i: 0, events: [], cc };
  const ma = A.length ? adv(A[0]) : 0, mb = B.length ? adv(B[0]) : 0;
  for (const u of A) if (adv(u) >= ma - 0.9) u.stuck = cl;
  for (const u of B) if (adv(u) >= mb - 0.9) u.stuck = cl;
  const pa = A.map(u => u.pw), pb = B.map(u => u.pw);
  let i = 0, j = 0;
  while (i < A.length && j < B.length) {
    const m = Math.min(pa[i], pb[j]);
    cl.events.push([[A[i], m], [B[j], m]]);
    pa[i] -= m; pb[j] -= m;
    if (pa[i] <= 0) i++;
    if (pb[j] <= 0) j++;
  }
  if (opt('result') === 'b') {
    const ra = A.slice(i), rb = B.slice(j);
    for (let k = 0; k < Math.max(ra.length, rb.length); k++) { const ev = []; if (ra[k]) ev.push([ra[k], 99]); if (rb[k]) ev.push([rb[k], 99]); cl.events.push(ev); }
  }
  cl.gap = opt('stagger') ? Math.min(gapMs(), CFG.STAGGER_MAX / Math.max(1, cl.events.length - 1)) : 0;
  cl.z = A[0] && B[0] ? (A[0].pos + B[0].pos) / 2 + 0.5 : HALF;
  G.clashes.push(cl);
  sfx('boom'); sfx('squeak', holdMs());
  R.shake(0.08); buzz(20);
  R.burst(cc + 0.5, 0.5, cl.z, '#ffffff', 10, 0.8);
}
function updateClash(cl, dt) {
  cl.t += dt;
  const H = holdMs();
  if (cl.t < H) { if (Math.random() < 0.5) R.burst(cl.cc + 0.5 + (Math.random() - 0.5) * 3, 0.45, cl.z, HEX.gold, 1, 0.5); return; }
  const tt = cl.t - H;
  while (cl.i < cl.events.length && tt >= cl.i * cl.gap) {
    const k = cl.i++;
    for (const [u, m] of cl.events[k]) {
      if (u.dead) continue;
      u.pw -= m;
      if (u.pw <= 0) { killUnit(u, 1 - u.side, 12); R.burst(u.c + 0.5, 0.4, u.pos + 0.5, HEX.gold, 4, 1); }
    }
    sfx('crack', Math.min(k, 9));
  }
  if (cl.i >= cl.events.length && tt >= Math.max(0, cl.events.length - 1) * cl.gap + 160) {
    G.clashes.splice(G.clashes.indexOf(cl), 1);
    for (const w of [cl.a, cl.b]) {
      w.units = liveUnits(w);
      for (const u of w.units) if (u.stuck === cl) u.stuck = null;
      w.state = 'move'; w.run = 0;
    }
    checkContact(cl.a); checkContact(cl.b);
  }
}

/* ===== 盾墙（按住保持）与橡皮筋弹反 ===== */
function raiseWall(s, row, col) {
  const S = G.sides[s];
  if (S.wallCd > 0) { sfx('deny'); return null; }
  if (S.troops < CFG.WALL_COST) { sfx('deny'); if (isHuman(s)) banner(`需要 ${CFG.WALL_COST} 个兵`, s, true); return null; }
  const lo = s === 0 ? Math.ceil(HALF) : 1, hi = s === 0 ? ROWS - 2 : Math.floor(HALF) - 1;
  const wl = { side: s, row: clamp(row, lo, hi), cc: clamp(col, 1, COLS - 2), born: G.time, until: G.time + opt('wallMax') * 1000, pull: 0 };
  G.walls.push(wl);
  S.troops -= CFG.WALL_COST; S.stats.walls++;
  sfx('wall'); if (isHuman(s)) buzz(12);
  for (const w of G.waves) {
    if (w.side === s) continue;
    for (const u of liveUnits(w)) if (wallCols(wl).includes(u.c) && Math.abs(u.pos - wallRow(wl, u.c)) < 0.8) { killUnit(u, s, 12); sfx('crack', 0); }
  }
  return wl;
}
function dropWall(wl) {
  const i = G.walls.indexOf(wl); if (i < 0) return;
  G.walls.splice(i, 1);
  G.sides[wl.side].wallCd = CFG.WALL_CD;
  for (const w of G.waves) {
    if (w.side === wl.side) continue;
    for (const u of liveUnits(w)) if (u.caught === wl) { killUnit(u, wl.side, 12); sfx('crack', 0); }
  }
  const p = G.ptr[wl.side]; if (p && p.wall === wl) { p.wall = null; p.mode = 'done'; }
  sfx('drop');
}
function flick(wl) {
  const S = G.sides[wl.side];
  if (S.parryCd > 0 || S.troops < CFG.PARRY_COST) { sfx('deny'); return false; }
  S.troops -= CFG.PARRY_COST; S.parryCd = CFG.PARRY_CD;
  G.snaps.push({ side: wl.side, row: wl.row, cc: wl.cc, pull: Math.max(0.6, wl.pull), t: 0 });
  sfx('parry');
  const cols = wallCols(wl); let n = 0;
  for (const w of G.waves.slice()) {
    if (w.side === wl.side) continue;
    for (const u of liveUnits(w)) {
      if (!cols.includes(u.c)) continue;
      const gap = (wallRow(wl, u.c) - u.pos) * DIR[u.side];
      if (gap <= 1.4 && gap > -0.6) { parryUnit(u, wl); n++; }
    }
  }
  if (n) { S.stats.parries++; if (isHuman(wl.side)) buzz(30); }
  return true;
}
function parryUnit(u, wl) {
  if (u.dead || u.side === wl.side) return;
  const S = G.sides[wl.side], old = u.wave;
  old.units = old.units.filter(x => x !== u);
  R.burst(u.c + 0.5, 0.5, u.pos + 0.5, HEX.gold, 8, 1);
  if (opt('plateau') === 'a') {
    u.dead = true; S.stats.kills++;
    const k = clamp(Math.round(u.pos), 0, ROWS - 1);
    G.plat[k * COLS + u.c] = { side: wl.side, until: G.time + CFG.PLATEAU_TIME };
  } else {
    u.side = wl.side; u.parried = true; u.stuck = null; u.charged = false;
    if (!wl.wave || !G.waves.includes(wl.wave)) { wl.wave = newWave(wl.side); wl.wave.speedMul = CFG.PARRY_SPEED; wl.wave.run = 99; G.waves.push(wl.wave); }
    const nw = wl.wave;
    u.wave = nw; u.o = u.pos; u.off = nw.d; u.alpha = 0;
    nw.units.push(u);
    checkContact(nw);
  }
  if (old.state === 'move') checkContact(old);
}
function updateWalls(dt) {
  for (const wl of G.walls.slice()) {
    if (G.time >= wl.until) { dropWall(wl); continue; }
    if (wl.ai) {
      const near = G.waves.some(w => w.side !== wl.side && liveUnits(w).some(u => wallCols(wl).includes(u.c) && (wallRow(wl, u.c) - u.pos) * DIR[u.side] <= 1.2));
      const caught = G.waves.some(w => w.side !== wl.side && liveUnits(w).some(u => u.caught === wl));
      if (wl.aiParry && (caught || near) && G.time - wl.born > 250) { wl.pull = 0.8; flick(wl); dropWall(wl); }
    }
  }
  for (const sn of G.snaps) sn.t += dt;
  G.snaps = G.snaps.filter(s => s.t < 260);
}

/* ===== 浪涌 ===== */
function updateSurges(dt) {
  for (const sg of G.surges) {
    if (sg.delay > 0) { sg.delay -= dt; continue; }
    sg.pos += DIR[sg.side] * dt / CFG.SURGE_STEP;
    for (const w of G.waves) {
      if (w.side === sg.side) continue;
      for (const u of w.units) {
        if (u.dead || sg.hit.has(u.id) || !onBoard(Math.round(u.pos))) continue;
        if ((sg.pos - u.pos) * DIR[sg.side] >= 0) {
          sg.hit.add(u.id); u.pw -= 1; R.burst(u.c + 0.5, 0.4, u.pos + 0.5, HEX.unit[sg.side], 3, 0.8);
          if (u.pw <= 0) killUnit(u, sg.side);
        }
      }
    }
    if ((sg.pos - TARGET[sg.side]) * DIR[sg.side] > 7) sg.dead = true;
  }
  G.surges = G.surges.filter(s => !s.dead);
}

/* ===== 预警：柔和亮起、柔和熄灭 ===== */
function updateWarn(dt) {
  const tgt = [new Float32Array(COLS), new Float32Array(COLS)];
  if (opt('warn')) for (const w of G.waves) {
    if (w.speedMul > 1) continue;
    const def = 1 - w.side;
    for (const u of liveUnits(w)) tgt[def][u.c] = 1;
  }
  const k = dt / CFG.WARN_FADE;
  for (let s = 0; s < 2; s++) for (let c = 0; c < COLS; c++) {
    const v = G.warn[s][c], t = tgt[s][c];
    G.warn[s][c] = t > v ? Math.min(t, v + k) : Math.max(t, v - k);
  }
}

/* ===== 电脑对手 ===== */
function aiThink() {
  const L = AI_LV[G.diff], S = G.sides[1];
  const foes = G.waves.filter(w => w.side === 0 && w.delay <= 0 && liveUnits(w).some(u => onBoard(Math.round(u.pos))));
  let threat = null, best = 99;
  for (const w of foes) {
    if (w.state !== 'move') continue;
    const f = Math.min(...liveUnits(w).map(u => u.pos));
    if (f >= 1.5 && f <= ROWS * 0.4 && f < best) { best = f; threat = w; }
  }
  if (threat && !G.walls.some(wl => wl.side === 1) && Math.random() < L.react) {
    const us = liveUnits(threat), cc = Math.round(us.reduce((s, u) => s + u.c, 0) / us.length);
    const wl = raiseWall(1, Math.round(best) - 1, cc);
    if (wl) { wl.ai = true; wl.until = G.time + 1000 + Math.random() * 1200; wl.aiParry = Math.random() < L.parry; if (wl.aiParry) wl.pull = 0.6; return; }
  }
  if (!G.ai.want) G.ai.want = L.min + Math.floor(Math.random() * (L.max - L.min + 1));
  const want = Math.min(G.ai.want, tmax());
  if (S.troops < want) return;
  let col = Math.floor(Math.random() * COLS);
  const centers = foes.map(w => { const us = liveUnits(w); return { c: us.reduce((s, u) => s + u.c, 0) / us.length, n: us.length }; });
  if (L.intercept) { const tgt = centers.find(x => x.n < S.troops); if (tgt) col = Math.round(tgt.c); }
  else if (centers.length && G.diff === 'normal') {
    let bestD = -1;
    for (let k = 0; k < 3; k++) { const c = Math.floor(Math.random() * COLS); const d = Math.min(...centers.map(x => Math.abs(x.c - c))); if (d > bestD) { bestD = d; col = c; } }
  }
  if (sendWave(1, col, L.intercept ? S.troops : want, 0)) G.ai.want = 0;
}

/* ===== 主循环 ===== */
function update(dt) {
  G.time += dt;
  const fr = G.time >= CFG.FRENZY_AT ? 2 : 1;
  if (fr === 2 && !G.frenzy) { G.frenzy = true; banner('狂热阶段'); }
  for (const S of G.sides) {
    if (S.troops > tmax()) S.troops = tmax();
    if (S.troops < tmax()) {
      S.regen += dt * fr * (S.hp <= G.hpMax * CFG.LOW_HP_FRAC ? CFG.LOW_HP_REGEN : 1);
      if (S.regen >= regenMs()) { S.regen -= regenMs(); S.troops++; }
    } else S.regen = 0;
    if (!G.walls.some(w => w.side === S.s)) S.wallCd = Math.max(0, S.wallCd - dt * fr);
    S.parryCd = Math.max(0, S.parryCd - dt * fr);
  }
  for (let k = 0; k < N; k++) if (G.plat[k] && G.plat[k].until <= G.time) G.plat[k] = null;
  updateWalls(dt);
  for (const w of G.waves.slice()) if (w.state === 'move') moveWave(w, dt);
  updateHitters(dt);
  for (const cl of G.clashes.slice()) updateClash(cl, dt);
  updateSurges(dt);
  G.waves = G.waves.filter(w => { if (w.state === 'move') w.units = liveUnits(w); return w.units.length > 0 || w.state === 'clash'; });
  updateWarn(dt);
  if (G.mode === 'ai') { G.ai.t -= dt; if (G.ai.t <= 0) { G.ai.t = AI_LV[G.diff].think * (0.7 + Math.random() * 0.6); aiThink(); } }
  checkEnd();
}
function checkEnd() {
  const [A, B] = G.sides;
  let w;
  if (A.hp <= 0 || B.hp <= 0) w = A.hp <= 0 && B.hp <= 0 ? -1 : A.hp <= 0 ? 1 : 0;
  else if (G.time >= CFG.MATCH) w = A.hp === B.hp ? -1 : A.hp > B.hp ? 0 : 1;
  else return;
  endGame(w);
}

    const sdt = dt / 1000;
    for (const f of frags) {
      f.vy -= 22 * sdt; f.x += f.vx * sdt; f.y += f.vy * sdt; f.z += f.vz * sdt; f.rx += sdt * 8; f.ry += sdt * 6;
      if (f.y < 0.08) { f.y = 0.08; f.vy *= -0.35; f.vx *= 0.6; f.vz *= 0.6; }
      f.life -= sdt / 1.1;
      const sc = f.s * Math.min(1, f.life * 2.5);
      q.setFromEuler(eu.set(f.rx, f.ry, 0)); pv.set(f.x, f.y, f.z); sv.set(sc, sc, sc); m4.compose(pv, q, sv);
      fragMesh.setMatrixAt(ri, m4); fragMesh.setColorAt(ri, f.c); ri++;
    }
    for (let i = frags.length - 1; i >= 0; i--) if (frags[i].life <= 0) frags.splice(i, 1);
    fragMesh.count = ri; fragMesh.instanceMatrix.needsUpdate = true; if (ri) fragMesh.instanceColor.needsUpdate = true;

    // 盾墙（弧形）+ 橡皮筋
    let si = 0, gwi = 0, bdi = 0;
    const glass = opt('shield') === 'a';
    const drawBand = (side, row, cc, pull, alphaK, gold) => {
      const SEG = 14;
      for (let k = 0; k < SEG && bdi < 200; k++) {
        const x0 = cc - 1.5 + 3 * k / SEG + 0.5, x1 = cc - 1.5 + 3 * (k + 1) / SEG + 0.5;
        const z0 = arcZ(side, row, cc, x0 - 0.5, pull), z1 = arcZ(side, row, cc, x1 - 0.5, pull);
        const len = Math.hypot(x1 - x0, z1 - z0);
        pv.set((x0 + x1) / 2, 0.92, (z0 + z1) / 2); q.setFromEuler(eu.set(0, -Math.atan2(z1 - z0, x1 - x0), 0)); sv.set(len + 0.02, 0.1, 0.1);
        m4.compose(pv, q, sv); beads.setMatrixAt(bdi, m4);
        tc.copy(gold ? col.gold : col.unit[side]).lerp(col.white, 0.35 * alphaK); beads.setColorAt(bdi, tc); bdi++;
      }
    };
    if (G) {
      for (const wl of G.walls) {
        const rise = clamp((G.time - wl.born) / 80, 0, 1);
        for (const c of wallCols(wl)) {
          const z = wallRow(wl, c) + 0.5;
          q.identity();
          if (glass) {
            pv.set(c + 0.5, 0.45 * rise, z); sv.set(1.0, 0.9 * rise + 0.001, 0.22); m4.compose(pv, q, sv);
            glassWall.setMatrixAt(gwi, m4); glassWall.setColorAt(gwi, tc.copy(col.unit[wl.side]).lerp(col.white, 0.3)); gwi++;
          } else {
            const hh = 0.75 * rise + 0.001;
            pv.set(c + 0.5, hh / 2, z); sv.set(0.96, hh, 0.34); m4.compose(pv, q, sv);
            solidWall.setMatrixAt(si, m4); solidWall.setColorAt(si, col.dark[wl.side]); si++;
          }
        }
        drawBand(wl.side, wl.row, wl.cc, wl.pull, 1, !glass);
      }
      for (const sn of G.snaps) {
        const k = sn.t / 260, pull = sn.pull * (1 - k * 2.2) * (k < 0.45 ? 1 : Math.max(0, 1 - (k - 0.45) * 2));
        drawBand(sn.side, sn.row, sn.cc, k < 0.45 ? sn.pull * (1 - k / 0.45 * 1.8) : -0.8 * sn.pull * Math.max(0, 1 - (k - 0.45) / 0.55), 1, true);
        void pull;
      }
    }
    solidWall.count = si; solidWall.instanceMatrix.needsUpdate = true; if (si) solidWall.instanceColor.needsUpdate = true;
    glassWall.count = gwi; glassWall.instanceMatrix.needsUpdate = true; if (gwi) glassWall.instanceColor.needsUpdate = true;
    beads.count = bdi; beads.instanceMatrix.needsUpdate = true; if (bdi) beads.instanceColor.needsUpdate = true;

    // 浪涌气浪
    bands.forEach(b => b.visible = false);
    if (G) G.surges.slice(0, 4).forEach((sg, k) => {
      if (sg.delay > 0 || !onBoard(Math.round(sg.pos))) return;
      const b = bands[k]; b.visible = true; b.material.color.set(HEX.unit[sg.side]);
      b.position.set(COLS / 2, 0.45, sg.pos + 0.5); b.material.opacity = 0.28 + 0.08 * Math.sin(t / 50);
    });

    if (shake > 0) shake = Math.max(0, shake - dt / 1000 * 0.6);
    const s0 = cam.position.clone();
    if (shake > 0) cam.position.x += (Math.random() - 0.5) * shake, cam.position.z += (Math.random() - 0.5) * shake;
    renderer.render(scene, cam);
    cam.position.copy(s0);
  }
  function clearFx() { frags.length = 0; bk[0].length = 0; bk[1].length = 0; }
  return { fit, layout, render, pick, burst, launch, clearFx, shake: v => { shake = Math.max(shake, v); } };
})();

function banner(text, side, small) {
  const el = document.createElement('div'), duo = G && G.mode === 'duo';
  el.className = 'banner' + (duo && side === 1 ? ' s1' : duo && side === 0 ? ' s0' : '');
  if (small) el.style.fontSize = '18px';
  el.textContent = text; stage.appendChild(el);
  setTimeout(() => el.remove(), 1600);
}
function showHint() {
  const el = document.createElement('div');
  el.className = 'hint';
  el.innerHTML = '<div><b>按住</b>兵营里的兵被吸过来，左右移动瞄准，<b>往上拨</b>从松手的那一列发射</div><div><b>往下拉住</b>：举起盾墙，松手放下（耗 2 兵）</div><div><b>拉住后往上一弹</b>：橡皮筋弹反（再耗 1 兵）</div><div><b>斜着拨</b>：整波沿对角线翻滚</div>';
  stage.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; }, 7500);
  setTimeout(() => el.remove(), 8200);
}

/* ===== 两侧功能条 ===== */
const barEls = [];
function buildBars() {
  const duo = G.mode === 'duo', hp = G.hpMax, blocks = '<span></span>'.repeat(hp);
  $('#lbar').innerHTML = `<div class="hpcol s1"><b class="hpn">${hp}</b><div class="blocks">${blocks}</div></div><div class="hpcol s0"><div class="blocks">${blocks}</div><b class="hpn">${hp}</b></div>`;
  const cd = s => `<div class="cds s${s} ${duo && s === 1 ? 'flip' : ''}"><div class="cd" data-k="wall"><i></i><span>墙</span></div><div class="cd" data-k="parry"><i></i><span>弹</span></div></div>`;
  $('#rbar').innerHTML = `${cd(1)}<div class="mid"><span class="clock">3:00</span><button class="pbtn" id="pbtn" aria-label="暂停">II</button></div>${cd(0)}`;
  $('#pbtn').addEventListener('click', pauseGame);
  for (let s = 0; s < 2; s++) {
    const colEl = $(`#lbar .hpcol.s${s}`), c = $(`#rbar .cds.s${s}`);
    barEls[s] = { n: colEl.querySelector('.hpn'), blocks: [...colEl.querySelectorAll('.blocks span')], shown: hp, wall: c.querySelector('[data-k=wall]'), parry: c.querySelector('[data-k=parry]') };
  }
}
function updateBars() {
  if (!G || !barEls[0]) return;
  const left = Math.max(0, CFG.MATCH - G.time), m = Math.floor(left / 60000), sec = Math.floor(left / 1000) % 60;
  const clock = $('#rbar .clock');
  clock.textContent = `${m}:${String(sec).padStart(2, '0')}`; clock.classList.toggle('hot', G.frenzy);
  for (let s = 0; s < 2; s++) {
    const S = G.sides[s], b = barEls[s];
    b.n.textContent = S.hp;
    if (S.hp !== b.shown) { b.blocks.forEach((e, i) => e.classList.toggle('gone', i >= S.hp)); b.shown = S.hp; }
    const up = G.walls.some(w => w.side === s);
    b.wall.querySelector('i').style.height = (up ? 100 : (1 - S.wallCd / CFG.WALL_CD) * 100) + '%';
    b.parry.querySelector('i').style.height = ((1 - S.parryCd / CFG.PARRY_CD) * 100) + '%';
    b.wall.classList.toggle('ready', (S.wallCd <= 0 && S.troops >= CFG.WALL_COST) || up);
    b.parry.classList.toggle('ready', S.parryCd <= 0 && S.troops >= CFG.PARRY_COST);
  }
}

/* ===== 手势：每方同一时间只认一个手指 =====
   按住 = 蓄兵（左右移动瞄准）→ 上拨从松手那列发兵
   往下拉 = 立刻举盾墙（按住保持，可跟手）→ 往上快速一弹 = 橡皮筋弹反；松手放下 */
const pidSide = new Map();
const TH = 16;
const fwd = (side, dy) => side === 0 ? -dy : dy;
function holdCount(side, p) {
  const T = G.sides[side].troops;
  return opt('send') === 'a' ? Math.min(T, CFG.MIN_WAVE + Math.floor((now() - p.t0) / CFG.HOLD_STEP)) : T;
}
cv.addEventListener('pointerdown', e => {
  audio();
  if (!G || G.over || G.paused) return;
  const cell = R.pick(e.clientX, e.clientY); if (!cell) return;
  const side = G.mode === 'duo' ? (cell.z < HALF ? 1 : 0) : 0;
  if (G.ptr[side]) return;
  G.ptr[side] = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, t0: now(),
    c: clamp(cell.c, 0, COLS - 1), r: clamp(cell.r, 0, ROWS - 1), minF: 0, minT: now(), n: 0, mode: 'hold', wall: null };
  pidSide.set(e.pointerId, side);
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  const side = pidSide.get(e.pointerId); if (side == null || !G) return;
  const p = G.ptr[side]; if (!p || p.id !== e.pointerId) return;
  p.x = e.clientX; p.y = e.clientY;
  const cell = R.pick(e.clientX, e.clientY);
  if (cell && p.mode === 'hold') p.c = clamp(cell.c, 0, COLS - 1);
  const f = fwd(side, e.clientY - p.y0);
  if (f < p.minF) { p.minF = f; p.minT = now(); }
  if (p.mode === 'hold' && p.minF <= -TH) {
    p.mode = 'guard';
    p.wall = raiseWall(side, p.r, p.c);
    if (!p.wall) p.mode = 'done';
  }
  if (p.mode === 'guard' && p.wall) {
    const prev = p.wall.pull;
    p.wall.pull = clamp((-f - TH) / CFG.PULL_PX, 0, 1);
    if (p.wall.pull - prev > 0.2) sfx('stretch');
    if (opt('wallFollow') && cell) p.wall.cc = clamp(cell.c, 1, COLS - 2);
    // 往回弹的过程中，最低点之后的上移时间从最低点算
    if (f > p.minF + 4 && !p.upT) p.upT = now();
    if (f <= p.minF + 2) p.upT = 0;
  }
});
function endPtr(e, cancel) {
  const side = pidSide.get(e.pointerId); pidSide.delete(e.pointerId);
  if (side == null || !G) return;
  const p = G.ptr[side]; if (!p || p.id !== e.pointerId) return;
  G.ptr[side] = null;
  if (p.mode === 'guard' && p.wall) {
    const f = fwd(side, e.clientY - p.y0);
    const quick = now() - p.minT <= CFG.FLICK_MS;
    if (!cancel && !G.over && !G.paused && f - p.minF >= TH && quick) flick(p.wall);
    dropWall(p.wall);
    return;
  }
  if (cancel || G.over || G.paused || p.mode !== 'hold') return;
  const dx = e.clientX - p.x0, dy = e.clientY - p.y0, f = fwd(side, dy);
  if (f >= TH) {
    let alpha = 0;
    if (opt('diag')) { const a = side === 0 ? Math.atan2(dx, -dy) : Math.atan2(dx, dy); if (Math.abs(a) > Math.PI / 8) alpha = Math.sign(a) * Q; }
    const cell = R.pick(e.clientX, e.clientY);
    const col = cell ? clamp(cell.c, 0, COLS - 1) : p.c;
    sendWave(side, col, holdCount(side, p), alpha);
  }
}
cv.addEventListener('pointerup', e => endPtr(e, false));
cv.addEventListener('pointercancel', e => endPtr(e, true));
function updateHoldBubbles() {
  for (let s = 0; s < 2; s++) {
    const el = $('#hold' + s), p = G && G.ptr[s];
    if (!p || p.mode !== 'hold') { el.hidden = true; continue; }
    p.n = holdCount(s, p);
    const b = stage.getBoundingClientRect(), ok = p.n >= CFG.MIN_WAVE;
    el.hidden = false; el.textContent = ok ? p.n : CFG.MIN_WAVE;
    el.classList.toggle('low', !ok);
    const flip = s === 1 && G.mode === 'duo';
    el.style.left = (p.x - b.left) + 'px'; el.style.top = (p.y - b.top + (flip ? 70 : -40)) + 'px';
    el.style.transform = flip ? 'translate(-50%,0) rotate(180deg)' : 'translate(-50%,-100%)';
  }
}

/* ===== 调试栏 ===== */
const dbgEl = $('#dbg');
const fmtNum = (d, v) => (d.step < 1 ? (+v).toFixed(d.step < 0.1 ? 2 : 1) : String(v)) + d.unit;
function renderDbg() {
  $('#dbgList').innerHTML = DEBUG.map(d => {
    if (d.g) return `<div class="grp-t">${d.g}</div>`;
    const v = DBG.val[d.id], vd = DBG.verdict[d.id];
    const right = d.type === 'bool' ? `<button class="sw" data-id="${d.id}" aria-pressed="${v ? 'true' : 'false'}" aria-label="${d.name}"></button>`
      : d.type === 'num' ? `<span class="it-val" id="val-${d.id}">${fmtNum(d, v)}</span>` : '';
    const body = d.type === 'ab'
      ? `<div class="seg"><button data-id="${d.id}" data-v="a" aria-pressed="${v === 'a'}">${d.a}</button><button data-id="${d.id}" data-v="b" aria-pressed="${v === 'b'}">${d.b}</button></div>`
      : d.type === 'num' ? `<input type="range" id="rng-${d.id}" data-id="${d.id}" min="${d.min}" max="${d.max}" step="${d.step}" value="${v}" aria-label="${d.name}">` : '';
    return `<div class="it v-${vd}">
      <div class="it-top"><span class="it-name">${d.name}</span>${right}</div>
      ${d.desc ? `<div class="it-desc">${d.desc}</div>` : ''}${body}
      <div class="vd">
        <button class="yes ${vd === 'yes' ? 'on' : ''}" data-id="${d.id}" data-vd="yes">采纳</button>
        <button class="no ${vd === 'no' ? 'on' : ''}" data-id="${d.id}" data-vd="no">不采纳</button>
        <button class="wait ${vd === 'wait' ? 'on' : ''}" data-id="${d.id}" data-vd="wait">待定</button>
      </div></div>`;
  }).join('');
}
$('#dbgList').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !b.dataset.id) return;
  const id = b.dataset.id;
  if (b.classList.contains('sw')) DBG.val[id] = !DBG.val[id];
  else if (b.dataset.v) DBG.val[id] = b.dataset.v;
  else if (b.dataset.vd) DBG.verdict[id] = b.dataset.vd;
  saveDbg(); renderDbg();
});
$('#dbgList').addEventListener('input', e => {
  const el = e.target; if (el.type !== 'range') return;
  const d = ITEMS.find(x => x.id === el.dataset.id);
  DBG.val[d.id] = +el.value; $('#val-' + d.id).textContent = fmtNum(d, el.value);
  saveDbg();
});
function dbgSummary() {
  const n = new Date(), day = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`;
  const tag = { yes: '采纳', no: '不采纳', wait: '待定' };
  let out = `像素小兵 v4 调试结论（${day}）`;
  for (const d of DEBUG) {
    if (d.g) { out += `\n【${d.g}】`; continue; }
    const v = DBG.val[d.id];
    const cur = d.type === 'bool' ? (v ? '开' : '关') : d.type === 'num' ? fmtNum(d, v) : (v === 'a' ? d.a : d.b);
    out += `\n- ${d.name}：${cur}（${tag[DBG.verdict[d.id]]}）`;
  }
  return out;
}
function flashMsg(t) { const m = $('#dbgMsg'); m.textContent = t; clearTimeout(flashMsg.t); flashMsg.t = setTimeout(() => m.textContent = '', 2600); }
$('#dbgCopy').addEventListener('click', () => {
  const text = dbgSummary();
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove(); flashMsg(ok ? '已复制，发给 Claude 即可' : '复制失败，请截图发给 Claude');
  };
  try { navigator.clipboard.writeText(text).then(() => flashMsg('已复制，发给 Claude 即可'), fallback); } catch (e) { fallback(); }
});
$('#dbgReset').addEventListener('click', () => { for (const d of ITEMS) DBG.val[d.id] = d.def; saveDbg(); renderDbg(); flashMsg('开关和数值已恢复默认，结论标记保留'); });
function setMini(m) { dbgEl.classList.toggle('mini', m); try { localStorage.setItem('pixel-legion-dbg-mini', m ? '1' : '0'); } catch (e) {} setTimeout(() => R.fit(), 0); }
$('#dbgClose').addEventListener('click', () => setMini(true));
$('#dbgOpen').addEventListener('click', () => setMini(false));
(() => { let m = null; try { m = localStorage.getItem('pixel-legion-dbg-mini'); } catch (e) {} dbgEl.classList.toggle('mini', m === null ? window.innerWidth < 700 : m === '1'); })();
renderDbg();

/* ===== 界面流程 ===== */
function hideOverlays() { ['#menu', '#pause', '#end'].forEach(s => $(s).hidden = true); }
function showMenu() { G = null; hideOverlays(); $('#menu').hidden = false; $('#lbar').innerHTML = ''; $('#rbar').innerHTML = ''; barEls.length = 0; R.clearFx(); }
function pauseGame() { if (!G || G.over) return; G.paused = true; $('#pause').hidden = false; }
$('#resume').addEventListener('click', () => { if (G) G.paused = false; $('#pause').hidden = true; last = 0; });
$('#restart').addEventListener('click', () => { if (lastSetup) newGame(lastSetup.mode, lastSetup.diff); });
$('#toMenu').addEventListener('click', showMenu);
$('#mute').addEventListener('click', e => { muted = !muted; e.target.textContent = '声音：' + (muted ? '关' : '开'); });
document.querySelectorAll('#menu [data-mode]').forEach(b => b.addEventListener('click', () => { audio(); newGame(b.dataset.mode, b.dataset.diff || 'normal'); }));
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

function endGame(w) {
  G.over = true; G.ptr = [null, null];
  const [A, B] = G.sides;
  const title = G.mode === 'ai' ? (w === 0 ? '胜利' : w === 1 ? '惜败' : '平局') : (w === 0 ? '蓝方获胜' : w === 1 ? '橙方获胜' : '平局');
  const n = v => `<span class="n">${v}</span>`, ov = $('#end');
  ov.innerHTML = `<div class="panel">
    <h2>${title}</h2>
    <div class="statgrid">
      <span class="h"></span><span class="h">${G.mode === 'ai' ? '你' : '蓝方'}</span><span class="h">${G.mode === 'ai' ? '电脑' : '橙方'}</span>
      <span class="h">基地剩余</span>${n(A.hp)}${n(B.hp)}
      <span class="h">击碎敌兵</span>${n(A.stats.kills)}${n(B.stats.kills)}
      <span class="h">打进基地</span>${n(A.stats.hits)}${n(B.stats.hits)}
      <span class="h">弹反成功</span>${n(A.stats.parries)}${n(B.stats.parries)}
      <span class="h">举起盾墙</span>${n(A.stats.walls)}${n(B.stats.walls)}
    </div>
    <div class="btns"><button class="btn main" id="again">再来一局</button><button class="btn" id="endMenu">回到菜单</button></div></div>`;
  ov.hidden = false;
  ov.querySelector('#again').addEventListener('click', () => newGame(lastSetup.mode, lastSetup.diff));
  ov.querySelector('#endMenu').addEventListener('click', showMenu);
}

function frame(ts) {
  const dt = last ? Math.min(50, ts - last) : 16; last = ts;
  const run = G && !G.over && !G.paused;
  if (run) update(dt);
  R.render(run ? dt : 0);
  updateBars(); updateHoldBubbles();
  requestAnimationFrame(frame);
}
window.__pl = { get G() { return G; }, newGame, sendWave, raiseWall, dropWall, flick, update, render: d => R.render(d), DBG, opt, CFG, formation, get ROWS() { return ROWS; } };
R.layout();
requestAnimationFrame(frame);
})();
</script>
