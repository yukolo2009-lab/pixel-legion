<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1217">
<title>像素小兵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* 布局：左侧调试栏（宽屏固定 / 手机抽屉）+ 游戏区（左血量条 / 3D 翻板棋盘 / 右冷却条）；单一暗色外观 */
:root{
  --frame:#0f1217; --panel:#161a21; --raise:#1e242d; --line:#2a313c; --ink:#e9ece4; --muted:#8b94a1;
  --blue:#2f6bff; --orange:#ff7a1a; --gold:#ffd84a; --ok:#3fbf7f; --no:#e5534b;
  --f-pix:"Silkscreen", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-cn:"ZCOOL QingKe HuangYou","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-body:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--frame);color:var(--ink);font-family:var(--f-body);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#shell{height:100%;display:flex}
#main{flex:1;min-width:0;position:relative;display:flex;justify-content:center}
#app{height:100%;width:100%;max-width:580px;display:flex;gap:6px;padding:8px 16px;box-sizing:border-box}
#stage{flex:1;position:relative;min-width:0}
#board{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- 两侧功能条 ---------- */
#lbar,#rbar{width:34px;flex:none;display:flex;flex-direction:column;gap:8px;padding-block:6px}
.hpcol{--side:var(--blue);flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.hpcol.s1{--side:var(--orange)}
.hpn{font:700 15px var(--f-pix);color:var(--side);font-variant-numeric:tabular-nums}
.blocks{flex:1;min-height:0;width:16px;display:flex;flex-direction:column;gap:2px}
.hpcol.s0 .blocks{flex-direction:column-reverse}
.blocks span{flex:1;min-height:1px;background:var(--side)}
.blocks span.gone{animation:gone .45s forwards}
@keyframes gone{0%{background:#fff;transform:scale(1.5,1.2)}100%{transform:scale(0);opacity:0}}
.cds{--side:var(--blue);display:flex;flex-direction:column;gap:6px;align-items:center}
.cds.s1{--side:var(--orange)}
.flip{transform:rotate(180deg)}
.cd{width:32px;height:32px;position:relative;background:var(--raise);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;box-sizing:border-box}
.cd i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--side);opacity:.35}
.cd span{position:relative;font-size:12px;color:var(--muted)}
.cd.ready{border-color:var(--side)}
.cd.ready span{color:var(--ink)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.clock{font:700 11px var(--f-pix);font-variant-numeric:tabular-nums;color:var(--ink)}
.clock.hot{color:var(--gold)}
.pbtn{font:700 12px var(--f-pix);color:var(--ink);background:var(--raise);border:1px solid var(--line);width:32px;height:30px;padding:0;cursor:pointer}

.holdn{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font:700 28px var(--f-pix);color:var(--blue);background:rgba(10,12,16,.78);padding:2px 10px;pointer-events:none;font-variant-numeric:tabular-nums}
.holdn.s1{color:var(--orange)}
.holdn.low{color:#6b7380}
.hint{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:min(92%,340px);background:rgba(10,12,16,.86);border:1px solid var(--line);padding:12px 14px;display:grid;gap:6px;font-size:13.5px;pointer-events:none;transition:opacity .6s}
.hint b{color:var(--gold);font-weight:600}
.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-cn);font-size:24px;background:rgba(15,18,23,.84);border:1px solid var(--line);padding:6px 16px;pointer-events:none;white-space:nowrap;animation:ban 1.5s forwards}
.banner.s0{top:70%}
.banner.s1{top:30%;transform:translate(-50%,-50%) rotate(180deg)}
@keyframes ban{0%{opacity:0}12%{opacity:1}75%{opacity:1}100%{opacity:0}}

/* ---------- 调试栏 ---------- */
#dbg{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;box-sizing:border-box}
.dbg-head{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.dbg-head h2{font-family:var(--f-cn);font-weight:400;font-size:22px;margin:0}
.dbg-head .tag{font:700 11px var(--f-pix);color:var(--muted)}
.dbg-head .x{margin-left:auto;background:none;border:1px solid var(--line);color:var(--ink);width:30px;height:28px;cursor:pointer}
.dbg-note{margin:0;padding:8px 14px 0;font-size:12px;color:var(--muted)}
.dbg-list{flex:1;overflow-y:auto;padding:8px 10px 12px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.grp-t{font-size:11px;color:var(--muted);letter-spacing:.12em;padding:8px 2px 2px}
.it{background:var(--raise);border:1px solid var(--line);padding:9px 10px;display:grid;gap:6px}
.it.v-yes{border-left:3px solid var(--ok)}
.it.v-no{border-left:3px solid var(--no);opacity:.7}
.it-top{display:flex;align-items:center;gap:8px}
.it-name{font-size:14px;font-weight:600;flex:1;min-width:0}
.it-val{font:700 13px var(--f-pix);color:var(--gold);font-variant-numeric:tabular-nums}
.it-desc{font-size:11.5px;color:var(--muted);line-height:1.35}
.it input[type=range]{width:100%;accent-color:var(--blue);margin:0}
.sw{position:relative;width:40px;height:22px;border-radius:11px;background:var(--line);border:none;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw[aria-pressed="true"]{background:var(--blue)}
.sw[aria-pressed="true"]::after{transform:translateX(18px);background:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.seg button{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:6px 4px;cursor:pointer;line-height:1.25}
.seg button[aria-pressed="true"]{color:#fff;background:var(--blue);border-color:var(--blue)}
.vd{display:flex;gap:4px}
.vd button{flex:1;font-size:11.5px;color:var(--muted);background:none;border:1px solid var(--line);padding:4px 0;cursor:pointer}
.vd button.on.yes{color:#fff;background:var(--ok);border-color:var(--ok)}
.vd button.on.no{color:#fff;background:var(--no);border-color:var(--no)}
.vd button.on.wait{color:var(--frame);background:var(--muted);border-color:var(--muted)}
.dbg-foot{padding:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:6px}
.dbg-msg{grid-column:1/-1;font-size:11.5px;color:var(--ok);min-height:14px;margin:0}
#dbgTab{display:none;position:fixed;left:0;top:42%;z-index:21;writing-mode:vertical-rl;font:15px var(--f-cn);letter-spacing:.2em;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-left:none;padding:12px 6px;cursor:pointer}
#dbgScrim{display:none}
@media (max-width:899px){
  #dbg{position:fixed;left:0;top:0;bottom:0;z-index:30;width:min(320px,88vw);transform:translateX(-102%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  #dbg.open{transform:none}
  #dbgTab{display:block}
  #dbgScrim.open{display:block;position:fixed;inset:0;z-index:29;background:rgba(5,7,10,.55)}
  #app{padding-left:30px}
}
@media (min-width:900px){ .dbg-head .x{display:none} }

/* ---------- 弹层 ---------- */
.btn{font-size:15px;color:var(--ink);background:var(--raise);border:1px solid var(--line);padding:11px 10px;cursor:pointer}
.btn.main{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.wide{grid-column:1/-1}
.ov{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(9,11,15,.9);padding:16px;box-sizing:border-box}
.panel{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
h1{font-family:var(--f-cn);font-weight:400;font-size:44px;margin:0;line-height:1}
.panel h2{font-family:var(--f-cn);font-weight:400;font-size:28px;margin:0}
.sub{margin:0;color:var(--muted);font-size:14px}
.strip{display:flex;gap:3px}
.strip span{width:18px;height:18px;background:#cdd2c9;animation:walk 1.8s steps(1) infinite}
@keyframes walk{0%{background:var(--blue)}11%{background:#cdd2c9}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.how{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13px;color:var(--muted)}
.how b{color:var(--ink);font-weight:600;display:inline-block;min-width:7.5em}
.statgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 12px;font-size:13px}
.statgrid .h{color:var(--muted)}
.statgrid .n{font-family:var(--f-pix);font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}
@media (prefers-reduced-motion:reduce){.strip span{animation:none}.banner{animation:none}#dbg{transition:none}}
</style>
</head>
<body>

<div id="shell">
  <aside id="dbg" aria-label="调试栏">
    <div class="dbg-head"><h2>调试栏</h2><span class="tag">v3</span><button class="x" id="dbgClose" aria-label="收起调试栏">✕</button></div>
    <p class="dbg-note">开关和滑块随时调、立刻生效。试完给每一项标上采纳或不采纳，结论保存在这台设备上。</p>
    <div class="dbg-list" id="dbgList"></div>
    <div class="dbg-foot">
      <button class="btn main" id="dbgCopy">复制结论</button>
      <button class="btn" id="dbgReset">恢复默认</button>
      <p class="dbg-msg" id="dbgMsg"></p>
    </div>
  </aside>
  <div id="dbgScrim"></div>
  <button id="dbgTab" aria-label="打开调试栏">调试</button>

  <div id="main">
    <div id="app">
      <div id="lbar"></div>
      <div id="stage">
        <canvas id="board"></canvas>
        <div class="holdn" id="hold0" hidden></div>
        <div class="holdn s1" id="hold1" hidden></div>
      </div>
      <div id="rbar"></div>
    </div>

    <div class="ov" id="menu">
      <div class="panel">
        <div class="strip" aria-hidden="true"><span style="animation-delay:0s"></span><span style="animation-delay:.2s"></span><span style="animation-delay:.4s"></span><span style="animation-delay:.6s"></span><span style="animation-delay:.8s"></span><span style="animation-delay:1s"></span><span style="animation-delay:1.2s"></span><span style="animation-delay:1.4s"></span><span style="animation-delay:1.6s"></span></div>
        <h1>像素小兵</h1>
        <p class="sub" id="menuSub">攒兵、成波冲锋，翻板一格一格滚过去冲垮对方基地。一局 3 分钟。</p>
        <div class="modes">
          <button class="btn" data-mode="ai" data-diff="easy">人机 · 简单</button>
          <button class="btn main" data-mode="ai" data-diff="normal">人机 · 普通</button>
          <button class="btn" data-mode="ai" data-diff="hard">人机 · 困难</button>
          <button class="btn" data-mode="duo">同屏双人</button>
        </div>
        <ul class="how">
          <li><b>按住 → 上拨</b>兵营里的兵被吸过来，成波发射（至少 3 个）</li>
          <li><b>↓ 下拨</b>升起盾墙，挡碎来兵（耗 2 兵）</li>
          <li><b>↓↑ 快划 V 字</b>弹反碰到的敌兵（耗 1 兵）</li>
          <li><b>斜着拨</b>整波沿对角线翻滚</li>
        </ul>
      </div>
    </div>
    <div class="ov" id="pause" hidden>
      <div class="panel">
        <h2>暂停</h2>
        <div class="modes">
          <button class="btn main wide" id="resume">继续</button>
          <button class="btn" id="restart">重新开始</button>
          <button class="btn" id="toMenu">回到菜单</button>
          <button class="btn wide" id="mute">声音：开</button>
        </div>
      </div>
    </div>
    <div class="ov" id="end" hidden></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
if (!window.THREE) { $('#menuSub').textContent = '3D 引擎没有加载成功，请检查网络后刷新页面。'; return; }

/* ===== 固定数值（可调的在调试栏里） ===== */
const CFG = {
  COLS: 13, ROWS: 16,
  TROOP_START: 4, MIN_WAVE: 3, MAX_W: 5, HOLD_STEP: 150,
  STEP_FAST: 250, STEP_SLOW: 650, ACCEL_ROWS: 4,
  ARROW_LAG: 0.5, FAN_DEG: 12,
  WALL_COST: 2, WALL_W: 3, WALL_TIME: 2000, WALL_CD: 6000,
  PARRY_COST: 1, PARRY_W: 3,
  PARRY_NEW: { win: 600, life: 600, cd: 3000, shared: false },
  PARRY_OLD: { win: 450, life: 400, cd: 6000, shared: true },
  PARRY_SPEED: 1.5, PLATEAU_TIME: 6000, STAGGER_MAX: 600,
  SURGE_FRAC: 0.75, SURGE_STEP: 160,
  OWN_TERR: 1.25, ENEMY_TERR: 0.85,
  MATCH: 180000, FRENZY_AT: 120000, LOW_HP_FRAC: 0.2, LOW_HP_REGEN: 1.3,
  TILE: 0.95, THICK: 0.16, SOLDIER_H: 0.46, PW_H: 0.2, PLAT_LIFT: 0.3,
};
const AI_LV = {
  easy:   { think: 950, react: 0.4,  parry: 0,    min: 3, max: 5,  label: '简单' },
  normal: { think: 620, react: 0.7,  parry: 0.25, min: 4, max: 9,  label: '普通' },
  hard:   { think: 400, react: 0.95, parry: 0.55, min: 6, max: 12, intercept: true, label: '困难' },
};

/* ===== 调试项 ===== */
const DEBUG = [
  { g: '数值' },
  { id: 'regen',   name: '兵员生成间隔', type: 'num', min: 0.3, max: 2, step: 0.05, def: 0.75, unit: '秒', desc: '多久生成 1 个兵（原来是 1.5 秒）' },
  { id: 'tmax',    name: '兵力上限',     type: 'num', min: 6, max: 20, step: 1, def: 20, unit: '个', desc: '兵营最多攒多少；满兵浪涌门槛 = 上限的 3/4' },
  { id: 'hp',      name: '基地血量',     type: 'num', min: 10, max: 50, step: 5, def: 30, unit: '', desc: '下一局生效' },
  { id: 'hold',    name: '僵持时长',     type: 'num', min: 0, max: 0.8, step: 0.05, def: 0.3, unit: '秒', desc: '撞上后卡住多久才开始崩' },
  { id: 'gap',     name: '崩碎间隔',     type: 'num', min: 0, max: 0.2, step: 0.01, def: 0.1, unit: '秒', desc: '每格之间隔多久崩（总长不超过 0.6 秒）' },
  { g: '画面' },
  { id: 'view',    name: '镜头',     type: 'ab', a: '斜俯视（不分远近）', b: '透视（近大远小）', def: 'a' },
  { id: 'shadow',  name: '阴影',     type: 'bool', def: true, desc: '老手机卡顿时关掉' },
  { id: 'impact',  name: '撞击效果', type: 'ab', a: '卡在翻转中途', b: '受力弯曲', def: 'a' },
  { id: 'stagger', name: '逐格崩碎', type: 'bool', def: true, desc: '从接触点向两侧逐格崩；关掉则同时崩' },
  { id: 'arrow',   name: '箭头阵',   type: 'bool', def: true, desc: '中间领头，两侧每列落后半格；关掉则一字排开' },
  { id: 'fan',     name: '扇形翻转', type: 'bool', def: true, desc: '中间正翻，越靠两侧翻转轴越向外偏' },
  { id: 'diag',    name: '斜向翻转', type: 'bool', def: true, desc: '斜着拨时整波沿对角线翻' },
  { id: 'ripple',  name: '波纹带动', type: 'bool', def: true, desc: '前后格子跟着微翻、染上淡色' },
  { id: 'warn',    name: '来袭预警', type: 'bool', def: true, desc: '敌兵还没过中线时，我方半场边缘亮出它的列' },
  { id: 'terr',    name: '领地染色', type: 'bool', def: false, desc: '兵走过的格子染色，己方领地加速' },
  { g: '玩法' },
  { id: 'result',  name: '对撞结果', type: 'ab', a: '兵多剩余继续冲', b: '两波全灭', def: 'a' },
  { id: 'send',    name: '发兵方式', type: 'ab', a: '长按蓄兵', b: '一拨全发', def: 'a' },
  { id: 'accel',   name: '先慢后快', type: 'bool', def: true, desc: '起步慢，到己方半场一半达到最高速' },
  { id: 'parry',   name: '弹反参数', type: 'ab', a: '放宽：0.6 秒，冷却 3 秒', b: '旧版：0.4 秒，与盾墙共用 6 秒', def: 'a' },
  { id: 'plateau', name: '弹反之后', type: 'ab', a: '落地变台地', b: '掉头冲回去', def: 'a', desc: '台地：己方兵经过力量 +1，持续 6 秒' },
  { id: 'surge',   name: '满兵浪涌', type: 'bool', def: true, desc: '一次发出上限 3/4 以上的兵，带一道压弯大地的冲击波' },
];
const ITEMS = DEBUG.filter(d => d.id);
const DBG_KEY = 'pixel-legion-debug-v3', OLD_KEY = 'pixel-legion-debug-v2';
const DBG = { val: {}, verdict: {} };
function loadDbg() {
  let s = null, o = null;
  try { s = JSON.parse(localStorage.getItem(DBG_KEY) || 'null'); } catch (e) {}
  try { o = JSON.parse(localStorage.getItem(OLD_KEY) || 'null'); } catch (e) {}
  for (const d of ITEMS) {
    const v = s && s.val ? s.val[d.id] : undefined;
    DBG.val[d.id] = v === undefined ? d.def : v;
    DBG.verdict[d.id] = (s && s.verdict && s.verdict[d.id]) || (o && o.verdict && o.verdict[d.id]) || 'wait';
  }
}
function saveDbg() { try { localStorage.setItem(DBG_KEY, JSON.stringify(DBG)); } catch (e) {} }
const opt = id => DBG.val[id];
loadDbg();

const COLS = CFG.COLS, ROWS = CFG.ROWS, N = COLS * ROWS, HALF = ROWS / 2;
const DIR = [-1, 1], SPAWN = [ROWS - 1, 0], TARGET = [-1, ROWS];
const HEX = { neutral: '#aeb4ab', unit: ['#2f6bff', '#ff7a1a'], soft: ['#9db6f2', '#f2c399'], plat: ['#5f86ee', '#f09a52'], dark: ['#1b3a96', '#8f3d07'], gold: '#ffd84a' };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const onBoard = r => r >= 0 && r < ROWS;
const now = () => performance.now();

const stage = $('#stage'), cv = $('#board');
let G = null, uid = 0, wid = 0, last = 0, muted = false, firstGame = true, lastSetup = null;

/* ===== 声音：砰（撞击）· 吱（僵持）· 砰（崩碎） ===== */
let AC = null, NB = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
}
function noiseBuf() {
  if (!NB) { NB = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  return NB;
}
function nz(dur, vol, type, freq, q) {
  const at = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf(); f.type = type; f.frequency.value = freq; if (q) f.Q.value = q;
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(at); s.stop(at + dur + 0.02);
}

/* ===== 对局状态 ===== */

}

function newGame(mode, diff) {

    plat: new Array(N).fill(null), terr: new Int8Array(N).fill(-1),
    waves: [], hitters: [], clashes: [], walls: [], surges: [], flyers: [], ptr: [null, null],
    ai: { t: 900, want: 0 }, sides: [mkSide(0, hp), mkSide(1, hp)] };

/* ===== 单位与波 ===== */
// 小兵位置 pos = o + DIR * (wave.d - off)，连续值：整数时正好立在格子上
const allUnits = () => { const a = []; for (const w of G.waves) for (const u of w.units) if (!u.dead) a.push(u); for (const h of G.hitters) a.push(h.u); return a; };

function killUnit(u, killer, n) {
  if (u.dead) return;
  u.dead = true;
  if (killer != null) G.sides[killer].stats.kills++;
  if (onBoard(Math.round(u.pos))) R.burst(u.c + 0.5, 0.3, u.pos + 0.5, HEX.unit[u.side], n || 10, 1);
}

function newWave(side) { return { id: ++wid, side, units: [], d: 0, run: 0, state: 'move', speedMul: 1, delay: 0 }; }

function sendWave(side, col, n, alpha) {
  const S = G.sides[side];
  n = Math.min(n, S.troops);
  if (n < CFG.MIN_WAVE) { sfx('deny'); if (isHuman(side)) banner('至少 3 个兵才能发射', side, true); return false; }
  const w = Math.min(CFG.MAX_W, n), rows = Math.ceil(n / CFG.MAX_W);
  const c0 = clamp(col - Math.floor((w - 1) / 2), 0, COLS - w), sr = SPAWN[side], cc = c0 + (w - 1) / 2;
  for (const u of allUnits()) if (u.c >= c0 && u.c < c0 + w && Math.abs(u.pos - sr) < 1) { sfx('deny'); if (isHuman(side)) banner('出兵口被堵住了', side, true); return false; }
  const wave = newWave(side);
  wave.delay = 170;
  for (let k = 0; k < n; k++) {
    const j = Math.floor(k / w), inRow = j === rows - 1 ? n - j * w : w, off = Math.floor((w - inRow) / 2);
    const c = c0 + off + (k - j * w), dx = c - cc;

    const fan = opt('fan') ? clamp(dx * CFG.FAN_DEG, -40, 40) * Math.PI / 180 : 0;
    wave.units.push({ id: ++uid, side, c, o: sr, off: j + lag, pos: 0, pw: 1, wave, dead: false,

  }
  setPos(wave);
  R.launch(side, wave.units);
  S.troops -= n;

  if (opt('surge') && n >= surgeN()) {
    G.surges.push({ side, pos: sr, hit: new Set(), delay: 170 });
    sfx('surge'); banner('浪涌', side, true);
  }

}

function interval(w) {
  let iv = opt('accel') ? lerp(CFG.STEP_SLOW, CFG.STEP_FAST, Math.min(1, w.run / CFG.ACCEL_ROWS)) : CFG.STEP_FAST;
  if (opt('terr')) {

    if (f) { const t = G.terr[Math.round(f.pos) * COLS + f.c]; if (t === w.side) iv /= CFG.OWN_TERR; else if (t !== -1) iv /= CFG.ENEMY_TERR; }

}
function wallAt(c, r) { for (const wl of G.walls) if (wl.row === r && c >= wl.c0 && c <= wl.c1) return wl; return null; }

function moveWave(w, dt) {

  const dir = DIR[w.side], us = liveUnits(w);

  for (const u of us) {
    for (const o of others) {
      if (o.c !== u.c) continue;
      const gap = (o.pos - u.pos) * dir;
      if (gap > 0.01) delta = Math.min(delta, Math.max(0, gap - 1));
    }
    for (const wl of G.walls) {
      if (wl.side !== w.side || wl.kind !== 'wall' || u.c < wl.c0 || u.c > wl.c1) continue;
      const gap = (wl.row - u.pos) * dir;
      if (gap > 0.01) delta = Math.min(delta, Math.max(0, gap - 1));
    }

  w.d += delta; w.run += delta;

  for (const u of us) {
    if (u.dead) continue;
    // 打到基地

    const k = Math.round(u.pos);
    if (!onBoard(k)) continue;
    for (const wl of G.walls) {
      if (wl.side === w.side || u.c < wl.c0 || u.c > wl.c1) continue;
      const gap = (wl.row - u.pos) * dir;
      if (wl.kind === 'wall' && gap <= 0.8 && gap > -0.6) { killUnit(u, wl.side, 12); R.burst(u.c + 0.5, 0.5, wl.row + 0.5, '#d9dde4', 6, 1); sfx('crack', 0); break; }
      if (wl.kind === 'paddle' && gap <= 0.5 && gap > -0.6) { parryUnit(u, wl); break; }
    }
    if (u.dead || u.side !== w.side) continue;
    const p = G.plat[k * COLS + u.c];
    if (p && p.side === u.side && !u.charged && Math.abs(u.pos - k) < 0.3) { u.pw += 1; u.charged = true; }
    if (opt('terr') && Math.abs(u.pos - k) < 0.3) G.terr[k * COLS + u.c] = u.side;

function checkContact(w) {
  if (w.state !== 'move' || w.delay > 0) return;
  const dir = DIR[w.side];
  for (const u of liveUnits(w)) {
    for (const v of G.waves) {
      if (v.side === w.side || v.state !== 'move') continue;
      for (const e of v.units) {
        if (e.dead || e.c !== u.c) continue;
        const gap = (e.pos - u.pos) * dir;
        if (gap > -0.2 && gap <= 1) { startClash(w, v); return; }

/* ===== 打到基地：同样卡住 → 僵持 → 崩碎 ===== */
function toHitter(u) {
  const w = u.wave;
  w.units = w.units.filter(x => x !== u);

}

      const u = h.u, foe = G.sides[1 - u.side];
      u.dead = true;
      foe.hp = Math.max(0, foe.hp - u.pw);
      G.sides[u.side].stats.hits += u.pw;
      R.burst(u.c + 0.5, 0.3, u.pos + 0.5, HEX.unit[u.side], 12, 1.2);
      R.burst(u.c + 0.5, 0.2, TARGET[u.side] + 0.5, HEX.unit[foe.s], 8, 1);
      R.shake(0.12);
      sfx('crack', 3); sfx('base'); if (isHuman(foe.s)) buzz(40);
    }
  }

/* ===== 对撞：卡住 → 僵持 → 逐格崩碎 ===== */
function startClash(a, b) {

  const cc = cols.length ? cols.reduce((s, c) => s + c, 0) / cols.length : COLS / 2;
  const order = list => list.slice().sort((x, y) => (adv(y) - adv(x)) || (Math.abs(x.c - cc) - Math.abs(y.c - cc)));

    pa[i] -= m; pb[j] -= m;
    if (pa[i] <= 0) i++;
    if (pb[j] <= 0) j++;
  }
  if (opt('result') === 'b') {
    const ra = A.slice(i), rb = B.slice(j);
    for (let k = 0; k < Math.max(ra.length, rb.length); k++) {
      const ev = []; if (ra[k]) ev.push([ra[k], 99]); if (rb[k]) ev.push([rb[k], 99]); cl.events.push(ev);
    }
  }

}
function updateClash(cl, dt) {
  cl.t += dt;
  const H = holdMs();
  if (cl.t < H) {
    if (Math.random() < 0.5) R.burst(cl.cc + 0.5 + (Math.random() - 0.5) * 3, 0.45, cl.z, HEX.gold, 1, 0.5);
    return;
  }
  const tt = cl.t - H;
  while (cl.i < cl.events.length && tt >= cl.i * cl.gap) {
    const k = cl.i++;
    for (const [u, m] of cl.events[k]) {
      if (u.dead) continue;
      u.pw -= m;
      if (u.pw <= 0) { killUnit(u, 1 - u.side, 12); R.burst(u.c + 0.5, 0.4, u.pos + 0.5, HEX.gold, 4, 1); }
    }
    sfx('crack', Math.min(k, 9));
  }
  if (cl.i >= cl.events.length && tt >= Math.max(0, cl.events.length - 1) * cl.gap + 160) {
    G.clashes.splice(G.clashes.indexOf(cl), 1);

/* ===== 盾墙 / 弹反 ===== */
const parryCfg = () => opt('parry') === 'a' ? CFG.PARRY_NEW : CFG.PARRY_OLD;
function guardReady(S, kind) {
  if (kind === 'wall') return S.wallCd <= 0;
  return parryCfg().shared ? S.wallCd <= 0 : S.parryCd <= 0;
}
function raise(s, row, col, kind) {
  const S = G.sides[s], pc = parryCfg();
  const cost = kind === 'wall' ? CFG.WALL_COST : CFG.PARRY_COST;
  if (!guardReady(S, kind)) { sfx('deny'); return false; }
  if (S.troops < cost) { sfx('deny'); if (isHuman(s)) banner(`需要 ${cost} 个兵`, s, true); return false; }
  const lo = s === 0 ? HALF : 1, hi = s === 0 ? ROWS - 2 : HALF - 1;
  row = clamp(row, lo, hi);
  const W = kind === 'wall' ? CFG.WALL_W : CFG.PARRY_W;
  const c0 = clamp(col - Math.floor(W / 2), 0, COLS - W), c1 = c0 + W - 1;
  const wl = { side: s, row, c0, c1, kind, born: G.time, rewarded: false, wave: null,
    until: G.time + (kind === 'wall' ? CFG.WALL_TIME : pc.life) };

  S.troops -= cost;
  if (kind === 'wall') { S.wallCd = CFG.WALL_CD; if (pc.shared) S.parryCd = CFG.WALL_CD; S.stats.walls++; sfx('wall'); }
  else { S.parryCd = pc.cd; if (pc.shared) S.wallCd = pc.cd; sfx('swing'); }

  if (!wl.rewarded) { wl.rewarded = true; S.stats.parries++; sfx('parry'); if (isHuman(wl.side)) buzz(30); }
  R.burst(u.c + 0.5, 0.5, u.pos + 0.5, HEX.gold, 8, 1);
  if (opt('plateau') === 'a') {
    u.dead = true; S.stats.kills++;
    const k = clamp(Math.round(u.pos), 0, ROWS - 1);
    G.plat[k * COLS + u.c] = { side: wl.side, until: G.time + CFG.PLATEAU_TIME };
  } else {
    u.side = wl.side; u.parried = true; u.stuck = null; u.charged = false;

    nw.units.push(u);

/* ===== 浪涌：气浪压弯大地 ===== */
function updateSurges(dt) {
  for (const sg of G.surges) {
    if (sg.delay > 0) { sg.delay -= dt; continue; }
    sg.pos += DIR[sg.side] * dt / CFG.SURGE_STEP;
    for (const w of G.waves) {
      if (w.side === sg.side) continue;
      for (const u of w.units) {
        if (u.dead || sg.hit.has(u.id) || !onBoard(Math.round(u.pos))) continue;
        if ((sg.pos - u.pos) * DIR[sg.side] >= 0) {
          sg.hit.add(u.id); u.pw -= 1; R.burst(u.c + 0.5, 0.4, u.pos + 0.5, HEX.unit[sg.side], 3, 0.8);
          if (u.pw <= 0) killUnit(u, sg.side);
        }
      }
    }
    if ((sg.pos - TARGET[sg.side]) * DIR[sg.side] > 7) sg.dead = true;
  }
  G.surges = G.surges.filter(s => !s.dead);
}

/* ===== 电脑对手 ===== */
function aiThink() {
  const L = AI_LV[G.diff], S = G.sides[1];
  const foes = G.waves.filter(w => w.side === 0 && w.delay <= 0 && liveUnits(w).some(u => onBoard(Math.round(u.pos))));
  let threat = null, best = 99;
  for (const w of foes) {
    if (w.state !== 'move') continue;
    const f = Math.min(...liveUnits(w).map(u => u.pos));
    if (f >= 1.5 && f <= 6.5 && f < best) { best = f; threat = w; }
  }
  if (threat) {
    const us = liveUnits(threat), cc = Math.round(us.reduce((s, u) => s + u.c, 0) / us.length);
    const row = Math.round(best) - 1;
    if (S.troops >= CFG.PARRY_COST && guardReady(S, 'paddle') && Math.random() < L.parry) { raise(1, row, cc, 'paddle'); return; }
    if (us.length >= 3 && S.troops >= CFG.WALL_COST && guardReady(S, 'wall') && Math.random() < L.react) { raise(1, row, cc, 'wall'); return; }
  }
  if (!G.ai.want) G.ai.want = L.min + Math.floor(Math.random() * (L.max - L.min + 1));
  const want = Math.min(G.ai.want, tmax());

  let col = Math.floor(Math.random() * COLS);
  const centers = foes.map(w => { const us = liveUnits(w); return { c: us.reduce((s, u) => s + u.c, 0) / us.length, n: us.length }; });
  if (L.intercept) { const tgt = centers.find(x => x.n < S.troops); if (tgt) col = Math.round(tgt.c); }
  else if (centers.length && G.diff === 'normal') {
    let bestD = -1;
    for (let k = 0; k < 3; k++) { const c = Math.floor(Math.random() * COLS); const d = Math.min(...centers.map(x => Math.abs(x.c - c))); if (d > bestD) { bestD = d; col = c; } }
  }
  if (sendWave(1, col, L.intercept ? S.troops : want, 0)) G.ai.want = 0;
}

/* ===== 主循环 ===== */
function update(dt) {
  G.time += dt;
  const fr = G.time >= CFG.FRENZY_AT ? 2 : 1;
  if (fr === 2 && !G.frenzy) { G.frenzy = true; banner('狂热阶段'); }
  for (const S of G.sides) {
    if (S.troops < tmax()) {
      S.regen += dt * fr * (S.hp <= G.hpMax * CFG.LOW_HP_FRAC ? CFG.LOW_HP_REGEN : 1);
      if (S.regen >= regenMs()) { S.regen -= regenMs(); S.troops++; }
    } else { S.regen = 0; S.troops = Math.min(S.troops, Math.max(tmax(), S.troops)); }
    S.wallCd = Math.max(0, S.wallCd - dt * fr);
    S.parryCd = Math.max(0, S.parryCd - dt * fr);
  }
  G.walls = G.walls.filter(w => w.until > G.time);
  for (let k = 0; k < N; k++) if (G.plat[k] && G.plat[k].until <= G.time) G.plat[k] = null;
  for (const w of G.waves.slice()) if (w.state === 'move') moveWave(w, dt);
  updateHitters(dt);
  for (const cl of G.clashes.slice()) updateClash(cl, dt);
  updateSurges(dt);
  G.waves = G.waves.filter(w => { if (w.state === 'move') w.units = liveUnits(w); return w.units.length > 0 || w.state === 'clash'; });
  if (G.mode === 'ai') { G.ai.t -= dt; if (G.ai.t <= 0) { G.ai.t = AI_LV[G.diff].think * (0.7 + Math.random() * 0.6); aiThink(); } }
  checkEnd();
}
function checkEnd() {
  const [A, B] = G.sides;
  let w;

  const duo = G.mode === 'duo', hp = G.hpMax;
  const blocks = '<span></span>'.repeat(hp);
  $('#lbar').innerHTML = `
    <div class="hpcol s1 ${duo ? '' : ''}"><b class="hpn">${hp}</b><div class="blocks">${blocks}</div></div>
    <div class="hpcol s0"><div class="blocks">${blocks}</div><b class="hpn">${hp}</b></div>`;
  const cd = s => `<div class="cds s${s} ${duo && s === 1 ? 'flip' : ''}"><div class="cd" data-k="wall"><i></i><span>墙</span></div><div class="cd" data-k="parry"><i></i><span>反</span></div></div>`;
  $('#rbar').innerHTML = `${cd(1)}
    <div class="mid"><span class="clock ${duo ? '' : ''}">3:00</span><button class="pbtn" id="pbtn" aria-label="暂停">II</button></div>
    ${cd(0)}`;
  $('#pbtn').addEventListener('click', pauseGame);
  for (let s = 0; s < 2; s++) {
    const col = $(`#lbar .hpcol.s${s}`), c = $(`#rbar .cds.s${s}`);
    barEls[s] = { n: col.querySelector('.hpn'), blocks: [...col.querySelectorAll('.blocks span')], shown: hp,
      wall: c.querySelector('[data-k=wall]'), parry: c.querySelector('[data-k=parry]') };
  }
}
function updateBars() {
  if (!G || !barEls[0]) return;
  const left = Math.max(0, CFG.MATCH - G.time), m = Math.floor(left / 60000), sec = Math.floor(left / 1000) % 60;
  const clock = $('#rbar .clock');
  clock.textContent = `${m}:${String(sec).padStart(2, '0')}`; clock.classList.toggle('hot', G.frenzy);
  const pc = parryCfg();
  for (let s = 0; s < 2; s++) {
    const S = G.sides[s], b = barEls[s];
    b.n.textContent = S.hp;
    if (S.hp !== b.shown) { b.blocks.forEach((e, i) => e.classList.toggle('gone', i >= S.hp)); b.shown = S.hp; }
    const wp = 1 - S.wallCd / CFG.WALL_CD, pcd = pc.shared ? S.wallCd : S.parryCd, pp = 1 - pcd / pc.cd;
    b.wall.querySelector('i').style.height = (wp * 100) + '%';
    b.parry.querySelector('i').style.height = (pp * 100) + '%';
    b.wall.classList.toggle('ready', S.wallCd <= 0 && S.troops >= CFG.WALL_COST);
    b.parry.classList.toggle('ready', pcd <= 0 && S.troops >= CFG.PARRY_COST);
  }
}

/* ===== 手势：同一时间每方只认一个手指 ===== */
const pidSide = new Map();
const TH = 16;
const fwd = (side, dy) => side === 0 ? -dy : dy;
function holdCount(side, p) {
  const T = G.sides[side].troops;
  return opt('send') === 'a' ? Math.min(T, CFG.MIN_WAVE + Math.floor((now() - p.t0) / CFG.HOLD_STEP)) : T;
}
cv.addEventListener('pointerdown', e => {
  audio();
  if (!G || G.over || G.paused) return;
  const cell = R.pick(e.clientX, e.clientY); if (!cell) return;
  const side = G.mode === 'duo' ? (cell.z < HALF ? 1 : 0) : 0;
  if (G.ptr[side]) return;
  G.ptr[side] = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, t0: now(),
    c: clamp(cell.c, 0, COLS - 1), r: clamp(cell.r, 0, ROWS - 1), minF: 0, n: 0, showN: true };
  pidSide.set(e.pointerId, side);
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  const side = pidSide.get(e.pointerId); if (side == null || !G) return;
  const p = G.ptr[side]; if (!p || p.id !== e.pointerId) return;
  p.x = e.clientX; p.y = e.clientY;
  const f = fwd(side, e.clientY - p.y0);
  if (!p.mvT && Math.hypot(e.clientX - p.x0, e.clientY - p.y0) > 6) p.mvT = now();
  if (f < p.minF) p.minF = f;
  if (p.minF <= -TH) p.showN = false;
});
function endPtr(e, cancel) {
  const side = pidSide.get(e.pointerId); pidSide.delete(e.pointerId);
  if (side == null || !G) return;
  const p = G.ptr[side]; if (!p || p.id !== e.pointerId) return;
  G.ptr[side] = null;
  if (cancel || G.over || G.paused) return;
  const dx = e.clientX - p.x0, dy = e.clientY - p.y0, f = fwd(side, dy);
  const gest = now() - (p.mvT || p.t0);
  if (p.minF <= -TH && f - p.minF >= TH && gest <= parryCfg().win) raise(side, p.r, p.c, 'paddle');
  else if (p.minF <= -TH) raise(side, p.r, p.c, 'wall');
  else if (f >= TH) {
    let alpha = 0;
    if (opt('diag')) {
      const a = side === 0 ? Math.atan2(dx, -dy) : Math.atan2(dx, dy);
      if (Math.abs(a) > Math.PI / 8) alpha = Math.sign(a) * Math.PI / 4;
    }
    sendWave(side, p.c, holdCount(side, p), alpha);
  }
}
cv.addEventListener('pointerup', e => endPtr(e, false));
cv.addEventListener('pointercancel', e => endPtr(e, true));
function updateHoldBubbles() {
  for (let s = 0; s < 2; s++) {
    const el = $('#hold' + s), p = G && G.ptr[s];
    if (!p || !p.showN) { el.hidden = true; continue; }
    p.n = holdCount(s, p);
    const b = stage.getBoundingClientRect(), ok = p.n >= CFG.MIN_WAVE;
    el.hidden = false; el.textContent = ok ? p.n : CFG.MIN_WAVE;
    el.classList.toggle('low', !ok);
    const flip = s === 1 && G.mode === 'duo';
    el.style.left = (p.x - b.left) + 'px'; el.style.top = (p.y - b.top + (flip ? 70 : -40)) + 'px';
    el.style.transform = flip ? 'translate(-50%,0) rotate(180deg)' : 'translate(-50%,-100%)';
  }
}

/* ===== 调试栏 ===== */
const dbgEl = $('#dbg'), scrim = $('#dbgScrim');
const fmtNum = (d, v) => (d.step < 1 ? (+v).toFixed(d.step < 0.1 ? 2 : 1) : String(v)) + d.unit;
function renderDbg() {
  $('#dbgList').innerHTML = DEBUG.map(d => {
    if (d.g) return `<div class="grp-t">${d.g}</div>`;
    const v = DBG.val[d.id], vd = DBG.verdict[d.id];
    const right = d.type === 'bool' ? `<button class="sw" data-id="${d.id}" aria-pressed="${v ? 'true' : 'false'}" aria-label="${d.name}"></button>`
      : d.type === 'num' ? `<span class="it-val" id="val-${d.id}">${fmtNum(d, v)}</span>` : '';
    const body = d.type === 'ab'
      ? `<div class="seg"><button data-id="${d.id}" data-v="a" aria-pressed="${v === 'a'}">${d.a}</button><button data-id="${d.id}" data-v="b" aria-pressed="${v === 'b'}">${d.b}</button></div>`
      : d.type === 'num' ? `<input type="range" id="rng-${d.id}" data-id="${d.id}" min="${d.min}" max="${d.max}" step="${d.step}" value="${v}" aria-label="${d.name}">` : '';
    return `<div class="it v-${vd}">
      <div class="it-top"><span class="it-name">${d.name}</span>${right}</div>
      ${d.desc ? `<div class="it-desc">${d.desc}</div>` : ''}${body}
      <div class="vd">
        <button class="yes ${vd === 'yes' ? 'on' : ''}" data-id="${d.id}" data-vd="yes">采纳</button>
        <button class="no ${vd === 'no' ? 'on' : ''}" data-id="${d.id}" data-vd="no">不采纳</button>
        <button class="wait ${vd === 'wait' ? 'on' : ''}" data-id="${d.id}" data-vd="wait">待定</button>
      </div></div>`;
  }).join('');
}
$('#dbgList').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !b.dataset.id) return;
  const id = b.dataset.id;
  if (b.classList.contains('sw')) DBG.val[id] = !DBG.val[id];
  else if (b.dataset.v) DBG.val[id] = b.dataset.v;
  else if (b.dataset.vd) DBG.verdict[id] = b.dataset.vd;
  saveDbg(); renderDbg();
});
$('#dbgList').addEventListener('input', e => {
  const el = e.target; if (el.type !== 'range') return;
  const d = ITEMS.find(x => x.id === el.dataset.id);
  DBG.val[d.id] = +el.value; $('#val-' + d.id).textContent = fmtNum(d, el.value);
  saveDbg();
});
function dbgSummary() {
  const n = new Date(), day = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`;
  const tag = { yes: '采纳', no: '不采纳', wait: '待定' };
  let out = `像素小兵 v3 调试结论（${day}）`;
  for (const d of DEBUG) {
    if (d.g) { out += `\n【${d.g}】`; continue; }
    const v = DBG.val[d.id];
    const cur = d.type === 'bool' ? (v ? '开' : '关') : d.type === 'num' ? fmtNum(d, v) : (v === 'a' ? d.a : d.b);
    out += `\n- ${d.name}：${cur}（${tag[DBG.verdict[d.id]]}）`;
  }
  return out;
}
function flashMsg(t) { const m = $('#dbgMsg'); m.textContent = t; clearTimeout(flashMsg.t); flashMsg.t = setTimeout(() => m.textContent = '', 2600); }
$('#dbgCopy').addEventListener('click', () => {
  const text = dbgSummary();
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove(); flashMsg(ok ? '已复制，发给 Claude 即可' : '复制失败，请截图发给 Claude');
  };
  try { navigator.clipboard.writeText(text).then(() => flashMsg('已复制，发给 Claude 即可'), fallback); } catch (e) { fallback(); }
});
$('#dbgReset').addEventListener('click', () => { for (const d of ITEMS) DBG.val[d.id] = d.def; saveDbg(); renderDbg(); flashMsg('开关和数值已恢复默认，结论标记保留'); });
function openDbg(open) {
  dbgEl.classList.toggle('open', open); scrim.classList.toggle('open', open);
  if (open && G && !G.over && !G.paused) { G.paused = true; G.autoPaused = true; }
  if (!open && G && G.autoPaused) { G.paused = false; G.autoPaused = false; last = 0; }
}
$('#dbgTab').addEventListener('click', () => openDbg(true));
$('#dbgClose').addEventListener('click', () => openDbg(false));
scrim.addEventListener('click', () => openDbg(false));
renderDbg();

/* ===== 界面流程 ===== */
function hideOverlays() { ['#menu', '#pause', '#end'].forEach(s => $(s).hidden = true); }
function showMenu() { G = null; hideOverlays(); $('#menu').hidden = false; $('#lbar').innerHTML = ''; $('#rbar').innerHTML = ''; barEls.length = 0; R.clearFx(); }
function pauseGame() { if (!G || G.over) return; G.paused = true; G.autoPaused = false; $('#pause').hidden = false; }
$('#resume').addEventListener('click', () => { if (G) G.paused = false; $('#pause').hidden = true; last = 0; });
$('#restart').addEventListener('click', () => { if (lastSetup) newGame(lastSetup.mode, lastSetup.diff); });
$('#toMenu').addEventListener('click', showMenu);
$('#mute').addEventListener('click', e => { muted = !muted; e.target.textContent = '声音：' + (muted ? '关' : '开'); });
document.querySelectorAll('#menu [data-mode]').forEach(b => b.addEventListener('click', () => { audio(); newGame(b.dataset.mode, b.dataset.diff || 'normal'); }));
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

function endGame(w) {
  G.over = true; G.ptr = [null, null];
  const [A, B] = G.sides;
  const title = G.mode === 'ai' ? (w === 0 ? '胜利' : w === 1 ? '惜败' : '平局') : (w === 0 ? '蓝方获胜' : w === 1 ? '橙方获胜' : '平局');
  const n = v => `<span class="n">${v}</span>`, ov = $('#end');
  ov.innerHTML = `<div class="panel">
    <h2>${title}</h2>
    <div class="statgrid">
      <span class="h"></span><span class="h">${G.mode === 'ai' ? '你' : '蓝方'}</span><span class="h">${G.mode === 'ai' ? '电脑' : '橙方'}</span>
      <span class="h">基地剩余</span>${n(A.hp)}${n(B.hp)}
      <span class="h">击碎敌兵</span>${n(A.stats.kills)}${n(B.stats.kills)}
      <span class="h">打进基地</span>${n(A.stats.hits)}${n(B.stats.hits)}
      <span class="h">弹反成功</span>${n(A.stats.parries)}${n(B.stats.parries)}
      <span class="h">升起盾墙</span>${n(A.stats.walls)}${n(B.stats.walls)}
    </div>
    <div class="btns"><button class="btn main" id="again">再来一局</button><button class="btn" id="endMenu">回到菜单</button></div></div>`;
  ov.hidden = false;
  ov.querySelector('#again').addEventListener('click', () => newGame(lastSetup.mode, lastSetup.diff));
  ov.querySelector('#endMenu').addEventListener('click', showMenu);
}

function frame(ts) {
  const dt = last ? Math.min(50, ts - last) : 16; last = ts;
  const run = G && !G.over && !G.paused;
  if (run) update(dt);
  R.render(run ? dt : 0);
  updateBars(); updateHoldBubbles();
  requestAnimationFrame(frame);
}
window.__pl = { get G() { return G; }, newGame, sendWave, raise, update, render: d => R.render(d), DBG, opt, CFG };
R.fit();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
